<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A3A"/></marker></defs>
  <rect width="1080" height="380" fill="#FFFFFF"/>
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#2F5E3A">C3-adaptive — 클래스축 처방: "흡수되는 클래스만 되살린다"</text>

  <!-- step1: confusion EMA mini-grid -->
  <g id="confusion">
    <circle cx="52" cy="88" r="12" fill="#3A3A3A"/><text x="52" y="93" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="76" y="93" font-size="12.5" fill="#333333">학습 배치 혼동 누적 (EMA)</text>
    <!-- 5x5 grid: diagonal light, one hot off-diagonal cell -->
    <g id="grid" transform="translate(76,110)">
      <rect x="0" y="0" width="150" height="150" fill="#FAFAFA" stroke="#BBBBBB"/>
      <rect x="0" y="0" width="30" height="30" fill="#C9DFC9"/><rect x="30" y="30" width="30" height="30" fill="#C9DFC9"/><rect x="60" y="60" width="30" height="30" fill="#C9DFC9"/><rect x="120" y="120" width="30" height="30" fill="#C9DFC9"/>
      <rect x="90" y="90" width="30" height="30" fill="#F3D6D6"/>
      <rect x="30" y="90" width="30" height="30" fill="#C0392B"/>
      <line x1="0" y1="30" x2="150" y2="30" stroke="#DDDDDD"/><line x1="0" y1="60" x2="150" y2="60" stroke="#DDDDDD"/><line x1="0" y1="90" x2="150" y2="90" stroke="#DDDDDD"/><line x1="0" y1="120" x2="150" y2="120" stroke="#DDDDDD"/>
      <line x1="30" y1="0" x2="30" y2="150" stroke="#DDDDDD"/><line x1="60" y1="0" x2="60" y2="150" stroke="#DDDDDD"/><line x1="90" y1="0" x2="90" y2="150" stroke="#DDDDDD"/><line x1="120" y1="0" x2="120" y2="150" stroke="#DDDDDD"/>
      <text x="75" y="172" font-size="10.5" text-anchor="middle" fill="#666666">GT class → predicted class</text>
      <text x="160" y="108" font-size="10" fill="#C0392B">class 4의 오답이</text>
      <text x="160" y="121" font-size="10" fill="#C0392B">한 칸에 집중 = 흡수</text>
    </g>
  </g>
  <line x1="330" y1="180" x2="380" y2="180" stroke="#3A3A3A" stroke-width="2" marker-end="url(#a2)"/>

  <!-- step2: score bar -->
  <g id="score">
    <circle cx="404" cy="88" r="12" fill="#3A3A3A"/><text x="404" y="93" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="428" y="93" font-size="12.5" fill="#333333">클래스별 붕괴 점수 s_c</text>
    <text x="428" y="110" font-size="10.5" fill="#888888">= (안 맞는 정도) × (오답 집중도)</text>
    <g transform="translate(428,130)">
      <rect x="0" y="86" width="30" height="14" fill="#CFCFCF"/><text x="15" y="118" font-size="10" text-anchor="middle" fill="#888888">c1</text>
      <rect x="40" y="92" width="30" height="8" fill="#CFCFCF"/><text x="55" y="118" font-size="10" text-anchor="middle" fill="#888888">c2</text>
      <rect x="80" y="94" width="30" height="6" fill="#CFCFCF"/><text x="95" y="118" font-size="10" text-anchor="middle" fill="#888888">c3</text>
      <rect x="120" y="10" width="30" height="90" fill="#C0392B"/><text x="135" y="118" font-size="10" font-weight="bold" text-anchor="middle" fill="#C0392B">c4</text>
      <rect x="160" y="90" width="30" height="10" fill="#CFCFCF"/><text x="175" y="118" font-size="10" text-anchor="middle" fill="#888888">c5</text>
      <line x1="-6" y1="100" x2="200" y2="100" stroke="#999999"/>
    </g>
  </g>
  <line x1="660" y1="180" x2="710" y2="180" stroke="#3A3A3A" stroke-width="2" marker-end="url(#a2)"/>

  <!-- step3: lambda + prototype pull -->
  <g id="pull">
    <circle cx="734" cy="88" r="12" fill="#3A3A3A"/><text x="734" y="93" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="758" y="93" font-size="12.5" fill="#333333">λ_c = 점수에 비례한 당김 강도</text>
    <!-- feature space: cluster + stray points pulled to prototype -->
    <g transform="translate(758,120)">
      <rect x="0" y="0" width="270" height="160" rx="10" fill="#FAFAFA" stroke="#CCCCCC"/>
      <text x="10" y="20" font-size="10.5" fill="#888888">feature space</text>
      <!-- healthy cluster -->
      <circle cx="60" cy="60" r="26" fill="#E4EEE4" stroke="#9DBFA4"/><circle cx="60" cy="60" r="4" fill="#5E9E6C"/>
      <text x="60" y="106" font-size="10" text-anchor="middle" fill="#5E9E6C">healthy: λ≈0 (당김 없음)</text>
      <!-- collapsed class points near wrong cluster pulled back -->
      <circle cx="196" cy="52" r="26" fill="#EFE3E3" stroke="#C89B9B"/><text x="196" y="30" font-size="10" text-anchor="middle" fill="#A05252">지배 클래스</text>
      <circle cx="186" cy="48" r="4" fill="#C0392B"/><circle cx="204" cy="60" r="4" fill="#C0392B"/><circle cx="196" cy="42" r="4" fill="#C0392B"/>
      <circle cx="238" cy="118" r="5" fill="none" stroke="#C0392B" stroke-width="1.6"/>
      <text x="238" y="140" font-size="10" text-anchor="middle" fill="#C0392B">자기 prototype</text>
      <line x1="190" y1="52" x2="230" y2="110" stroke="#C0392B" stroke-width="1.6" marker-end="url(#a2)"/>
      <line x1="206" y1="63" x2="234" y2="111" stroke="#C0392B" stroke-width="1.2" marker-end="url(#a2)"/>
      <text x="150" y="150" font-size="10" fill="#C0392B">붕괴 클래스만 강하게 되당김 (λ↑)</text>
    </g>
  </g>

  <!-- bottom evidence strip -->
  <text x="30" y="356" font-size="11" fill="#666666">근거(고정팔 실측): 붕괴 심함 → +1.4 (RailTrack 4→68) · 붕괴 없음 → −0.77 (해로움) · 중간 → 표적만 +9.76 — 그래서 강도가 s_c를 따라가야 한다</text>
</svg>
