<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A3A"/></marker></defs>
  <rect width="1080" height="360" fill="#FFFFFF"/>
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#2F5E3A">UniBal-adaptive — 모달축 처방: "게으른 모달에게 개인 숙제를 준다"</text>

  <!-- step1: per-modal heads try alone -->
  <g id="heads">
    <circle cx="52" cy="80" r="12" fill="#3A3A3A"/><text x="52" y="85" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="76" y="85" font-size="12.5" fill="#333333">각 모달이 "혼자" 세그를 시도 (경량 head)</text>
    <g transform="translate(76,104)">
      <rect x="0" y="0" width="70" height="24" rx="5" fill="#D9E8F5" stroke="#7A9BB8"/><text x="35" y="16" font-size="11" text-anchor="middle" fill="#2C4A66">RGB</text>
      <rect x="0" y="34" width="70" height="24" rx="5" fill="#DFF0E2" stroke="#7FAF8A"/><text x="35" y="50" font-size="11" text-anchor="middle" fill="#2F5E3A">LiDAR</text>
      <rect x="0" y="68" width="70" height="24" rx="5" fill="#FBE9D9" stroke="#C99B6A"/><text x="35" y="84" font-size="11" text-anchor="middle" fill="#7A4E0E">Event</text>
      <rect x="0" y="102" width="70" height="24" rx="5" fill="#F0E3F0" stroke="#A583A5"/><text x="35" y="118" font-size="11" text-anchor="middle" fill="#5E3A5E">Radar</text>
      <line x1="70" y1="12" x2="112" y2="12" stroke="#888888" stroke-width="1.2" marker-end="url(#a3)"/>
      <line x1="70" y1="46" x2="112" y2="46" stroke="#888888" stroke-width="1.2" marker-end="url(#a3)"/>
      <line x1="70" y1="80" x2="112" y2="80" stroke="#888888" stroke-width="1.2" marker-end="url(#a3)"/>
      <line x1="70" y1="114" x2="112" y2="114" stroke="#888888" stroke-width="1.2" marker-end="url(#a3)"/>
      <rect x="114" y="0" width="96" height="126" rx="6" fill="#F5F5F5" stroke="#AAAAAA" stroke-dasharray="4 3"/>
      <text x="162" y="58" font-size="10.5" text-anchor="middle" fill="#666666">1×1 head</text>
      <text x="162" y="72" font-size="10.5" text-anchor="middle" fill="#666666">(train-only)</text>
    </g>
  </g>
  <line x1="330" y1="170" x2="380" y2="170" stroke="#3A3A3A" stroke-width="2" marker-end="url(#a3)"/>

  <!-- step2: loss bars reveal lazy -->
  <g id="lazy">
    <circle cx="404" cy="80" r="12" fill="#3A3A3A"/><text x="404" y="85" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="428" y="85" font-size="12.5" fill="#333333">혼자 못 푸는 모달 = 게으른 모달</text>
    <text x="428" y="102" font-size="10.5" fill="#888888">uni-modal 손실 L_m (EMA)</text>
    <g transform="translate(428,116)">
      <rect x="0" y="70" width="34" height="30" fill="#7A9BB8"/><text x="17" y="118" font-size="10" text-anchor="middle" fill="#555555">RGB</text>
      <rect x="46" y="56" width="34" height="44" fill="#7FAF8A"/><text x="63" y="118" font-size="10" text-anchor="middle" fill="#555555">LiDAR</text>
      <rect x="92" y="62" width="34" height="38" fill="#C99B6A"/><text x="109" y="118" font-size="10" text-anchor="middle" fill="#555555">Event</text>
      <rect x="138" y="12" width="34" height="88" fill="#8E5A8E"/><text x="155" y="118" font-size="10" font-weight="bold" text-anchor="middle" fill="#5E3A5E">Radar ← lazy</text>
      <line x1="-6" y1="100" x2="190" y2="100" stroke="#999999"/>
      <line x1="-6" y1="52" x2="190" y2="52" stroke="#BBBBBB" stroke-dasharray="4 3"/>
      <text x="196" y="56" font-size="9.5" fill="#999999">mean</text>
    </g>
  </g>
  <line x1="660" y1="170" x2="710" y2="170" stroke="#3A3A3A" stroke-width="2" marker-end="url(#a3)"/>

  <!-- step3: targeted supervision -->
  <g id="boost">
    <circle cx="734" cy="80" r="12" fill="#3A3A3A"/><text x="734" y="85" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="758" y="85" font-size="12.5" fill="#333333">게으른 모달만 감독 강화 (λ_u ∝ 게으름)</text>
    <g transform="translate(758,110)">
      <rect x="0" y="0" width="280" height="130" rx="10" fill="#FAFAFA" stroke="#CCCCCC"/>
      <text x="14" y="26" font-size="11" fill="#555555">λ_u,RGB ≈ 0</text>
      <text x="14" y="50" font-size="11" fill="#555555">λ_u,LiDAR ≈ 0</text>
      <text x="14" y="74" font-size="11" fill="#555555">λ_u,Event ≈ 0</text>
      <text x="14" y="102" font-size="12.5" font-weight="bold" fill="#5E3A5E">λ_u,Radar ↑↑ → radar 인코더가 진짜로 배움</text>
      <text x="14" y="120" font-size="10" fill="#888888">→ "모달 추가 = 손해"(4모달&lt;3모달) 역전 시도</text>
    </g>
  </g>

  <text x="30" y="336" font-size="11" fill="#666666">근거: MUSES 4모달(79.571) &lt; 3모달(79.788), radar 제거 시 +0.13 = laziness 병리 · DELIVER는 병리 없음(2모달 학습 시 −2.85) → λ_u가 자동으로 0에 수렴해야 함 (창발 게이트 G4)</text>
</svg>
