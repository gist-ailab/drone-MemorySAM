<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A3A"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E9E6C"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E7CC3"/></marker>
  </defs>
  <rect width="1180" height="560" fill="#FFFFFF"/>

  <!-- ══ main inference flow (middle band) ══ -->
  <!-- ① inputs -->
  <g id="inputs">
    <circle cx="60" cy="238" r="13" fill="#3A3A3A"/><text x="60" y="243" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
    <rect x="92" y="200" width="86" height="26" rx="5" fill="#D9E8F5" stroke="#7A9BB8" stroke-width="1.3"/><text x="135" y="218" font-size="12" text-anchor="middle" fill="#2C4A66">RGB</text>
    <rect x="92" y="232" width="86" height="26" rx="5" fill="#DFF0E2" stroke="#7FAF8A" stroke-width="1.3"/><text x="135" y="250" font-size="12" text-anchor="middle" fill="#2F5E3A">Depth</text>
    <rect x="92" y="264" width="86" height="26" rx="5" fill="#FBE9D9" stroke="#C99B6A" stroke-width="1.3"/><text x="135" y="282" font-size="12" text-anchor="middle" fill="#7A4E0E">Event</text>
    <rect x="92" y="296" width="86" height="26" rx="5" fill="#F0E3F0" stroke="#A583A5" stroke-width="1.3"/><text x="135" y="314" font-size="12" text-anchor="middle" fill="#5E3A5E">LiDAR</text>
    <text x="135" y="342" font-size="10" text-anchor="middle" fill="#999999">M modalities (dataset-given)</text>
  </g>
  <line x1="178" y1="260" x2="222" y2="260" stroke="#3A3A3A" stroke-width="2" marker-end="url(#a)"/>

  <!-- ② frozen backbone + LoRA -->
  <g id="backbone">
    <circle cx="245" cy="170" r="13" fill="#3A3A3A"/><text x="245" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
    <rect x="224" y="188" width="220" height="160" rx="12" fill="#E8EEF4" stroke="#8AA5BD" stroke-width="2"/>
    <text x="334" y="216" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C4A66">Frozen ViT</text>
    <text x="334" y="234" font-size="11.5" text-anchor="middle" fill="#4A6A88">DINOv3-L · shared</text>
    <rect x="244" y="252" width="42" height="22" rx="4" fill="#D9E8F5" stroke="#7A9BB8" stroke-width="1.2"/>
    <rect x="292" y="252" width="42" height="22" rx="4" fill="#DFF0E2" stroke="#7FAF8A" stroke-width="1.2"/>
    <rect x="340" y="252" width="42" height="22" rx="4" fill="#FBE9D9" stroke="#C99B6A" stroke-width="1.2"/>
    <rect x="388" y="252" width="42" height="22" rx="4" fill="#F0E3F0" stroke="#A583A5" stroke-width="1.2"/>
    <text x="334" y="294" font-size="11.5" text-anchor="middle" fill="#7A4E0E" font-weight="bold">LoRA × M</text>
    <text x="334" y="310" font-size="10.5" text-anchor="middle" fill="#8A6A2E">one adapter per modality</text>
    <text x="334" y="334" font-size="10" text-anchor="middle" fill="#8AA5BD">backbone never updated</text>
  </g>
  <line x1="444" y1="268" x2="492" y2="268" stroke="#3A3A3A" stroke-width="2" marker-end="url(#a)"/>

  <!-- ③ fusion -->
  <g id="fusion">
    <circle cx="515" cy="200" r="13" fill="#3A3A3A"/><text x="515" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
    <rect x="494" y="218" width="160" height="100" rx="12" fill="#FDEBD3" stroke="#D69A45" stroke-width="2"/>
    <text x="574" y="252" font-size="15" font-weight="bold" text-anchor="middle" fill="#7A4E0E">Fusion</text>
    <text x="574" y="272" font-size="11.5" text-anchor="middle" fill="#8A6A2E">gated-MLP + VICReg</text>
    <text x="574" y="292" font-size="10.5" text-anchor="middle" fill="#B08840">deliberately minimal</text>
  </g>
  <line x1="654" y1="268" x2="702" y2="268" stroke="#3A3A3A" stroke-width="2" marker-end="url(#a)"/>

  <!-- ④ decoder -->
  <g id="decoder">
    <circle cx="725" cy="200" r="13" fill="#3A3A3A"/><text x="725" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text>
    <rect x="704" y="218" width="160" height="100" rx="12" fill="#FDEBD3" stroke="#D69A45" stroke-width="2"/>
    <text x="784" y="252" font-size="15" font-weight="bold" text-anchor="middle" fill="#7A4E0E">Decoder</text>
    <text x="784" y="272" font-size="11.5" text-anchor="middle" fill="#8A6A2E">FPN + pixel head</text>
  </g>
  <line x1="864" y1="268" x2="912" y2="268" stroke="#3A3A3A" stroke-width="2" marker-end="url(#a)"/>

  <!-- ⑤ output -->
  <g id="output">
    <circle cx="935" cy="200" r="13" fill="#3A3A3A"/><text x="935" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5</text>
    <rect x="914" y="230" width="180" height="76" rx="12" fill="#F2F2F2" stroke="#888888" stroke-width="1.6"/>
    <text x="1004" y="262" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Segmentation</text>
    <text x="1004" y="282" font-size="10.5" text-anchor="middle" fill="#666666">same graph, all benchmarks</text>
  </g>

  <!-- ══ training-only controllers (top) ══ -->
  <g id="controllers">
    <rect x="452" y="34" width="460" height="112" rx="12" fill="#F7FBF7" stroke="#5E9E6C" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="682" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#3E7A4C">Self-adaptive prescriptions</text>
    <text x="682" y="77" font-size="10.5" text-anchor="middle" fill="#6B8F74">training only · one config everywhere</text>
    <rect x="476" y="90" width="196" height="40" rx="8" fill="#EAF4EA" stroke="#5E9E6C" stroke-width="1.4"/>
    <text x="574" y="109" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2F5E3A">C3-adaptive</text>
    <text x="574" y="123" font-size="10" text-anchor="middle" fill="#3E7A4C">class collapse → λ_c</text>
    <rect x="692" y="90" width="196" height="40" rx="8" fill="#EAF4EA" stroke="#5E9E6C" stroke-width="1.4"/>
    <text x="790" y="109" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2F5E3A">UniBal-adaptive</text>
    <text x="790" y="123" font-size="10" text-anchor="middle" fill="#3E7A4C">modality laziness → λ_u</text>
  </g>
  <line x1="574" y1="132" x2="574" y2="214" stroke="#5E9E6C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <line x1="790" y1="132" x2="380" y2="248" stroke="#5E9E6C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="600" y="176" font-size="10" fill="#3E7A4C">extra loss on fusion</text>
  <text x="600" y="190" font-size="10" fill="#3E7A4C">features</text>
  <text x="512" y="176" font-size="10" text-anchor="end" fill="#3E7A4C">extra loss on</text>
  <text x="512" y="190" font-size="10" text-anchor="end" fill="#3E7A4C">lazy modalities</text>

  <!-- ══ pretraining init (bottom) ══ -->
  <g id="pretrain">
    <rect x="92" y="420" width="420" height="92" rx="12" fill="#F6F3FB" stroke="#8E7CC3" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="302" y="450" font-size="14" font-weight="bold" text-anchor="middle" fill="#5B4A8A">Alignment pretraining</text>
    <text x="302" y="470" font-size="11" text-anchor="middle" fill="#7A6BA0">500k web images → pseudo-modalities → masked cross-modal reconstruction</text>
    <text x="302" y="490" font-size="10.5" text-anchor="middle" fill="#9C8FBB">initialization only · +0.74 measured</text>
  </g>
  <path d="M 330 418 C 330 380, 334 372, 334 352" fill="none" stroke="#8E7CC3" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ap)"/>
  <text x="344" y="386" font-size="10.5" fill="#5B4A8A">warm-starts LoRA + Fusion</text>

  <!-- legend -->
  <g id="legend" font-size="10.5">
    <rect x="620" y="440" width="14" height="14" rx="3" fill="#E8EEF4" stroke="#8AA5BD"/><text x="640" y="451" fill="#333333">frozen</text>
    <rect x="700" y="440" width="14" height="14" rx="3" fill="#FDEBD3" stroke="#D69A45"/><text x="720" y="451" fill="#333333">trainable</text>
    <rect x="790" y="440" width="14" height="14" rx="3" fill="#EAF4EA" stroke="#5E9E6C" stroke-dasharray="3 2"/><text x="810" y="451" fill="#333333">training-only</text>
    <rect x="900" y="440" width="14" height="14" rx="3" fill="#F6F3FB" stroke="#8E7CC3" stroke-dasharray="3 2"/><text x="920" y="451" fill="#333333">init-only</text>
    <text x="620" y="480" fill="#999999" font-size="10">follow 1→5 for inference · dashed = exists only during training</text>
  </g>
</svg>
