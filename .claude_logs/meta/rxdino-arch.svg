<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Helvetica, Arial, sans-serif">
  <!-- RxDINO (P52) architecture — editable: every block is a <g> with plain rect/text, no filters/CSS -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6FA876"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#FFFFFF"/>

  <!-- ═══════════ Training-only region (top, dashed) ═══════════ -->
  <g id="training-only-region">
    <rect x="392" y="28" width="856" height="252" rx="10" fill="#FAFDF9" stroke="#6FA876" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="410" y="52" font-size="15" font-weight="bold" fill="#3E7A4C">Self-adaptive prescriptions — training-only, discarded at inference</text>
    <text x="410" y="70" font-size="11.5" fill="#6B8F74">single config for all benchmarks · per-dataset behaviour emerges from online pathology indicators (train-batch statistics only)</text>
  </g>

  <!-- C3-adaptive controller -->
  <g id="c3-adaptive">
    <rect x="410" y="84" width="400" height="86" rx="8" fill="#EAF4EA" stroke="#6FA876" stroke-width="1.5"/>
    <text x="426" y="106" font-size="13.5" font-weight="bold" fill="#2F5E3A">C3-adaptive · class-axis prescription</text>
    <text x="426" y="126" font-size="11.5" fill="#333333">confusion EMA M (C×C, train batches) → collapse score</text>
    <text x="426" y="142" font-size="11.5" fill="#333333">s&#8342; = (1−recall&#8342;) · top-1-confuser concentration&#8342;</text>
    <text x="426" y="158" font-size="11.5" font-weight="bold" fill="#333333">λ&#8342; = λ_max · clip(s&#8342;/τ, 0, 1)  → per-class prototype pull</text>
  </g>
  <g id="c3-loss">
    <rect x="836" y="94" width="176" height="66" rx="8" fill="#EAF4EA" stroke="#6FA876" stroke-width="1.5"/>
    <text x="852" y="118" font-size="12.5" font-weight="bold" fill="#2F5E3A">Prototype loss</text>
    <text x="852" y="134" font-size="11" fill="#333333">per-class weighted CE</text>
    <text x="852" y="149" font-size="11" fill="#333333">vs EMA class prototypes</text>
  </g>
  <line x1="810" y1="127" x2="834" y2="127" stroke="#6FA876" stroke-width="1.5" marker-end="url(#arrg)"/>

  <!-- UniBal-adaptive controller -->
  <g id="unibal-adaptive">
    <rect x="410" y="182" width="400" height="84" rx="8" fill="#EAF4EA" stroke="#6FA876" stroke-width="1.5"/>
    <text x="426" y="204" font-size="13.5" font-weight="bold" fill="#2F5E3A">UniBal-adaptive · modality-axis prescription</text>
    <text x="426" y="224" font-size="11.5" fill="#333333">per-modality aux heads (GN→1×1) → uni-modal CE loss L&#8344;</text>
    <text x="426" y="240" font-size="11.5" fill="#333333">laziness g&#8344; = clip(L&#8344;/mean&#8342;L&#8342; − 1, 0, cap)</text>
    <text x="426" y="256" font-size="11.5" font-weight="bold" fill="#333333">λ&#7524;,&#8344; = λ&#7524;_max · g&#8344;/cap  → supervise lazy modalities harder</text>
  </g>
  <g id="unibal-loss">
    <rect x="836" y="192" width="176" height="66" rx="8" fill="#EAF4EA" stroke="#6FA876" stroke-width="1.5"/>
    <text x="852" y="216" font-size="12.5" font-weight="bold" fill="#2F5E3A">Uni-modal CE</text>
    <text x="852" y="232" font-size="11" fill="#333333">same seg GT, per modality</text>
    <text x="852" y="247" font-size="11" fill="#333333">heads dropped after training</text>
  </g>
  <line x1="810" y1="224" x2="834" y2="224" stroke="#6FA876" stroke-width="1.5" marker-end="url(#arrg)"/>

  <!-- λ trajectory note -->
  <g id="lambda-emergence">
    <rect x="1032" y="94" width="196" height="164" rx="8" fill="#FFFFFF" stroke="#6FA876" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="1046" y="116" font-size="12" font-weight="bold" fill="#2F5E3A">Emergent behaviour (G4)</text>
    <text x="1046" y="136" font-size="11" fill="#333333">DELIVER: λ(RailTrack) ↑</text>
    <text x="1046" y="152" font-size="11" fill="#333333">MUSES: all λ&#8342; ≈ 0,</text>
    <text x="1046" y="166" font-size="11" fill="#333333">   λ&#7524;(radar) ↑</text>
    <text x="1046" y="182" font-size="11" fill="#333333">MCubeS: λ(rubber) ↑</text>
    <text x="1046" y="204" font-size="10.5" fill="#6B8F74">identical config —</text>
    <text x="1046" y="218" font-size="10.5" fill="#6B8F74">trajectories diverge by</text>
    <text x="1046" y="232" font-size="10.5" fill="#6B8F74">dataset pathology alone</text>
  </g>

  <!-- gradient arrows from controllers down to encoder/fusion -->
  <line x1="610" y1="268" x2="610" y2="428" stroke="#6FA876" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
  <text x="618" y="330" font-size="10.5" fill="#3E7A4C">gradients only</text>
  <line x1="924" y1="260" x2="924" y2="380" stroke="#6FA876" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrg)"/>

  <!-- ═══════════ Inference path (middle band) ═══════════ -->

  <!-- Inputs -->
  <g id="inputs">
    <rect x="36" y="330" width="120" height="34" rx="6" fill="#F2F2F2" stroke="#888888" stroke-width="1.2"/>
    <text x="96" y="352" font-size="12.5" text-anchor="middle" fill="#222222">RGB</text>
    <rect x="36" y="372" width="120" height="34" rx="6" fill="#F2F2F2" stroke="#888888" stroke-width="1.2"/>
    <text x="96" y="394" font-size="12.5" text-anchor="middle" fill="#222222">Depth</text>
    <rect x="36" y="414" width="120" height="34" rx="6" fill="#F2F2F2" stroke="#888888" stroke-width="1.2"/>
    <text x="96" y="436" font-size="12.5" text-anchor="middle" fill="#222222">Event</text>
    <rect x="36" y="456" width="120" height="34" rx="6" fill="#F2F2F2" stroke="#888888" stroke-width="1.2"/>
    <text x="96" y="478" font-size="12.5" text-anchor="middle" fill="#222222">LiDAR</text>
    <text x="36" y="516" font-size="10.5" fill="#666666">modality set = dataset-provided</text>
    <text x="36" y="530" font-size="10.5" fill="#666666">(MUSES: R·L·E·Radar / MCubeS: R·AoLP·DoLP·NIR)</text>
  </g>

  <!-- arrows inputs -> backbone -->
  <line x1="156" y1="347" x2="196" y2="380" stroke="#444444" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="156" y1="389" x2="196" y2="400" stroke="#444444" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="156" y1="431" x2="196" y2="420" stroke="#444444" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="156" y1="473" x2="196" y2="440" stroke="#444444" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Frozen backbone with LoRA -->
  <g id="backbone">
    <rect x="198" y="330" width="240" height="200" rx="10" fill="#E8EEF4" stroke="#8AA5BD" stroke-width="1.8"/>
    <text x="318" y="356" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#2C4A66">DINOv3-L ViT · 24 blocks</text>
    <text x="318" y="374" font-size="12" text-anchor="middle" fill="#4A6A88">FROZEN — 304 M (shared)</text>
    <g id="lora-adapters">
      <rect x="216" y="392" width="94" height="26" rx="5" fill="#FDEBD3" stroke="#D69A45" stroke-width="1.3"/>
      <text x="263" y="409" font-size="10.5" text-anchor="middle" fill="#7A4E0E">LoRA_rgb (Q/V, r16)</text>
      <rect x="326" y="392" width="94" height="26" rx="5" fill="#FDEBD3" stroke="#D69A45" stroke-width="1.3"/>
      <text x="373" y="409" font-size="10.5" text-anchor="middle" fill="#7A4E0E">LoRA_depth</text>
      <rect x="216" y="426" width="94" height="26" rx="5" fill="#FDEBD3" stroke="#D69A45" stroke-width="1.3"/>
      <text x="263" y="443" font-size="10.5" text-anchor="middle" fill="#7A4E0E">LoRA_event</text>
      <rect x="326" y="426" width="94" height="26" rx="5" fill="#FDEBD3" stroke="#D69A45" stroke-width="1.3"/>
      <text x="373" y="443" font-size="10.5" text-anchor="middle" fill="#7A4E0E">LoRA_lidar</text>
    </g>
    <text x="318" y="474" font-size="11" text-anchor="middle" fill="#4A6A88">one shared frozen encoder,</text>
    <text x="318" y="489" font-size="11" text-anchor="middle" fill="#4A6A88">per-modality low-rank adaptation</text>
    <text x="318" y="512" font-size="10.5" text-anchor="middle" fill="#8AA5BD">tokens: 4 × (B, N, 1024) @ stride 16</text>
  </g>

  <!-- arrow backbone -> fusion -->
  <line x1="438" y1="430" x2="486" y2="430" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="462" y="420" font-size="10" text-anchor="middle" fill="#666666">per-modal</text>
  <text x="462" y="447" font-size="10" text-anchor="middle" fill="#666666">tokens</text>

  <!-- Fusion trunk -->
  <g id="fusion-trunk">
    <rect x="488" y="376" width="244" height="108" rx="10" fill="#FDEBD3" stroke="#D69A45" stroke-width="1.8"/>
    <text x="610" y="402" font-size="14" font-weight="bold" text-anchor="middle" fill="#7A4E0E">Fusion trunk</text>
    <text x="610" y="422" font-size="12" text-anchor="middle" fill="#333333">gated-MLP · γ = tanh(0.1)</text>
    <text x="610" y="440" font-size="12" text-anchor="middle" fill="#333333">+ VICReg (var + cov)</text>
    <text x="610" y="456" font-size="11" text-anchor="middle" fill="#8A6A2E">rank restoration: eff-rank 4.7 → 78+</text>
    <text x="610" y="474" font-size="10.5" text-anchor="middle" fill="#8A6A2E">deliberately minimal — see elimination chain</text>
  </g>

  <!-- arrow fusion -> decoder -->
  <line x1="732" y1="430" x2="780" y2="430" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Decoder -->
  <g id="decoder">
    <rect x="782" y="376" width="212" height="108" rx="10" fill="#FDEBD3" stroke="#D69A45" stroke-width="1.8"/>
    <text x="888" y="402" font-size="14" font-weight="bold" text-anchor="middle" fill="#7A4E0E">Decoder</text>
    <text x="888" y="422" font-size="12" text-anchor="middle" fill="#333333">SimpleFPN (strides 4/8/16/32)</text>
    <text x="888" y="440" font-size="12" text-anchor="middle" fill="#333333">+ pixel head</text>
    <rect x="798" y="450" width="180" height="24" rx="5" fill="#FFFFFF" stroke="#D69A45" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="888" y="466" font-size="10.5" text-anchor="middle" fill="#8A6A2E">M2F-lite aux (deep-sup, train-only)</text>
  </g>

  <!-- arrow decoder -> output -->
  <line x1="994" y1="430" x2="1042" y2="430" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Output -->
  <g id="output">
    <rect x="1044" y="398" width="184" height="64" rx="8" fill="#F2F2F2" stroke="#888888" stroke-width="1.4"/>
    <text x="1136" y="424" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">Semantic map</text>
    <text x="1136" y="444" font-size="11" text-anchor="middle" fill="#555555">identical graph on all 3 benchmarks</text>
  </g>

  <!-- ═══════════ Pretraining init (bottom-left, dashed) ═══════════ -->
  <g id="pretrain-init">
    <rect x="36" y="580" width="520" height="128" rx="10" fill="#F6F3FB" stroke="#8E7CC3" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="54" y="606" font-size="13.5" font-weight="bold" fill="#5B4A8A">Alignment pretraining (P50) — initialization only</text>
    <text x="54" y="628" font-size="11.5" fill="#333333">Places365 500 k × pseudo-modalities (depth · pseudo-LiDAR · event · AoLP · DoLP · NIR proxies)</text>
    <text x="54" y="646" font-size="11.5" fill="#333333">masked cross-modal reconstruction → adapters + trunk learn modality correspondence</text>
    <text x="54" y="664" font-size="11.5" fill="#333333">backbone stays frozen · reconstruction head discarded</text>
    <text x="54" y="690" font-size="11" font-weight="bold" fill="#5B4A8A">measured gain: +0.74 ~ +1.38 legal test (matched-seed control)</text>
  </g>
  <path d="M 380 578 C 380 540, 330 540, 322 532" fill="none" stroke="#8E7CC3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="392" y="556" font-size="10.5" fill="#5B4A8A">initializes LoRA + trunk (weights only)</text>

  <!-- ═══════════ Legend ═══════════ -->
  <g id="legend">
    <rect x="700" y="600" width="528" height="100" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
    <text x="716" y="624" font-size="12" font-weight="bold" fill="#222222">Legend</text>
    <rect x="716" y="636" width="26" height="16" rx="3" fill="#E8EEF4" stroke="#8AA5BD" stroke-width="1.2"/>
    <text x="750" y="649" font-size="11" fill="#333333">frozen (304 M, shared)</text>
    <rect x="716" y="660" width="26" height="16" rx="3" fill="#FDEBD3" stroke="#D69A45" stroke-width="1.2"/>
    <text x="750" y="673" font-size="11" fill="#333333">trainable (~50 M: LoRA · trunk · decoder)</text>
    <rect x="946" y="636" width="26" height="16" rx="3" fill="#EAF4EA" stroke="#6FA876" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="980" y="649" font-size="11" fill="#333333">training-only (discarded at inference)</text>
    <rect x="946" y="660" width="26" height="16" rx="3" fill="#F6F3FB" stroke="#8E7CC3" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="980" y="673" font-size="11" fill="#333333">initialization only (pretraining)</text>
    <text x="716" y="692" font-size="10.5" fill="#777777">RxDINO (P52) — one architecture, one config; prescriptions self-calibrate to dataset pathology</text>
  </g>
</svg>
