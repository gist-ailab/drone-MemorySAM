<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A3A"/></marker>
  <marker id="ap4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E7CC3"/></marker></defs>
  <rect width="1080" height="330" fill="#FFFFFF"/>
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#5B4A8A">Alignment pretraining (P50) — "렌즈를 공장에서 미리 길들인다"</text>

  <!-- step1 corpus -->
  <g id="corpus">
    <circle cx="52" cy="80" r="12" fill="#3A3A3A"/><text x="52" y="85" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="76" y="85" font-size="12.5" fill="#333333">웹 이미지 500k (RGB만)</text>
    <g transform="translate(76,100)">
      <rect x="8" y="8" width="84" height="60" rx="6" fill="#EFEFEF" stroke="#AAAAAA"/>
      <rect x="4" y="4" width="84" height="60" rx="6" fill="#F5F5F5" stroke="#AAAAAA"/>
      <rect x="0" y="0" width="84" height="60" rx="6" fill="#D9E8F5" stroke="#7A9BB8"/>
      <text x="42" y="35" font-size="11" text-anchor="middle" fill="#2C4A66">RGB</text>
    </g>
  </g>
  <line x1="190" y1="132" x2="238" y2="132" stroke="#3A3A3A" stroke-width="2" marker-end="url(#a4)"/>

  <!-- step2 pseudo modalities -->
  <g id="pseudo">
    <circle cx="262" cy="80" r="12" fill="#3A3A3A"/><text x="262" y="85" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="286" y="85" font-size="12.5" fill="#333333">가짜 센서 6종 생성 (전부 유도 proxy)</text>
    <g transform="translate(286,100)" font-size="10.5">
      <rect x="0" y="0" width="86" height="24" rx="5" fill="#DFF0E2" stroke="#7FAF8A"/><text x="43" y="16" text-anchor="middle" fill="#2F5E3A">depth (추정)</text>
      <rect x="96" y="0" width="86" height="24" rx="5" fill="#F0E3F0" stroke="#A583A5"/><text x="139" y="16" text-anchor="middle" fill="#5E3A5E">LiDAR (희소화)</text>
      <rect x="0" y="32" width="86" height="24" rx="5" fill="#FBE9D9" stroke="#C99B6A"/><text x="43" y="48" text-anchor="middle" fill="#7A4E0E">event (미분)</text>
      <rect x="96" y="32" width="86" height="24" rx="5" fill="#E4E9F5" stroke="#8A93BD"/><text x="139" y="48" text-anchor="middle" fill="#3A4470">AoLP·DoLP</text>
      <rect x="48" y="64" width="86" height="24" rx="5" fill="#F3EFE0" stroke="#B3A96E"/><text x="91" y="80" text-anchor="middle" fill="#6E663A">NIR</text>
    </g>
  </g>
  <line x1="486" y1="132" x2="534" y2="132" stroke="#3A3A3A" stroke-width="2" marker-end="url(#a4)"/>

  <!-- step3 masked reconstruction -->
  <g id="mask">
    <circle cx="558" cy="80" r="12" fill="#3A3A3A"/><text x="558" y="85" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="582" y="85" font-size="12.5" fill="#333333">빈칸 채우기 숙제 (masked reconstruction)</text>
    <g transform="translate(582,100)">
      <rect x="0" y="0" width="80" height="56" rx="6" fill="#DFF0E2" stroke="#7FAF8A"/>
      <rect x="10" y="10" width="24" height="16" fill="#666666"/><rect x="44" y="28" width="22" height="16" fill="#666666"/>
      <text x="40" y="72" font-size="10" text-anchor="middle" fill="#666666">한 모달을 가림</text>
      <line x1="88" y1="28" x2="128" y2="28" stroke="#888888" stroke-width="1.4" marker-end="url(#a4)"/>
      <rect x="132" y="0" width="80" height="56" rx="6" fill="#FFFFFF" stroke="#7FAF8A"/>
      <text x="172" y="24" font-size="10" text-anchor="middle" fill="#2F5E3A">다른 모달로</text>
      <text x="172" y="38" font-size="10" text-anchor="middle" fill="#2F5E3A">복원</text>
      <text x="106" y="90" font-size="10" text-anchor="middle" fill="#888888">→ 모달 대응관계를 선학습</text>
    </g>
  </g>
  <line x1="822" y1="132" x2="870" y2="132" stroke="#8E7CC3" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ap4)"/>

  <!-- step4 init transfer -->
  <g id="init">
    <circle cx="894" cy="80" r="12" fill="#3A3A3A"/><text x="894" y="85" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text>
    <text x="918" y="85" font-size="12.5" fill="#333333">가중치 이식</text>
    <g transform="translate(880,100)">
      <rect x="0" y="0" width="170" height="90" rx="10" fill="#F6F3FB" stroke="#8E7CC3" stroke-width="1.6"/>
      <text x="85" y="26" font-size="11.5" text-anchor="middle" fill="#5B4A8A" font-weight="bold">LoRA + Fusion만</text>
      <text x="85" y="44" font-size="10.5" text-anchor="middle" fill="#7A6BA0">본학습의 출발점으로</text>
      <text x="85" y="60" font-size="10.5" text-anchor="middle" fill="#7A6BA0">(구조·백본 무변경)</text>
      <text x="85" y="80" font-size="10.5" text-anchor="middle" fill="#5B4A8A" font-weight="bold">실측 +0.74~+1.38</text>
    </g>
  </g>

  <text x="30" y="306" font-size="11" fill="#666666">왜: 어댑터·융합부는 원래 타깃 3~4천 장만으로 맨땅 학습이었음 — "융합 모듈보다 정렬 사전학습이 1차"(VLM 교훈)를 센서 도메인에 이식. 복원 head는 사전학습 후 폐기.</text>
</svg>
