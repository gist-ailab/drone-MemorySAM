# MemorySAM server registry — single source of truth for remote experiment launching.
# Read by scripts/remote_exp.sh and by the AI assistant each session (see .claude_logs/13_servers_and_launch.md).
#
# Format (pipe-delimited, one server per line):
#   alias | repo_path | conda_env | default_gpus | notes
#
#   alias        : ssh alias from ~/.ssh/config (passwordless login must be set up)
#   repo_path    : absolute path of the drone-MemorySAM repo on that server
#   conda_env    : conda env name to `conda activate` before running
#   default_gpus : default CUDA_VISIBLE_DEVICES if not given on the command line (e.g. 0,1,2,3)
#   notes        : free text (GPU model/count, anything)
#
# Use the literal token  FILL_ME  for any field you don't know yet; remote_exp.sh refuses to launch on it.
#
# alias   | repo_path                                                  | conda_env | default_gpus    | notes
