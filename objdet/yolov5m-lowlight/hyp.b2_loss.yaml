# YOLOv5m — B2 rung: LOSS group isolated (focal + EIoU + label-smoothing).
# Same as stock hyp.scratch-low EXCEPT fl_gamma; NO mixing yet (that is B3), so
# the ablation cleanly attributes the delta to the loss changes. Arch untouched.
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 1.5        # <-- focal on cls+obj (with EIoU via YOLO_EIOU=1 + --label-smoothing)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.3           # <-- night-aug owns darkening
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0           # B3 turns these on
copy_paste: 0.0
