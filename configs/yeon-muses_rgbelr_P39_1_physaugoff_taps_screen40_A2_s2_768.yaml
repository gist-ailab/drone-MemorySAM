# 24GB 변형: 크롭 1024→768, 그 외 동일. 사유 = 2026-10-22 yeon muses_a2_s2 1024² 크롭 CUDA OOM 크래시(로그: logs/muses_a2_s2_launch.log, rank0 23.51GiB/23.56GiB·rank1 23.21GiB/23.56GiB 둘 다 진짜 메모리 부족). hpca100 디스크 고갈+10-30 임대 종료로 24GB 카드 전용 변형 필요(method 지시, 2026-10-27).
# [MUSES 4모달 논문 모델 — A2, yeon 파생 2026-10-22] 원본 = configs/hpca100-muses_rgbelr_P39_1_physaugoff_taps_screen40_A2_s2.yaml
#   hpca100은 user 지시로 동료에게 양보 중이라 배치 금지 상태. 교사 e1m4_teacher(DRN-261019-01)가 yeon에서 200ep 완주(val mIoU best 82.17, ep170)했고
#   DATASET.ROOT가 yeon에도 '/SSDb/jemo_maeng/dset/MUSES'로 동일 경로라 이식 가능 — DEVICE/SAVE_DIR/DATASET.ROOT/TEACHER_CKPT만 변경, 나머지 키는 원본과 완전히 동일.
#   바뀐 것: DATASET.MODALS(+radar) · TRAIN.QAF(두 패스 + E1M4 교사 증류, DELIVER Q2 와 같은 값) · MODEL.HIRES_ADAPTER(DELIVER A2 와 같은 설정) · SAVE_DIR.
#   짝(비교 기준): 같은 시드의 4모달 E1M 스크린은 없음 — 판정 기준선은 MUSES 4모달 기존 최고 P39.1-rank 4모달(공식 test 79.571, 시드2) 과 DGFusion 79.5.
#   TRAIN.QAF.TEACHER_CKPT = e1m4_teacher val-best(top1, ep170, mIoU 82.17) 체크포인트 — 2026-10-22 기동 검증 시 로그에 "[QAF-T] teacher 로드 missing=0" 확인 필수.
# [E1M 시드2] E1M(중간층 4탭 읽기의 MUSES 이식)의 시드 페어, 40ep 스크린.
#   🔴 왜 필요한가(2026-09-13): E13M(E1M + 센서별 prototype)이 두 시드 모두 **E1M 대비 야간 악조건에서
#   깎였다**(fog/night −1.14/−1.79 · rain/night −1.84/−2.07). 그런데 **E1M 은 시드 하나(3407)뿐**이라
#   E1M 자체의 야간 시드 편차를 모른다. 이 런이 있어야 그 손실이 prototype 탓인지 시드 노이즈인지 가려진다.
#   야간 조건은 조건당 25장이고 fog/night 은 등장 클래스가 11개뿐이라 편차가 클 수 있다.
#
#   파일명의 `seed2` 는 P39.1 레시피 이름이지 시드 값이 아니다(시드1 도 이름에 seed2 가 있으나 3407 이다).
#   판정은 `tools/eval_muses_official.py` 의 native 1080×1920 val 로만 한다(레터박스 1024² 는 공식 아님).
#   기동 검증: `fix_seeds(20260902)` · TAPS `[6,12,18,24]` · RANDOM INIT 없음 · 진행 전진.
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/yeon_muses_rgbelr_P39_1_physaugoff_taps_screen40_A2_s2_768'  # [DAILY-CARDS 40ep 스크린] decisions/2026-09-07-daily-cycle-experiment-cards.md — _768 접미사: 1024² OOM 크래시와 출력 폴더 분리(monitoring 세션, 2026-10-27)

MODEL:
  TAPS:                                   # [E1-MUSES] DINOv3 다중 레벨 탭 읽기(카드 E1을 MUSES로 이식). E7(off)과 유일 변수
    ENABLE : true
    LAYERS : [6, 12, 18, 24]              # 1-indexed 블록(24=마지막)
    MODE   : per_modal                    # 센서별 투영 → FPN 4레벨 합산
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  # ═══ [A2] 고해상 경로(HiRes Adapter) — DELIVER A2 와 같은 설정 ═══
  HIRES_ADAPTER:
    ENABLE           : true
    DIM              : 512
    STEM_DIM         : 64
    MODE             : shared_stem
    N_HEADS          : 8
    N_POINTS         : 4
    DEFORM_RATIO     : 0.5
    CFFN_RATIO       : 0.25
    EXTRA_EXTRACTORS : 2
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2] fog_night 유해 실증(07-20) — off, ablation 분리
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  # [P36] per-class router 유지 (P38-DELIVER와 동일 — M2F 대비 1-변수 비교)
  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:        { ENABLE: false }   # P37a 헤드 off
  CLASS_TOKEN: { ENABLE: false }   # P37b 헤드 off

  # [P38] MaskQueryLite (Mask2Former-lite) — 헤드
  M2F:
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256                   # query dim_t (params ≈5.5M)
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0                   # zero-init residual (do not change)
    W_CLS           : 2.0                   # M2F 표준 가중 2/5/5
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544                 # point-sampled mask losses (M2F 관행)
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5                   # aux['m2f_loss'] 전역 스케일
    SRC             : modal                 # [P39-V2] query가 per-modal 토큰 합집합을 attend (fused rank-병목 우회)
    ANCHORED        : true                  # [P39-V3] K개 클래스 앵커 query (고정 할당) + 나머지 Hungarian
    POINT_QUOTA     : 256                   # [P39-V4] GT 영역별 최소 포인트 쿼터 (thin-mask 기아 수정)


  # [P39] Dual-Path Compete (decisions/2026-07-20-p39-dual-path-compete-proposal.md)
  P39:
    TRUNK_EXP       : true                  # V1: fused += Σ P_m(f_m) (rank 확장, 주 경로)
    ARBITER         : true                  # V5: per-class Λ 중재 + path dropout 경쟁 (β 잔차 대체)
    PATH_DROPOUT_P  : 0.25                  # dense-only / query-only 각 25%
    ROUTER_CE_W     : 0.4                   # router 직접 CE 감독 가중
    TRUNK_MODE      : gated_mlp             # [P39.1-R1] 선형→LN·MLP·tanh(γ) 게이트 (저rank 지름길 제거, γ=0.1 init — 0이면 gradient가 안 흘러 사장됨)
    TRUNK_HIDDEN    : 256
    VICREG:                                 # [P39.1-R2] var+cov rank 복원 (per-modal 토큰, lidar 강조)
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20


DATASET:
  NAME          : MUSES
  ROOT          : '/SSDb/jemo_maeng/dset/MUSES'   # [yeon 파생] hpca100의 '/home/jovyan/SSDb/...' 접두어 제거
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'event', 'radar']   # 🔴 4모달(radar 추가)
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  PHYSAUG:
    ENABLE    : false   # [E7] 공정선 정합: 경쟁작(CAFuser/DGFusion)은 물리 열화 증강 미사용 (user 2026-09-07)
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 1                 # 24GB 카드 기준 BS2@1024²는 OOM(22.5GB). BS1로 fit(~12GB).
                                    # seg accum=ceil(16/(BS×world))가 eff-batch 자동보정 → world=2(yeon 실배치)면 accum8, world=4(hpca100 원안)면 accum4로 자동 맞춰짐.
                                    # grad-ckpt는 active_modality 버그라 못 켬 → BS로만 조절.
  SEED          : 20260902   # [E1M 시드2] 시드1 은 SEED 키가 없어 코드 기본값 3407 로 돌았다(semseg/utils/utils.py:20).
  EPOCHS        : 40   # [스크린] 40ep 조기 판정(P50 val-best ep30 전례). 확정은 200ep 3페어
  EVAL_START    : 0
  EVAL_INTERVAL : 5
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

  # ═══ [Q2 레시피] 두 패스 학습(clean CE + 열화 CE) + 동결 E1M4 교사 증류 — DELIVER Q2 와 같은 값 ═══
  QAF:
    ENABLE            : true
    DEGRADE_P         : 0.5
    MISSING_FRAC      : 0.2
    SEVERITY_SCHEDULE : [[0, 0.3], [10, 0.6], [20, 1.0]]
    TEACHER_CKPT      : '/SSDe/jemo_maeng/src/Project/Drone24/detection/drone-MemorySAM-e1m4teacher/outputs/ReliaDINO/yeon_muses_rgbelr_P39_1_physaugoff_taps_full200_E1M4/MUSES_ReliaDINO-ViTL16_iler/epoch170_82.17_top1_checkpoint.pth'   # e1m4_teacher val-best top1(ep170, mIoU 82.17), 2026-10-22 교사 완주 확인 후 채움
    KD_W              : 0.5
    KD_T              : 2.0
    QUALITY_W         : 0.1
    IDENTITY_W        : 0.1
    CLEAN_PASS        : true
    SEED              : 0

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 15
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 4
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : true
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/MUSES'
  IMAGE_SIZE    : [768, 768]
  OVERLAY       : false
