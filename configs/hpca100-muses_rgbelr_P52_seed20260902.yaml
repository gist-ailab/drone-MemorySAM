# ═══ [P52] RxDINO — 단일-config 자기-적응 처방 · MUSES 4모달(img/lidar/event/radar) ═══
# 캠페인 최종 본실험(3벤치 × 시드2). 이 파일 = MUSES / seed 20260902.
#
# 정본 설계 : .claude_logs/decisions/2026-08-31-p52-rxdino-adaptive-amendment.md
# UniBal 캘리브레이션(CAP=0.7 확정) : .claude_logs/experiments/analysis/2026-09-04-p52-unibal-calibration.md
#   ← 이 캘리브레이션이 바로 MUSES P47-2 고정런(λ_u=0.4 균일, val 82.06) 실측에서 나왔다. G2=81.42.
# init 결정(2026-09-07 → 09-07 스모크로 개정) : MUSES 는 🔴무-init🔴 (PRETRAINED_ADAPTERS 키 없음).
#   원안은 "DELIVER·MUSES 모두 Phase1(프로브) 어댑터로 init"이었으나, config 작성 스모크에서 MUSES 로드가
#   깨짐을 실측했다(_p52_smoke.py). 원인 = Phase1 코퍼스가 25클래스(DELIVER 매칭, p50map NUM_CLASSES:25)로
#   사전학습되어 어댑터에 클래스-종속 fusion 헤드(fusion.aux_decoders.*.net.3, fusion.router.heads.*.2)가
#   [25,...] shape 로 들어 있는데, MUSES 는 19클래스라 [19,...] 와 size mismatch → load_state_dict 가
#   RuntimeError 로 즉사한다(strict=False 여도 size mismatch 는 무시되지 않는다). LoRA(인덱스-키 텐서
#   a_q shape=(M=4,r=8,in))·트렁크·fpn 은 클래스 무관이라 호환되지만(19→19 대조 로드는 unexpected=0 통과,
#   16개 mismatch 전부 클래스-종속 헤드로 국한 확인), 어댑터 로더가 그룹을 부분 필터하지 않으므로 통째 로드가
#   깨진다. 지시서가 명시한 예외("MUSES 로드가 실제로 깨지면 그때만 무-init")에 해당 → 무-init 확정.
#   (DELIVER 는 25==25 로 정상 로드되어 Phase1 init 유지.)
#
# 🔴 3벤치 method-config byte-동일 : MODEL.P46.C3_PROTO · P47_2 · C3_ADAPTIVE · UNIBAL_ADAPTIVE.
#   MUSES 는 C3-adaptive 가 켜지지만 병리가 클래스축이 아니라 조건축이므로 G4 예측 = 전 클래스 λ_c≈0
#   (동일 config 인데 λ 궤적이 DELIVER 와 갈라짐 = 자기-진단 창발 증거).
# 🔴 GRADIENT_CHECKPOINT: false (encoder active_modality 버그, ISSUE-027).
#   torchrun --standalone --nproc_per_node=4 train_reliadino.py --cfg <this>
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/hpca100_muses_rgbelr_P52_seed20260902'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  # 🔴 MUSES = 무-init : PRETRAINED_ADAPTERS 키를 두지 않는다(상단 헤더 = 로드 size-mismatch 실측 근거).

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2]
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:        { ENABLE: false }
  CLASS_TOKEN: { ENABLE: false }

  M2F:
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0
    W_CLS           : 2.0
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5
    SRC             : modal
    ANCHORED        : true
    POINT_QUOTA     : 256

  P39:
    TRUNK_EXP       : true
    ARBITER         : true
    PATH_DROPOUT_P  : 0.25
    ROUTER_CE_W     : 0.4
    TRUNK_MODE      : gated_mlp
    TRUNK_HIDDEN    : 256
    VICREG:
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  # ═══ [P46-CTR] C3 prototype (C3-adaptive 가 λ_c 를 지배) — 🔴 세 벤치 byte-동일 블록 #1 ═══
  #   MUSES 템플릿엔 원래 P46 블록이 없었다. C3_ADAPTIVE 전제(C3_PROTO.ENABLE=true) 충족 위해 추가.
  P46:
    C1_RCS:
      ENABLE        : false
      MODE          : daformer
      TEMP          : 0.01
      MIN_PIXELS    : 1
      LOSS_BLEND_W  : 1.0
      EMA_M         : 0.99
      EMA_INTERVAL  : 1
      REFRESH       : 32
      SEED          : 0
      CACHE_DIR     : ''
    C2_MCC:
      ENABLE        : false
      MASK_RATIO    : 0.5
      PATCH         : 64
      MODALS        : all
      LAMBDA        : 1.0
      CONF_THRESH   : 0.75
      LOSS          : ce
      EMA_ALPHA     : 0.999
      WARMUP_EP     : 5
    C3_PROTO:
      ENABLE        : true
      FEATURE       : mfeat
      LAMBDA        : 0.1
      TEMPERATURE   : 0.1
      EMA           : 0.999
      PIXELS        : 4096
      WARMUP_EP     : 5
      CROSS_VIEW    : false
      CROSS_VIEW_W  : 1.0

  # ═══ [P47-2] Uni-modal Balance head — UniBal-adaptive 신호원 — 🔴 세 벤치 byte-동일 블록 #2 ═══
  P47_2:
    ENABLE      : true
    LAMBDA_U    : 0.4
    MODALS      : all
    HEAD        : linear
    HIDDEN      : 256
    WARMUP_EP   : 0
    GT_DIV      : 4
    REDUCE      : mean
    OGM_GE:
      ENABLE   : false
      ALPHA    : 0.5
      EMA      : 0.9
      MIN_K    : 0.1
      GE_NOISE : 0.0

  # ═══ [P52] RxDINO 자기-적응 컨트롤러 — 🔴 세 벤치 byte-동일 블록 #3·#4 ═══
  C3_ADAPTIVE:
    ENABLE     : true
    LAMBDA_MAX : 0.1
    TAU        : 0.25
    EMA_M      : 0.99
    WARMUP_EP  : 5
  UNIBAL_ADAPTIVE:
    ENABLE       : true
    LAMBDA_U_MAX : 0.4
    CAP          : 0.7         # 캘리브레이션 확정(radar λ_u≈0.33 @ 실측 gap)
    EMA_M        : 0.99
    WARMUP_EP    : 0
    WARMUP_SMALL : 0.05

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : MUSES
  ROOT          : '/home/jovyan/SSDb/jemo_maeng/dset/MUSES'   # hpca100 경로
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'event', 'radar']   # 🔴 4모달 (radar 포함)
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  PHYSAUG:
    ENABLE    : true
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  SEED          : 20260902          # [P52 seed2]
  EPOCHS        : 300
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 15
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : true
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/home/jovyan/SSDb/jemo_maeng/dset/MUSES'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
