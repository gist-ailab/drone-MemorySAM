# [R2] E1 스크린 레시피(TAPS on per_modal + C3 mfeat λ0.1) + COMPONENT loss on, 40ep 스크린, 시드 20260821, jarvis 4090.
#   원본 = jarvis-deliver_rgbdel_P46_c3only_seed20260821_screen40_E17.yaml.
#   변경(1축) = DETAIL_BRANCH.ENABLE false(E1 base 로 복귀) + LOSS.COMPONENT.ENABLE true. 그 외 SAVE_DIR.
#   → E1 base 대비 정확히 1축(연결 성분 단위 손실)만 추가. R1(경계 prior)과 직교하는 별개 실험이다.
#
# ── 진단(왜 만드나 — 제안서 2026-09-20 §6 "Q3+R", 판정 대장 "원거리 손해 원인 규명") ─────────
#   우리 모델은 얇은 객체를 **찾긴 하는데 윤곽을 못 그린다**(찾고도 못 그린 비율 0.204/0.429 대 기준선
#   0.085/0.253, 경계 F 원거리 TrafficLight −0.167). 결함은 같은 크기여도 거리가 멀수록 커진다. 픽셀 평균
#   CE 는 큰 영역이 지배해 작은 성분의 경계 손실이 묻힌다.
# ── 가설 ─────────────────────────────────────────────────────────────────────
#   GT 의 클래스별 연결 성분마다 작은 성분(면적^−1/2)과 원거리 성분(depth 구간)에 가중을 둔 soft-IoU 손실을
#   픽셀 헤드 로짓에 더하면, 큰 영역에 묻히던 얇은·원거리 객체의 윤곽 학습이 살아난다.
#   손실 = 1 − 가중 평균 soft-IoU(성분 bbox 국소). 거리 가중 = A6 로그 스케일 5분위 [8,47,111,255].
#   ⚠️ depth 는 정규화 HHA 텐서라 구간은 이미지별 min-max 로 0~255 근사 복원해 적용한다(component_loss.py).
# ── 게이트(사전 등록, 제안서 §4) ────────────────────────────────────────────
#   G-clean: legal test 24클래스(RailTrack 제외) Δ vs E1 확정 시드1 ≥ +0.5.
#   얇은 4클래스(Pole·Pedestrian·Static·TrafficLight) 평균 Δ vs E1 ≥ +2.0, 악조건 조건별 −0.5 미만 없음.
#   부수: "찾고도 못 그린 비율"(원거리) 이 기준선 방향으로 하락. [COMP] loss 가 정체 아닌 하락(성분 손실 학습).
# ── 공정성 ──────────────────────────────────────────────────────────────────
#   PHYSAUG off · DGFUSION_AUG(ColorAugSSD, ISSUE-026 픽스본) on · val-best ckpt · TTA 금지 (E1 계승).
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/jarvis_deliver_rgbdel_P46_c3only_seed20260821_screen40_R2'  # [COMPONENT 40ep 스크린]

# Trainer = train_reliadino.py.
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py --cfg <this>
MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16          # exp-dir naming only
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null                      # null -> alpha = r (scale 1.0)
  TAPS:
    ENABLE  : true                          # off(기본)면 B0 와 forward·state_dict byte-동일
    LAYERS  : [6, 12, 18, 24]               # 1-indexed 블록(24블록에서 24=마지막). resolve_taps 규약
    MODE    : per_modal                     # per_modal(센서별 탭 유지·FPN 레벨 합산) | mean(P43 식 모달 평균)

  # ═══ [R2] DETAIL_BRANCH off (E1 base 복귀) ═══
  DETAIL_BRANCH:
    ENABLE     : false                      # E17 대비 off — 성분 손실과 직교 실험(1축 격리)
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:                              # G0c 동결: 효과≈0 판정(P35/T1)
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2] fog_night 유해 실증(07-20)
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  ROUTER:                                   # [P36] 유일 생존 모듈 — 유지
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:
    ENABLE : false
  CLASS_TOKEN:
    ENABLE : false

  M2F:                                      # [P38/P39] 변경 없음 (P39.1과 동일)
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0
    W_CLS           : 2.0
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5
    SRC             : modal
    ANCHORED        : true
    POINT_QUOTA     : 256

  P39:                                      # [P39.1-rank] base — 변경 없음
    TRUNK_EXP       : true
    ARBITER         : true
    PATH_DROPOUT_P  : 0.25
    ROUTER_CE_W     : 0.4
    TRUNK_MODE      : gated_mlp
    TRUNK_HIDDEN    : 256
    VICREG:
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  # ═══ [P46-CTR] class-transfer recovery — C3 단독(C1/C2 off, E1 동일) ═══
  P46:
    C1_RCS:
      ENABLE        : false
      MODE          : daformer
      TEMP          : 0.01
      MIN_PIXELS    : 1
      LOSS_BLEND_W  : 1.0
      EMA_M         : 0.99
      EMA_INTERVAL  : 1
      REFRESH       : 32
      SEED          : 0
      CACHE_DIR     : ''
    C2_MCC:
      ENABLE        : false
      MASK_RATIO    : 0.5
      PATCH         : 64
      MODALS        : all
      LAMBDA        : 1.0
      CONF_THRESH   : 0.75
      LOSS          : ce
      EMA_ALPHA     : 0.999
      WARMUP_EP     : 5
    C3_PROTO:
      ENABLE        : true
      FEATURE       : mfeat      # mfeat(stride-4 head feature, 256) | fused(1/16, 1024)
      LAMBDA        : 0.1        # λ3
      TEMPERATURE   : 0.1        # cosine logit 온도 τ
      EMA           : 0.999      # prototype EMA 계수
      PIXELS        : 4096       # 손실당 서브샘플 픽셀 수
      WARMUP_EP     : 5
      CROSS_VIEW    : false
      CROSS_VIEW_W  : 1.0

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : DELIVER
  ROOT          : '/SSDb/jemo_maeng/dset/DELIVER'   # jarvis DELIVER path
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # DGFusion 공정선: PhysAug OFF + SSD photometric (ColorAugSSD, ISSUE-026 픽스본)
  DGFUSION_AUG  : true
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  LORA_NORM_CAP : 20.0
  SEED          : 20260821
  IMAGE_SIZE    : [768, 768]      # /16 -> 48x48 tokens
  BATCH_SIZE    : 1                 # jarvis 4090 24GB. 성분 손실은 full-res softmax(B=1) — 기동 전 P46_MEM_LOG=1 권장
  EPOCHS        : 40   # [스크린] 40ep 조기 판정. 확정은 200ep 3페어
  EVAL_START    : 0
  EVAL_INTERVAL : 5
  SAVE_TOPK     : 1                 # [스크린] val 상위 1개만 보관
  SAVE_TEST_CKPT : false            # [스크린] test 상위 체크포인트 미보관(평가·로그는 유지)
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false
  # ═══ [R2] 연결 성분 단위 손실 — 이번 카드의 유일한 변경 ═══
  COMPONENT:
    ENABLE            : true                # off(기본)면 기존 손실 경로 완전 무변경 (component_loss.py)
    W                 : 0.3                  # 주 손실에 더하는 가중
    SIZE_WEIGHT       : inv_sqrt             # 면적^−1/2 (작은 성분 강조) | none
    DIST_WEIGHT       : [1.0, 1.0, 1.5, 2.0, 2.0]   # depth 구간별 가중(원거리 강조)
    DEPTH_BINS        : [8.0, 47.0, 111.0, 255.0]   # A6 로그 스케일 5분위 경계(0~255 근사)
    DIST_WEIGHT_ENABLE: true                 # depth 정규화 HHA → min-max 0~255 근사 구간화. false면 size 가중만
    MIN_AREA          : 1                    # 이보다 작은 성분(픽셀) 제외
    MAX_COMP          : 256                  # 이미지당 성분 수 상한

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 1
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [768, 768]
  OVERLAY       : false
