DEVICE          : cuda
SAVE_DIR        : './outputs/MMSam3RBMA/b200_multiaqua_rgbtl_SAM3RBMA_hardaug8_physaug'

# ⚠️ 실행 전: PYTHONPATH 에 semseg/models/sam3 추가 (`import sam3`).
# ⚠️ SAM3 가중치(facebook/sam3, sam3.pt)는 gated — Meta 승인 후 download_ckpt_from_hf()로 받아
#    MODEL.CHECKPOINT_PATH 에 지정 (미지정 시 random init).

MODEL:
  NAME          : CMNeXt
  BACKBONE      : CMNeXt-B2
  PRETRAINED    : ''
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  LORA_MODEL    : LoRA_Sam3_RBMA
  LORA_R        : 4
  LORA_NUM_CLASSES : 4
  CHECKPOINT_PATH : ''           # SAM3 sam3.pt (gated); '' → random init
  LOAD_FROM_HF    : false
  LAMBDA_BIAS_INIT : 1.0
  AUX_WEIGHT      : 0.5          # per-modality aux CE weight (compute_losses)

DATASET:
  NAME          : MULTIAQUA
  ROOT          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/MULTIAQUA_night2'   # TODO: B200 마운트 확인
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'thermal']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : 'lidar_processed2'
  NIGHT_TRANSLATION : true
  NIGHT_AUG     :
    ENABLE      : true
    NIGHT_SIM_P : 0.45
    BRIGHTNESS_RANGE : [0.03, 0.45]
    BRIGHTNESS_SAMPLING : dark_biased
    DARK_BIASED_RATIO  : 0.6
    DARK_RANGE    : [0.03, 0.12]
    MODERATE_RANGE: [0.12, 0.45]
    CONTRAST_RANGE   : [0.3, 0.7]
    GAMMA_RANGE     : [0.4, 0.8]
    NOISE_STD       : 0.02
    SHOT_NOISE_GAIN_RANGE : [20, 80]
    CRM_P       : 0.20
    CRM_MASK_RATIO  : [0.2, 0.5]
    ZERO_P      : 0.09
    PHYSAUG:
      ENABLE    : true
      P         : 0.40
      FILTER:   { ENABLE: true, SIGMA_RANGE: [0.0, 1.5], KERNEL_SIZE: 3 }
      FOURIER:  { ENABLE: true, GROUPS: [1, 513], PHASES: [0.0, 1.0], GRANULARITY: 256, MEAN_STR: 8.0, DECAY: 0.3 }

TRAIN:
  IMAGE_SIZE    : [1008, 1008]   # SAM3 입력 (SAM2의 1024 아님)
  BATCH_SIZE    : 2
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 1
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1008, 1008]
  BATCH_SIZE    : 1
  EVAL_DAY      : false

TEST:
  MODEL_PATH    : ''
  FILE          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/MULTIAQUA_night2'   # TODO
  IMAGE_SIZE    : [1008, 1008]
