DEVICE          : cuda
SAVE_DIR        : './outputs/MMSamP29/b200_deliver_rgbdel_P29_physaug'

MODEL:
  NAME          : CMNeXt
  BACKBONE      : CMNeXt-B2
  PRETRAINED    : '/hpc2hdd/home/cliao127/MMSS-SAM-S1/sam/checkpoints/pretrained/segformer/mit_b2.pth'
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  LORA_MODEL    : LoRA_Sam_P29
  LORA_R        : 4
  LORA_NUM_EXPERTS : null
  LORA_TOP_K    : None
  LORA_LAYER    : null
  LORA_COND_DIM : 8
  MODAL_COND_MOE : true
  COND_MODE     : film            # [P29] gate 조건화 = FiLM (SDC.ENABLE=true 시 자동 활성)
  # [P29] Self-Derived Condition (SDC) 라우팅 — P28(RBMA+SoftMoE) 상속, 게이트 조건화만 변경:
  #   - 이미지(RGB)에서 무감독 자기파생 조건 latent z_c (채널통계→MLP→prototype bank K)
  #   - [modal_embed ⊕ z_c] → Soft-MoE gate에 FiLM(scale+shift), zero-init=identity (P28-safe)
  #   - label-free clustering loss (entropy: confident+diverse) → LAMBDA로 total loss 가산
  #   상세 .claude_logs/02_model_arch.md P29 / 노벨티 12 §2.7
  SDC:
    ENABLE      : true
    K           : 6               # condition prototype 개수
    LATENT_DIM  : 32              # z_c 차원 (gate cond = LORA_COND_DIM + LATENT_DIM)
    LAMBDA      : 0.1             # clustering loss 가중치
  # [P28] RBMA — Reliability-Biased Memory Attention (상속 유지)
  QUALITY_GATE:
    HIDDEN_DIM   : 64
    MIN_QUALITY  : 0.3
    PER_MODALITY : true
    TAU_UAMM     : 1.0
    TAU_TEACHER  : 0.5
    MEMORY_MOD   : false
    AMF_MODE     : uniform          # 순수 RBMA (ablation: sqg_quality)
    PER_MODALITY_DECODER : true
    AUX_CE_WEIGHT : 0.5
    MULTI_SCALE_SQG : true
    DEBA_FP      : false
    LAMBDA_BIAS_INIT : 1.0          # memory attention bias 학습 스칼라 초기값

DATASET:
  NAME          : DELIVER
  ROOT          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/DELIVER'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']

  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # PhysAug: dataset-level (NIGHT_AUG와 독립)
  PHYSAUG:
    ENABLE    : true
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 6               # P28 운영값과 일치 (4 GPU → global 24)
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true            # B200 bf16 Tensor Core 활용
  AMP_DTYPE     : bfloat16
  DDP           : True
  GRADIENT_CHECKPOINT : false
  LAMBDA_GATE   : 0.5

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 16              # eval 점유 유지 (메트릭 불변)
  EVAL_DAY      : false

  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

TEST:
  MODEL_PATH    : ''
  FILE          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
