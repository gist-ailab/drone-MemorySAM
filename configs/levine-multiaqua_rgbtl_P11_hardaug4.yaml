DEVICE          : cuda              # device used for training and evaluation (cpu, cuda, cuda0, cuda1, ...)
SAVE_DIR        : './outputs/MMSamP11/levine_multiaqua_rgbtl_P11_hardaug4'

MODEL:
  NAME          : CMNeXt
  BACKBONE      : CMNeXt-B2
  PRETRAINED    : '/hpc2hdd/home/cliao127/MMSS-SAM-S1/sam/checkpoints/pretrained/segformer/mit_b2.pth'
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  LORA_MODEL    : LoRA_Sam_P11                                      # P11: MI-based MoE Expert Specialization
  LORA_R        : 4
  LORA_NUM_EXPERTS : null                                           # null = auto (num_modalities)
  LORA_TOP_K    : None
  LORA_LAYER    : null
  LORA_NUM_CLASSES : 4                                              # aux head 출력 클래스 수 (MULTIAQUA=4)

DATASET:
  NAME          : MULTIAQUA
  ROOT          : '/ailab_mat2/personal/jemo_maeng/dset/Drone/MULTIAQUA_night'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'thermal']
  # hardaug4: P9와 동일한 augmentation 유지 (변수 통제)
  NIGHT_AUG     :
    ENABLE      : true
    NIGHT_SIM_P : 0.45
    BRIGHTNESS_RANGE : [0.03, 0.45]
    BRIGHTNESS_SAMPLING : dark_biased
    DARK_BIASED_RATIO  : 0.6
    DARK_RANGE    : [0.03, 0.12]
    MODERATE_RANGE: [0.12, 0.45]
    CONTRAST_RANGE   : [0.3, 0.7]
    GAMMA_RANGE     : [0.4, 0.8]
    NOISE_STD       : 0.02
    CRM_P       : 0.35
    CRM_MASK_RATIO  : [0.2, 0.5]
    ZERO_P      : 0.09

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 1
  AMP           : false
  DDP           : True
  LAMBDA_GATE   : 0.5             # Gating aux loss 가중치 (oracle KL + aux seg)
  LAMBDA_MI     : 1.0             # [P11] MI routing loss 가중치 (MoE expert specialization)

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1


EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]


TEST:
  MODEL_PATH    : ''
  FILE          : '/ailab_mat2/personal/jemo_maeng/dset/Drone/MULTIAQUA_night'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
