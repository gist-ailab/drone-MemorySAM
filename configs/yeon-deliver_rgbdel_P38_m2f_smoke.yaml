# ═══ P38 smoke (yeon, EPOCHS 2, wandb off) — base: bengio-deliver_rgbdel_P38_m2f.yaml ═══
# 목적: (a) DGFusion/CAFuser(OneFormer 스택)와 head 패러다임을 맞춰 MUSES PQ 산출
# 가능화, (b) per-pixel head의 thin/희소 클래스 열세(Wall/Water/RailTrack) 해소,
# (c) head confound 제거 — 남는 차이 = 신뢰도 라우팅 융합(우리 주장)의 몫.
# Base recipe = P36-router 공정선 동결 (GATE·VETO·CALIB·ROUTER on / ATTN_BIAS·
# CONSISTENCY off / PHYSAUG off / DGFUSION_AUG on). CEFR·CLASS_TOKEN off —
# P37 모듈은 미판정이므로 섞지 않는다 (P38 = P36 + M2F, 깨끗한 1-변수 비교).
# 추가 = MODEL.M2F (semseg/models/reliadino/m2f_head.py):
#   100 learned queries → gated fused stride-16 map 위 6-layer masked cross-attn
#   (layer1 plain, 이후 masked; P37b _TokenDecoderLayer 재사용, 공유 head + deep
#   supervision) → mask-embedding · FPN stride-4 feat = per-query masks.
#   손실 = Hungarian(scipy) + CE(no-obj 0.1) + point-sampled BCE/dice (2/5/5,
#   12544 pts) — 모델 내부 계산, aux['m2f_loss']로 반환 (LOSS_W pre-scale).
#   병합 = final = conv_head + β·sem_query + router_alpha·routed, β zero-init
#   → 시작 시 P36과 완전 동일 (collapse-safe; query 분기는 자체 손실로 full 학습).
#   PQ: m2f_head.panoptic_inference() 구현됨 — DELIVER 미사용, MUSES 평가기용.
#   Monitor: p38/m2f_beta, train/m2f_loss.
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/yeon_deliver_rgbdel_P38_m2f_smoke'

# Trainer = train_reliadino.py.
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py --cfg <this>
MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16          # exp-dir naming only
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null                      # null -> alpha = r (scale 1.0)
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    # G0c 동결: attn-bias off (효과≈0 판정, P35/T1)
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : true
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : true
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : true
    LAMBDA : 0.1

  # [P36] per-class reliability-anchored router (유지 — 유일 생존 모듈)
  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  # P37 모듈 off — P38은 P36 대비 1-변수(M2F head) 비교
  CEFR:
    ENABLE : false
  CLASS_TOKEN:
    ENABLE : false

  # [P38] Mask2Former-lite query head (semseg/models/reliadino/m2f_head.py)
  M2F:
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256                   # query dim_t (params ≈5.5M)
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0                   # zero-init residual (do not change)
    W_CLS           : 2.0                   # M2F 표준 가중 2/5/5
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544                 # point-sampled mask losses (M2F 관행)
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5                   # aux['m2f_loss'] 전역 스케일 (레시피 보존)

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : DELIVER
  ROOT          : '/SSDb/jemo_maeng/dset/DELIVER'   # yeon DELIVER path
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # DGFusion 공정선: PhysAug OFF + SSD photometric (ColorAugSSD)
  DGFUSION_AUG  : true
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  LORA_NORM_CAP : 20.0            # b_q/b_v Frobenius cap (P35/T1 seam)
  IMAGE_SIZE    : [768, 768]      # /16 -> 48x48 tokens
  BATCH_SIZE    : 2               # yeon 실측 6GB@bs1(P37) + M2F head ≈소폭 → bs2 안전
  EPOCHS        : 2
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : true

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 1
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 2
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [768, 768]
  OVERLAY       : false
