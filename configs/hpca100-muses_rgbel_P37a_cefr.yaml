# ═══ P37a-CEFR × MUSES 3모달 — CEFR-Head를 MUSES(img/lidar/event)에 적용 ═══
# MODEL 블록 = jarvis-deliver_rgbdel_P37a_cefr.yaml (P36 공정레시피 + CEFR-Head + CA2 anchor).
# DATASET/TRAIN/EVAL = hpca100-muses_rgbelr_P34_reliadino.yaml.
#   변경: MODALS 4모달(+radar) → 3모달 [img,lidar,event]. radar는 val −0.09로 무익 판정(2026-07-17).
#   MUSES 최선 = 3모달 공식 val 80.86. CEFR head가 이 위에서 개선하는지 검증.
# 🔴 GRADIENT_CHECKPOINT: false 유지(encoder active_modality 버그 회피).
#   torchrun --nproc_per_node=<N> train_reliadino.py --cfg <this>
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/hpca100_muses_rgbel_P37a_cefr'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    # 공정 레시피 (P36/G0c 동결): attention bias OFF
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  # 공정 레시피: consistency 항 OFF
  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : true
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : true
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : true
    LAMBDA : 0.1

  # [P36] per-class router 유지 — CEFR은 그 위에 얹힘 (routed residual은
  # pass-1/최종 logits 양쪽에 동일하게 적용).
  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  # [P37a] CEFR-Head + CA2-NoText anchor (구현: semseg/models/reliadino/fusion.py
  # CEFRHead + model.py 2-pass flow). ENABLE false → P36과 byte-identical.
  CEFR:
    ENABLE           : true
    MORPH_INIT       : -4.0     # blend scalar a init → σ(a)≈0.018 (P36-near start)
    ANCHOR_POSTERIOR : true     # λ2·log p̂_i(k|s) 항 사용 (calibrated aux posterior)
    LAMBDA1          : 1.0      # rel_cal anchor 계수 (learnable scalar init)
    LAMBDA2_TARGET   : 0.5      # posterior anchor 목표 계수
    LAMBDA2_WARMUP_EP: 10       # λ2 linear warmup 0→target (epochs)
    ENTROPY_FLOOR    : 0.5      # AECF hinge: batch-marginal 혼합 entropy floor
    HIDDEN           : 64       # routing head hidden dim (zero-init last conv)

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20


DATASET:
  NAME          : MUSES
  ROOT          : '/home/jovyan/SSDb/jemo_maeng/dset/MUSES'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'event']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # PhysAug: kept ON exactly as in the P34 recipe.
  PHYSAUG:
    ENABLE    : true
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  # MUSES frames are 1080x1920; semseg/datasets/muses.py letterboxes them to a
  # square (label pad = ignore) so this stays an exact 64x64 token grid.
  BATCH_SIZE    : 2
                                  # because GPU 0/1 also host another tenant's 14GB job.
  # EPOCHS=300, set by measurement, not by habit:
  #   measured on GPU 0,1,6,7 = 87 s/epoch (93 it/ep @1.2 it/s + amortised val every
  #   2nd ep; from the timing probe's [Val] stamps ep2 15:44:02 -> ep4 15:46:56).
  #   300 ep x 87 s = 7.3 h. Launch ~01:00 KST 07-15 -> ends ~08:20 KST, i.e. ~11.6 h
  #   before the 20:00 KST hand-back and ~15.6 h before the 23:59 KST B200 cutoff,
  #   leaving room for the NAS rsync and for slowdown on this shared box.
  # Why not 200 (the DELIVER P34 number): MUSES train is 1500 imgs vs DELIVER ~3983,
  #   so 200 ep here = 300k samples vs DELIVER's 796k. 300 ep (450k) buys more
  #   exposure and still fits with a wide margin. Overfitting is not a risk to the
  #   deliverable: the trainer keeps top-5 checkpoints by val mIoU, so late
  #   overfitting cannot cost us the best model. (Probe already hit val 62.22 @ ep4.)
  EPOCHS        : 300
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 15              # keeps the P34 warmup ratio (10/200 = 5%) at 300 ep
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 4
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : true
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/MUSES'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
