# ═══ MUSES × P36-router = MUSES-P34 recipe + per-class reliability router ═══
# SCIENTIFIC QUESTION: does the per-class reliability-anchored router help on MUSES?
#
# SINGLE VARIABLE vs the MUSES-P34 run that scored official val 80.86 /
# benchmark test 78.979 (Codabench). EVERYTHING in the P34 recipe is held:
#   PHYSAUG on, ATTN_BIAS on, CONSISTENCY on, GATE/VETO/CALIBRATION unchanged,
#   IMAGE_SIZE 1024, LR/scheduler/EPOCHS unchanged.
# The ONLY delta = MODEL.ROUTER block below (ported from b200-deliver_rgbdel_P36_router.yaml).
# NOTE: the DELIVER P36-router config additionally turned PhysAug/ATTN_BIAS/
#   CONSISTENCY OFF (P35 frozen recipe). We deliberately DO NOT do that here —
#   user-confirmed: keep P34 so the only difference vs 78.979 is the router.
# router_alpha is zero-init -> at step 0 this is byte-identical to P34 (collapse-safe).
#
# ── bengio (RTX 3090, 24GB) hardware adaptation — MEASURED, not guessed ──
#   B200 used 4 GPU x BS4 x accum1 = eff batch 16, no grad-ckpt, ~55GB/GPU.
#   3090 has 24GB, so:
#     GRADIENT_CHECKPOINT: true is MANDATORY — measured BS2 WITHOUT it OOMs
#       (24104MiB peak, "Tried to allocate 64.00 MiB ... 64.50 MiB is free").
#     BATCH_SIZE 4 does NOT fit: 3-modal BS4 = 22.9GB (survives but ~1.5GB headroom,
#       eval would risk OOM); 4-modal BS4 = hard OOM.
#     BATCH_SIZE 2 x 4 GPUs -> trainer auto-sets accumulation_steps = ceil(16/(2*4)) = 2
#       => eff batch 16 AND 93 optimizer updates/epoch — IDENTICAL to B200's 4x4x1.
#   Measured (4 GPU, grad-ckpt on): 3-modal 13.1GB peak, 2.80 s/it, 187 it/ep
#     => ~8.7 min/epoch => 300 ep ~= 44 h (~1.8 days) + eval overhead.
#   Launch:
#     export PYTHONPATH=/SSDb/jemo_maeng/pylibs_p34:$PWD   # timm 1.0.24 (dinov3); MMSS_SAM's 0.4.12 has none
#     torchrun --standalone --nproc_per_node=4 train_reliadino.py --cfg <this>
#   GPU 7 is occupied by det_P37_rfdetr_full — DO NOT USE.
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/bengio_muses_rgbel_P36_router'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:
      ENABLE       : true
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : true
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : true
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : true
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : true
    LAMBDA : 0.1

  # [P36] per-class reliability-anchored router — THE single variable vs P34/78.979.
  #   w_i = softmax_m(zero-init head(feat_i) + ANCHOR_LAMBDA * rel_cal_i) per class/pixel
  #   final = head_logits + router_alpha * up(sum_i w_i * aux_logits_i)
  # Values copied verbatim from configs/b200-deliver_rgbdel_P36_router.yaml.
  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img']          # P34 used ['img','depth']; MUSES has no depth
    WARMUP_EP : 20

DATASET:
  NAME          : MUSES
  ROOT          : '/ailab_mat2/dataset/MUSES'      # NFS mount on bengio (verified)
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'event']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # PhysAug: kept ON exactly as in the P34 recipe.
  PHYSAUG:
    ENABLE    : true
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  # MUSES frames are 1080x1920; semseg/datasets/muses.py letterboxes them to a
  # square (label pad = ignore) so this stays an exact 64x64 token grid.
  BATCH_SIZE    : 2               # bengio 3090/24GB: measured 13.1GB peak (3-modal, 4 GPU,
                                  # grad-ckpt on). BS4 = 22.9GB (too tight) / 4-modal BS4 = OOM.
                                  # 4 GPU x BS2 -> auto accum 2 = eff batch 16 (== B200 4x4x1).
  # EPOCHS=300, set by measurement, not by habit:
  #   measured on GPU 0,1,6,7 = 87 s/epoch (93 it/ep @1.2 it/s + amortised val every
  #   2nd ep; from the timing probe's [Val] stamps ep2 15:44:02 -> ep4 15:46:56).
  #   300 ep x 87 s = 7.3 h. Launch ~01:00 KST 07-15 -> ends ~08:20 KST, i.e. ~11.6 h
  #   before the 20:00 KST hand-back and ~15.6 h before the 23:59 KST B200 cutoff,
  #   leaving room for the NAS rsync and for slowdown on this shared box.
  # Why not 200 (the DELIVER P34 number): MUSES train is 1500 imgs vs DELIVER ~3983,
  #   so 200 ep here = 300k samples vs DELIVER's 796k. 300 ep (450k) buys more
  #   exposure and still fits with a wide margin. Overfitting is not a risk to the
  #   deliverable: the trainer keeps top-5 checkpoints by val mIoU, so late
  #   overfitting cannot cost us the best model. (Probe already hit val 62.22 @ ep4.)
  EPOCHS        : 300
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : true      # MANDATORY on 24GB (measured: off => OOM even at BS2)

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 15              # keeps the P34 warmup ratio (10/200 = 5%) at 300 ep
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 4
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : true
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/ailab_mat2/dataset/MUSES'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
