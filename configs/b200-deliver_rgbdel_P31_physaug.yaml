DEVICE          : cuda
SAVE_DIR        : './outputs/MMSamP31/b200_deliver_rgbdel_P31_physaug'

MODEL:
  NAME          : CMNeXt
  BACKBONE      : CMNeXt-B2
  PRETRAINED    : '/hpc2hdd/home/cliao127/MMSS-SAM-S1/sam/checkpoints/pretrained/segformer/mit_b2.pth'
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  LORA_MODEL    : LoRA_Sam_P31
  LORA_R        : 4
  LORA_NUM_EXPERTS : null
  LORA_TOP_K    : None
  LORA_LAYER    : null
  LORA_COND_DIM : 8
  MODAL_COND_MOE : true
  COND_MODE     : film            # [P29] SDC FiLM gate (inherited)
  # [P29] Self-Derived Condition routing (inherited, ON)
  SDC:
    ENABLE      : true
    K           : 6
    LATENT_DIM  : 32
    LAMBDA      : 0.1
  # [P30→P31] Class-token decoder — rare-class fix.
  #   P31: MULTI_SCALE=true → ClassTokenDecoderMS (simple-FPN {4,8,16,32} + coarse→fine
  #   cross-attn + 학습형 ConvTranspose ×UP 고해상 pixel-embed + training-only aux CE @H/4).
  CLASS_TOKEN_DECODER:
    ENABLE      : true
    DIM         : 128
    MULTI_SCALE : true            # [P31 Seg-C]
    UP          : 2               # 학습형 upsample 배율 (thin-class 경계 회복)
    AUX_CE      : true            # training-only per-pixel CE head @H/4
    AUX_CE_WEIGHT : 0.4           # trainer loss weight (GOOSE-M2F 근거)
  # [P30→P31] Reliability-anchored learned modality router (dead-modality fix)
  #   REG_MODE decisive: 측정된 P28/P29 융합가중치가 거의 uniform([.27,.28,.23,.23] vs
  #   기여 [8.4,23.5,0.02,0.01], doc16 §7)인데 기존 diversity reg는 uniform으로 미는 방향
  #   → per-pixel commit(적응 선택) + batch-marginal 다양성(collapse 방지)으로 교체.
  LEARNED_ROUTER:
    ENABLE        : true
    PER_CLASS     : true
    ANCHOR_LAMBDA : 1.0
    REG_LAMBDA    : 0.01
    REG_MODE      : decisive      # [P31] 'diversity'(P30) | 'decisive'
  # [P31 Seg-A] RBMA reliability 재보정 — event/LiDAR anti-calibration (AUROC .30/.22) 수리.
  #   ENABLE: per-modal temperature + correctness-contrastive calibration loss.
  #   AMF_RELIABILITY: 보정 성공(AUROC>0.5) 확인 후에만 켤 것 (LEARNED_ROUTER OFF 필요).
  #   CONSISTENCY_BIAS: [Seg-B] dual-axis 2차 bias — A 성공 후 조건부 ON (ablation 트랙).
  RBMA_CALIB:
    ENABLE          : true
    LAMBDA          : 0.1         # calibration loss weight
    CONSISTENCY_BIAS : false
    LAMBDA_CONS_INIT : 0.5
    AMF_RELIABILITY : false
    AMF_REL_TAU     : 0.25
  # [P31 레버①] frozen-backbone ceiling (ISSUE-008, Bridge/Other dead-class) 직격:
  #   Hiera trunk 마지막 N block unfreeze, LR은 UNFREEZE_LR_SCALE 배로 감쇠.
  UNFREEZE_LAST_N_BLOCKS : 3      # hiera-b+ stage4 (blocks 21-23)
  UNFREEZE_LR_SCALE      : 0.1
  # [P28] RBMA (inherited)
  QUALITY_GATE:
    HIDDEN_DIM   : 64
    MIN_QUALITY  : 0.3
    PER_MODALITY : true
    TAU_UAMM     : 1.0
    TAU_TEACHER  : 0.5
    MEMORY_MOD   : false
    AMF_MODE     : uniform
    PER_MODALITY_DECODER : true
    AUX_CE_WEIGHT : 0.5
    MULTI_SCALE_SQG : true
    DEBA_FP      : false
    LAMBDA_BIAS_INIT : 1.0

DATASET:
  NAME          : DELIVER
  ROOT          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/DELIVER'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  PHYSAUG:
    ENABLE    : true
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 6
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : True
  GRADIENT_CHECKPOINT : false
  LAMBDA_GATE   : 0.5

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 16
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

TEST:
  MODEL_PATH    : ''
  FILE          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
