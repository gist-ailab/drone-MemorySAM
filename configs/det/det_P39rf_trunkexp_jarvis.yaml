# P39rf-Det = P39's V1 (trunk rank expansion) + RF-DETR NMS-free head (COCO-init).
#
# Why this config exists: P39's V1 could never train in P39-Det. There the M2F queries
# read per-modal tokens (V2) and feat_s4 comes from a no_grad decode, so `fused` had NO
# gradient path and trunk_exp measured exactly 0.000 grad. An RF-DETR head reads the
# FPN pyramid, which IS built from `fused`, so V1 finally receives gradient here. This
# is the first honest test of "does widening the fused trunk help a detection head".
#
# NOT carried over (M2F-query-only, and left OFF rather than built-and-unused):
#   V2 modal-token query attention  - RF-DETR has its own queries
#   V3 anchored/free query split    - same
#   V4 point quota / V5 arbiter     - segmentation-only
#
# Single-variable comparison: identical to det_P37a_cefr_yeon.yaml (G0c base, RF-DETR,
# COCO init, grad_clip 0.1, LR 1e-4) except CEFR off / TRUNK_EXP on. So the delta vs
# P37a's measured 0.8449 mAP50 reads as V1-vs-CEFR on the same base and head.
OUTPUT_DIR: outputs/det_final_P39rf_trunkexp_jarvis

DATASET:
  ROOT: /SSDd/jemo_maeng/dset/poongsan_v2
  ANNOTATION_TRAIN: /SSDd/jemo_maeng/dset/poongsan_v2/_final_ann/instances_train_egofill.json
  ANNOTATION_VAL:   /SSDd/jemo_maeng/dset/poongsan_v2/_final_ann/instances_test_common.json
  MODALITY_KEYS: { img: rgb, lidar: depth_map_lidar, thermal: thermal_aligned }
  MODALS: ['img', 'lidar', 'thermal']
  REQUIRE_ALL_MODALITIES: true
  IMG_SIZE: [768, 768]
  MIN_AREA: 16.0

MODEL:
  SEG_MODEL: ReliaDINO
  DET_MODEL: ReliaDINORFDETRDetector
  N_CLASSES: null
  BACKBONE_TIMM: vit_large_patch16_dinov3
  BACKBONE_FALLBACK: vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE: true
  SEG_CHECKPOINT: ''
  LORA_R: 8
  LORA_ALPHA: null
  FPN_DIM: 256
  FPN_STRIDES: [4, 8, 16, 32]
  FUSION:
    NUM_LAYERS: 2
    NUM_HEADS: 8
    MLP_RATIO: 4.0
    AUX_HIDDEN: 256
    ATTN_BIAS: { ENABLE: false, LAMBDA1_INIT: 1.0 }   # G0c
  CONSISTENCY: { ENABLE: false, LAMBDA2_INIT: 0.5 }   # G0c
  GATE:
    ENABLE: true
    TAU: 0.25
    ENTROPY_REG: 0.0
    ENTROPY_FLOOR: 0.5
    VETO_FLOOR: { ENABLE: true, THRESH: 0.10, CAP: 0.05 }
  CALIBRATION: { ENABLE: true, LAMBDA: 0.1 }
  ROUTER: { ENABLE: false }        # measured NO-OP in det (agreement 1.000) — off
  CEFR: { ENABLE: false }          # the variable under test replaces it
  CLASS_TOKEN: { ENABLE: false }
  M2F: { ENABLE: false }           # RF-DETR is the head; M2F would be dead params
  P39:
    TRUNK_EXP: true                # [P39-V1] fused += Σ P_m(f_m) — trains via the pyramid
    ARBITER: false                 # seg-only
  MODAL_DROPOUT: { ENABLE: false }
  # ---- RF-DETR head (identical to P37a) ----
  DET_LEVELS: [2]
  NUM_QUERIES: 300
  GROUP_DETR: 13
  DEC_LAYERS: 4
  DEC_N_POINTS: 2
  NUM_SELECT: 300
  COCO_CKPT: weights/rf-detr-large-2026.pth
  FREEZE_BACKBONE: false
  GRAD_CHECKPOINT: false           # REQUIRED — encoder active_modality bug

TRAIN:
  IMAGE_SIZE: [768, 768]
  EPOCHS: 50
  BATCH_SIZE: 2                  # re-profiled on 4090: BS1 used only 48% of VRAM
  VAL_BATCH_SIZE: 1
  GRAD_ACCUM_STEPS: 4            # 2 GPU x BS2 x 4 = eff 16 (unchanged -> LR unchanged)
  LR: 0.0001
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 1
  NUM_WORKERS: 4
  AMP: true
  GRAD_CLIP: 0.1
  PRETRAINED_HEAD_LR_MULT: 0.1

WANDB: { ENABLE: false, PROJECT: p39rf-det, ENTITY: null, VIZ_COUNT: 8, VIZ_SCORE_THRESH: 0.3 }
EVAL: { SCORE_THRESH: 0.05 }
