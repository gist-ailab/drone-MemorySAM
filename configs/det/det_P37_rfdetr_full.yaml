# P37-Det = P34's ReliaDINO backbone (unchanged) + RF-DETR NMS-free head.
#
# Isolates the head: every backbone/fusion setting below is copied verbatim from
# det_P34_final_full.yaml, so P37 vs P34 measures exactly one thing — FCOS+NMS
# (from scratch) vs RF-DETR's COCO-pretrained set-prediction decoder. Head maturity
# is the measured gap against YOLO on normal-light frames (0.935 vs ~0.74), which is
# what this run tests.
#
# Head geometry: RF-DETR is natively single-scale at stride 16, so DET_LEVELS=[2]
# feeds only that level. It matches the COCO weights exactly (250/250 tensors, and
# the decoder's 0.05*2**level box prior lands on COCO's value) and keeps the
# two-stage proposal branch at 2,304 tokens; adding stride-4 would make it 48,960.
OUTPUT_DIR: outputs/det_final_P37_rfdetr

DATASET:
  ROOT: /SSDb/jemo_maeng/dset/poongsan_v2
  ANNOTATION_TRAIN: /SSDb/jemo_maeng/dset/poongsan_v2/_final_ann/instances_train_egofill.json
  ANNOTATION_VAL:   /SSDb/jemo_maeng/dset/poongsan_v2/_final_ann/instances_test_common.json
  MODALITY_KEYS:
    img:     rgb
    lidar:   depth_map_lidar
    thermal: thermal_aligned
  MODALS: ['img', 'lidar', 'thermal']
  REQUIRE_ALL_MODALITIES: true
  IMG_SIZE: [768, 768]
  MIN_AREA: 16.0

MODEL:
  SEG_MODEL: ReliaDINO
  DET_MODEL: ReliaDINORFDETRDetector
  N_CLASSES: null
  # ---- ReliaDINO backbone: identical to P34 ----
  BACKBONE_TIMM: vit_large_patch16_dinov3
  BACKBONE_FALLBACK: vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE: true
  SEG_CHECKPOINT: ''
  LORA_R: 8
  LORA_ALPHA: null
  FPN_DIM: 256
  FPN_STRIDES: [4, 8, 16, 32]
  FUSION:
    NUM_LAYERS: 2
    NUM_HEADS: 8
    MLP_RATIO: 4.0
    AUX_HIDDEN: 256
    ATTN_BIAS: { ENABLE: true, LAMBDA1_INIT: 1.0 }
  CONSISTENCY: { ENABLE: true, LAMBDA2_INIT: 0.5 }
  GATE:
    ENABLE: true
    TAU: 0.25
    ENTROPY_REG: 0.0
    ENTROPY_FLOOR: 0.5
    VETO_FLOOR: { ENABLE: true, THRESH: 0.10, CAP: 0.05 }
  CALIBRATION: { ENABLE: true, LAMBDA: 0.1 }
  MODAL_DROPOUT: { ENABLE: false }
  # ---- RF-DETR head ----
  DET_LEVELS: [2]                  # stride 16 only — RF-DETR's native single scale
  NUM_QUERIES: 300
  GROUP_DETR: 13                   # RF-DETR's one-to-many trick; 1 group at inference
  DEC_LAYERS: 4                    # rf-detr-large-2026 has 4 decoder layers
  DEC_N_POINTS: 2
  NUM_SELECT: 300
  COCO_CKPT: /SSDb/jemo_maeng/src/Project/Drone24/detection/drone-MemorySAM-p29det-egofill/weights/rf-detr-large-2026.pth
  FREEZE_BACKBONE: false
  GRAD_CHECKPOINT: true

TRAIN:
  IMAGE_SIZE: [768, 768]
  EPOCHS: 50
  BATCH_SIZE: 1
  VAL_BATCH_SIZE: 1
  GRAD_ACCUM_STEPS: 1
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 5
  NUM_WORKERS: 4
  AMP: true
  PRETRAINED_HEAD_LR_MULT: 0.1   # COCO decoder finetunes at 2e-5; new class head at 2e-4

WANDB:
  ENABLE: false
  PROJECT: p37-det
  ENTITY: null
  VIZ_COUNT: 8
  VIZ_SCORE_THRESH: 0.3

EVAL:
  # No NMS in this head — set prediction is one-to-one. NMS_THRESH is unused.
  SCORE_THRESH: 0.05
