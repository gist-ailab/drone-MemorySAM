# P38-Det = ReliaDINO backbone + M2F (Mask2Former-lite) query head AS the detector.
#
# Unlike P37a/b-Det (which bolt an RF-DETR head onto the fusion pyramid), P38's M2F
# head is *itself* a query-based, one-to-one Hungarian, NMS-free detector. So the
# detector reads M2F's per-query cls (softmax K+1, incl no-object) + per-query box
# (added box head) and applies a DETR-style set loss — no RF-DETR, no
# extract_det_pyramid. A config-swap "P38-det" (RF-DETR on the pyramid) would leave
# M2F unused = a silent no-op; this uses M2F itself.
#
# Backbone recipe is the shared P36 base (ATTN_BIAS/CONSISTENCY off, GATE/VETO/
# CALIBRATION on) so the fused features match P37a/b-Det. ROUTER is off: it only
# adds to the seg head logits, which the M2F-det path never reads (provably inert
# here — not dead code left in the graph). No COCO pretraining: the M2F query head
# trains from scratch (same as P38 seg), so no PRETRAINED_HEAD_LR_MULT.
#
# CRITICAL: GRAD_CHECKPOINT false (encoder active_modality bug; 3 modalities).
OUTPUT_DIR: outputs/det_final_P38_m2f_yeon

DATASET:
  ROOT: /SSDb/jemo_maeng/dset/poongsan_v2
  ANNOTATION_TRAIN: /SSDb/jemo_maeng/dset/poongsan_v2/_final_ann/instances_train_egofill.json
  ANNOTATION_VAL:   /SSDb/jemo_maeng/dset/poongsan_v2/_final_ann/instances_test_common.json
  MODALITY_KEYS:
    img:     rgb
    lidar:   depth_map_lidar
    thermal: thermal_aligned
  MODALS: ['img', 'lidar', 'thermal']
  REQUIRE_ALL_MODALITIES: true
  IMG_SIZE: [768, 768]
  MIN_AREA: 16.0

MODEL:
  SEG_MODEL: ReliaDINO
  DET_MODEL: ReliaDINOM2FDetector
  N_CLASSES: null
  BACKBONE_TIMM: vit_large_patch16_dinov3
  BACKBONE_FALLBACK: vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE: true
  SEG_CHECKPOINT: ''
  LORA_R: 8
  LORA_ALPHA: null
  FPN_DIM: 256
  FPN_STRIDES: [4, 8, 16, 32]
  FUSION:
    NUM_LAYERS: 2
    NUM_HEADS: 8
    MLP_RATIO: 4.0
    AUX_HIDDEN: 256
    ATTN_BIAS: { ENABLE: false, LAMBDA1_INIT: 1.0 }
  CONSISTENCY: { ENABLE: false, LAMBDA2_INIT: 0.5 }
  GATE:
    ENABLE: true
    TAU: 0.25
    ENTROPY_REG: 0.0
    ENTROPY_FLOOR: 0.5
    VETO_FLOOR: { ENABLE: true, THRESH: 0.10, CAP: 0.05 }
  CALIBRATION: { ENABLE: true, LAMBDA: 0.1 }
  ROUTER: { ENABLE: false }        # inert for M2F-det (only touches seg logits)
  CEFR: { ENABLE: false }
  CLASS_TOKEN: { ENABLE: false }
  M2F:                             # [P38] Mask2Former-lite query head = the detector
    ENABLE: true
    NUM_QUERIES: 100
    NUM_LAYERS: 6
    DIM: 256
    NUM_HEADS: 8
    MLP_RATIO: 2.0
    BETA_INIT: 0.0
    W_CLS: 2.0
    W_BCE: 5.0
    W_DICE: 5.0
    NO_OBJ_W: 0.1
    DEEP_SUPERVISION: true
  MODAL_DROPOUT: { ENABLE: false }
  NUM_SELECT: 100
  FREEZE_BACKBONE: false
  GRAD_CHECKPOINT: false

TRAIN:
  IMAGE_SIZE: [768, 768]
  EPOCHS: 50
  BATCH_SIZE: 1
  VAL_BATCH_SIZE: 1
  GRAD_ACCUM_STEPS: 4
  LR: 0.0001
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 1
  NUM_WORKERS: 4
  AMP: true
  GRAD_CLIP: 0.1

WANDB:
  ENABLE: false
  PROJECT: p38-det
  ENTITY: null
  VIZ_COUNT: 8
  VIZ_SCORE_THRESH: 0.3

EVAL:
  SCORE_THRESH: 0.05
