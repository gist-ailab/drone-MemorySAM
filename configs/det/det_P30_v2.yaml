# P30-Det on clean v2 data — reliability-router fusion + object-query decoder (+FCOS aux).
#   Pivot from the P29-Det dense-head bundle (peak AP50 ~0.44, overfit after ep9) toward the
#   mAP50 0.85 goal via architecture: RBMA reliability-weighted modality fusion (replaces mean)
#   + DETR-style object-query decoder cross-attending the memory-conditioned feature.
#   Inherits the bundle wins (letterbox + augmentation + ATSS for the FCOS aux) and raises
#   weight_decay to fight the overfitting seen in P29-Det v2.
#
#   Train: torchrun --nproc_per_node=N train_det.py --cfg configs/det/det_P30_v2.yaml

OUTPUT_DIR: outputs/det

DATASET:
  ROOT: /SSDd/jemo_maeng/dset/poongsan_v2
  ANNOTATION_TRAIN: /SSDd/jemo_maeng/dset/poongsan_v2/_det_splits/det_train_v2.json
  ANNOTATION_VAL:   /SSDd/jemo_maeng/dset/poongsan_v2/_det_splits/det_test_v2.json
  MODALITY_KEYS:
    img:     rgb
    thermal: thermal_aligned
    lidar:   depth_map_lidar
  MODALS: ['img', 'lidar', 'thermal']
  REQUIRE_ALL_MODALITIES: true
  IMG_SIZE: [1024, 1024]
  MIN_AREA: 16.0
  RESIZE_MODE: letterbox          # inherited from bundle
  DROP_EMPTY: true
  AUG:
    ENABLE: true
    HFLIP_PROB: 0.5
    BRIGHTNESS_RANGE: [0.6, 1.4]
    CONTRAST_RANGE: [0.7, 1.3]
    CROP_PROB: 0.5
    CROP_SCALE: [0.7, 1.0]

MODEL:
  SEG_MODEL: LoRA_Sam_P30_Det        # P30 backbone (RBMA + SDC)
  DET_MODEL: MemorySAMDetectorP30    # reliability-router fusion + object-query decoder + FCOS aux
  SEG_CHECKPOINT: ''
  SAM2_CHECKPOINT: semseg/models/sam2/sam2/checkpoints/sam2.1_hiera_base_plus.pt
  SAM2_CONFIG: sam2_hiera_b+.yaml
  LORA_R: 4
  AMF_MODE: uniform
  N_CLASSES: null
  FPN_CHANNELS: [32, 64, 256]
  FPN_STRIDES: [4, 8, 16]
  HIDDEN_DIM: 256
  N_CONVS: 4
  FREEZE_BACKBONE: false
  TRAIN_MEMORY: true
  GRAD_CHECKPOINT: true             # OOM 시 true — resume(안정화패치 4a80058)에서 24GB edge OOM → 활성메모리 절감 위해 ON

  # ── P30 ② reliability-anchored modality router ──
  ROUTER_ANCHOR_LAMBDA: 1.0
  ROUTER_REG_LAMBDA: 0.0

  # ── P30 ① object-query decoder (primary head) ──
  NUM_QUERIES: 100
  QUERY_DIM: 256
  QUERY_LAYERS: 4
  QUERY_HEADS: 8

  # ── head balance ──
  USE_FCOS_AUX: true
  W_QUERY: 1.0
  W_FCOS: 1.0

  # ── ATSS for the FCOS aux (inherited from bundle) ──
  ASSIGNER: atss
  ATSS_TOPK: 9
  ATSS_SCALE: 8.0

TRAIN:
  EPOCHS: 40
  BATCH_SIZE: 1                     # AMP off(fp32)로 메모리↑ → b1로 회귀(여유 확인 후 상향); grad-ckpt ON
  VAL_BATCH_SIZE: 1
  GRAD_ACCUM_STEPS: 1
  LR: 0.0002
  WEIGHT_DECAY: 0.0005             # ↑ (P29-Det v2 1e-4 → overfit); more params in P30
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 5
  NUM_WORKERS: 4
  AMP: false                        # full fp32 — AMP+loss-fp32로도 fp16 backbone overflow→NaN 미해결(ep20 100% skip) → NaN 근절 위해 AMP off

WANDB:
  ENABLE: true
  PROJECT: p30-det
  ENTITY: null
  VIZ_COUNT: 8
  VIZ_SCORE_THRESH: 0.3

EVAL:
  NMS_THRESH: 0.6
  SCORE_THRESH: 0.05
