# D1-recovered = D1 (P37b-ClassToken seg backbone + RF-DETR NMS-free head, LR 3e-5)
# retrained on yeon with the RECOVERED full train set (poongsan_v2 egofill, 12681
# images after MFT/data-loss recovery). Original D1 best ran on 6 GPUs; only 4 GPUs
# (3,4,5,6) are free on yeon right now (0,1 = other users, 2 = D1 re-measurement in
# progress, 7 held as spare) -> GRAD_ACCUM_STEPS bumped 3->4 so eff-batch stays close
# to the original 18 (now 4x1x4=16). This is a certification run (best achievable
# score with recovered data), not a lineage-matched rerun of D1 -> not directly
# comparable to the original D1 numbers. Fresh run (not resumed) so the original D1
# checkpoints under outputs/det_D1_p37b_lowlr_yeon are untouched.
#
# Everything else (model config, LR, schedule) copied verbatim from
# det_D1_p37b_lowlr_yeon.yaml.
#
# CRITICAL: GRAD_CHECKPOINT false (encoder active_modality bug corrupts all-but-last
# modality across ckpt recompute; det has 3 modalities). Recipe copied verbatim from
# configs/bengio-deliver_rgbdel_P37b_classtoken.yaml, only the head + data differ.
OUTPUT_DIR: outputs/det_D1_recovered_yeon

DATASET:
  ROOT: /SSDb/jemo_maeng/dset/poongsan_v2
  ANNOTATION_TRAIN: /SSDb/jemo_maeng/dset/poongsan_v2/_final_ann/instances_train_egofill.json
  ANNOTATION_VAL:   /SSDb/jemo_maeng/dset/poongsan_v2/_final_ann/instances_test_common.json
  MODALITY_KEYS:
    img:     rgb
    lidar:   depth_map_lidar
    thermal: thermal_aligned
  MODALS: ['img', 'lidar', 'thermal']
  REQUIRE_ALL_MODALITIES: true
  IMG_SIZE: [768, 768]
  MIN_AREA: 16.0

MODEL:
  SEG_MODEL: ReliaDINO
  DET_MODEL: ReliaDINORFDETRDetector
  N_CLASSES: null
  BACKBONE_TIMM: vit_large_patch16_dinov3
  BACKBONE_FALLBACK: vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE: true
  SEG_CHECKPOINT: ''
  LORA_R: 8
  LORA_ALPHA: null
  FPN_DIM: 256
  FPN_STRIDES: [4, 8, 16, 32]
  FUSION:
    NUM_LAYERS: 2
    NUM_HEADS: 8
    MLP_RATIO: 4.0
    AUX_HIDDEN: 256
    ATTN_BIAS: { ENABLE: false, LAMBDA1_INIT: 1.0 }   # G0c: bias OFF
  CONSISTENCY: { ENABLE: false, LAMBDA2_INIT: 0.5 }   # G0c: consistency OFF
  GATE:
    ENABLE: true
    TAU: 0.25
    ENTROPY_REG: 0.0
    ENTROPY_FLOOR: 0.5
    VETO_FLOOR: { ENABLE: true, THRESH: 0.10, CAP: 0.05 }
  CALIBRATION: { ENABLE: true, LAMBDA: 0.1 }
  ROUTER:                                             # [P36] per-class router
    ENABLE: true
    ANCHOR_LAMBDA: 1.0
    REG_MODE: decisive
    REG_LAMBDA: 0.01
    ALPHA_INIT: 0.0
    HIDDEN: 64
  CEFR: { ENABLE: false }                             # P37a mechanism OFF for P37b
  CLASS_TOKEN:                                        # [P37b] class-token-lite head
    ENABLE: true
    NUM_LAYERS: 3
    DIM: 256
    NUM_HEADS: 8
    MLP_RATIO: 2.0
    AUX_CE_W: 0.4        # seg-only aux CE weight; unused in det (no seg GT mask)
    BETA_INIT: 0.0       # zero-init seg residual (det uses its own zero-init alpha)
  MODAL_DROPOUT: { ENABLE: false }
  # ---- RF-DETR head (same as P37a-Det) ----
  DET_LEVELS: [2]
  NUM_QUERIES: 300
  GROUP_DETR: 13
  DEC_LAYERS: 4
  DEC_N_POINTS: 2
  NUM_SELECT: 300
  COCO_CKPT: weights/rf-detr-large-2026.pth
  FREEZE_BACKBONE: false
  GRAD_CHECKPOINT: false        # REQUIRED — active_modality bug

TRAIN:
  IMAGE_SIZE: [768, 768]
  EPOCHS: 20                # P37b는 ep4 정점 후 단조하락 -> 장기 스케줄 불필요
  BATCH_SIZE: 1                 # ckpt off + class-token -> BS1 for VRAM headroom (~23GB/24)
  VAL_BATCH_SIZE: 4       # dist-eval(rank당 485장) + 배치 4. AP 불변 검증됨
  GRAD_ACCUM_STEPS: 4     # [D1-recovered] 4GPU x BS1 x 4 = eff-batch 16 (원본 D1: 6GPU x 1 x 3 = 18; GPU 부족으로 근접치)
  LR: 0.00003          # [D1] 1e-4 -> 3e-5. P37b가 워밍업(5ep) 도중 ep4에 정점(0.8422) 찍고 이후 단조하락 = LR이 COCO 사전학습 가중치를 훼손한다는 증거
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 1
  NUM_WORKERS: 4
  AMP: true
  GRAD_CLIP: 0.1                # DETR-standard (the P37 collapse ran ~unclipped at 10.0)
  PRETRAINED_HEAD_LR_MULT: 0.1

WANDB:
  ENABLE: false
  PROJECT: p37b-det
  ENTITY: null
  VIZ_COUNT: 8
  VIZ_SCORE_THRESH: 0.3

EVAL:
  SCORE_THRESH: 0.05
