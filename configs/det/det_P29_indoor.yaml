# MemorySAM Object Detection — P29-Det (RBMA backbone + FPN/FCOS head)
# Indoor RGB+LiDAR+Thermal dataset, 640x480 source images, COCO-format labels.
#
#   Train : python train_det.py --cfg configs/det/det_P29_indoor.yaml
#   Eval  : python val_det.py   --cfg configs/det/det_P29_indoor.yaml \
#             --det_checkpoint outputs/det/det_P29_indoor/best_checkpoint.pth --mode val
#
# Backbone fine-tune (사용자 결정 = option 2): 실내 도메인은 MUSES/DELIVER/MULTIAQUA 와
# 분포가 달라 frozen 전이로는 부족 → FREEZE_BACKBONE=false + TRAIN_MEMORY=true 로
# LoRA + memory attention + RBMA λ 를 detection loss 로 함께 학습한다.

OUTPUT_DIR: outputs/det

DATASET:
  # poongsan indoor multimodal (260618). COCO file_name + per-image `modalities`
  # paths are relative to ROOT. train/val are a CAPTURE-LEVEL split (no temporal
  # leakage); only the 3-modality intersection (rgb+thermal+depth_lidar) is used.
  ROOT: /drone_nas/drone/dataset
  ANNOTATION_TRAIN: /drone_nas/drone/dataset/Labeled/260618_poongsan_raw_20_aligned/_det_splits/det_train.json
  ANNOTATION_VAL:   /drone_nas/drone/dataset/Labeled/260618_poongsan_raw_20_aligned/_det_splits/det_val.json
  # model modality name → json `modalities` key (depth_map_lidar = png render of
  # lidar; lidar_aligned is .pcd → unusable as an image modality)
  MODALITY_KEYS:
    img:     rgb
    thermal: thermal_aligned
    lidar:   depth_map_lidar
  MODALS: ['img', 'lidar', 'thermal']            # 이 순서대로 backbone frame 0,1,2
  REQUIRE_ALL_MODALITIES: true                    # 3모달 전부 존재하는 프레임만 (lidar 부분 커버리지)
  IMG_SIZE: [1024, 1024]                          # SAM2 입력 해상도 (640x480 → resize)
  MIN_AREA: 16.0                                  # 4x4 미만 annotation 무시

MODEL:
  SEG_MODEL: LoRA_Sam_P29_Det                     # RBMA(P28) 백본 + detection feature path
  SEG_CHECKPOINT: ''                              # (선택) P28 seg 체크포인트 warm-start. 비우면 SAM2 pretrained
  SAM2_CHECKPOINT: semseg/models/sam2/sam2/checkpoints/sam2.1_hiera_base_plus.pt
  SAM2_CONFIG: sam2_hiera_b+.yaml
  LORA_R: 4
  AMF_MODE: uniform                               # seg fusion(미사용)을 등가중으로 — RBMA bias 순수 효과
  N_CLASSES: null                                 # null → COCO categories 수에서 자동 도출
  FPN_CHANNELS: [32, 64, 256]                     # [fpn0, fpn1, memory-fused] SAM2 Hiera-B+
  FPN_STRIDES: [4, 8, 16]                         # 1024 입력 기준 P3/P4/P5
  HIDDEN_DIM: 256
  N_CONVS: 4
  MODALITY_FUSE: mean                             # 'mean' | 'learned'
  FREEZE_BACKBONE: false                          # option 2: 백본 fine-tune
  TRAIN_MEMORY: true                              # memory_attention 도 학습

TRAIN:
  EPOCHS: 50
  BATCH_SIZE: 2                                    # 3모달 x SAM2 full → VRAM 큼. OOM 시 1로
  VAL_BATCH_SIZE: 2
  LR: 0.0002                                       # 백본 fine-tune 포함 → seg 대비 보수적
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 5
  NUM_WORKERS: 4
  AMP: true

EVAL:
  NMS_THRESH: 0.5
  SCORE_THRESH: 0.05
