# P34-Det = ReliaDINO(frozen DINOv3 ViT-L/16 + per-modality LoRA + reliability-
# gated fusion + ViTDet SimpleFPN) backbone + FCOS head, on the final low-light
# split (RGB+LiDAR(egofill)+Thermal). M3(P29-Det full)와 동일 데이터/평가 → 백본만
# SAM2→DINOv3 교체 비교. eval=common(저조도 포함). 저조도/정상 분해는 post-hoc.
OUTPUT_DIR: outputs/det_final_P34

DATASET:
  ROOT: /ailab_mat2/Projects/Drone/DATA/260618_poongsan
  ANNOTATION_TRAIN: /ailab_mat2/Projects/Drone/DATA/260618_poongsan/final/annotations/instances_train_egofill.json
  ANNOTATION_VAL:   /ailab_mat2/Projects/Drone/DATA/260618_poongsan/final/annotations/instances_test_common.json
  MODALITY_KEYS:
    img:     rgb
    lidar:   depth_map_lidar
    thermal: thermal_aligned
  MODALS: ['img', 'lidar', 'thermal']
  REQUIRE_ALL_MODALITIES: true
  IMG_SIZE: [768, 768]
  MIN_AREA: 16.0

MODEL:
  SEG_MODEL: ReliaDINO
  DET_MODEL: ReliaDINODetector
  N_CLASSES: null
  # ReliaDINO backbone
  BACKBONE_TIMM: vit_large_patch16_dinov3
  BACKBONE_FALLBACK: vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE: true
  SEG_CHECKPOINT: ''
  LORA_R: 8
  LORA_ALPHA: null
  FPN_DIM: 256
  FPN_STRIDES: [4, 8, 16, 32]     # patch16 DINOv3, ViTDet SimpleFPN
  FUSION:
    NUM_LAYERS: 2
    NUM_HEADS: 8
    MLP_RATIO: 4.0
    AUX_HIDDEN: 256
    ATTN_BIAS: { ENABLE: true, LAMBDA1_INIT: 1.0 }
  CONSISTENCY: { ENABLE: true, LAMBDA2_INIT: 0.5 }
  GATE:
    ENABLE: true
    TAU: 0.25
    ENTROPY_REG: 0.0
    ENTROPY_FLOOR: 0.5
    VETO_FLOOR: { ENABLE: true, THRESH: 0.10, CAP: 0.05 }
  CALIBRATION: { ENABLE: true, LAMBDA: 0.1 }
  MODAL_DROPOUT: { ENABLE: false }
  # det head
  N_CONVS: 4
  HIDDEN_DIM: 256
  FREEZE_BACKBONE: false           # DINOv3 는 내부 frozen; LoRA+fusion+FPN+head 학습
  GRAD_CHECKPOINT: false           # peak 7GB@768 → ckpt 불필요, ~30% 가속 (로컬 TITAN RTX)

TRAIN:
  IMAGE_SIZE: [768, 768]         # build_reliadino 가 읽음 (ViT pos-embed interp)
  EPOCHS: 30
  BATCH_SIZE: 1
  VAL_BATCH_SIZE: 1
  GRAD_ACCUM_STEPS: 1
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 5
  NUM_WORKERS: 4
  AMP: true

WANDB:
  ENABLE: false
  PROJECT: p34-det
  ENTITY: null
  VIZ_COUNT: 8
  VIZ_SCORE_THRESH: 0.3

EVAL:
  NMS_THRESH: 0.5
  SCORE_THRESH: 0.05
