# P37b-Det = P37b-ClassToken segmentation backbone + RF-DETR NMS-free head.
#
# Sibling of P37a-Det: same P36 base recipe (ATTN_BIAS/CONSISTENCY off, GATE/VETO/
# CALIBRATION/ROUTER on), but the P37b mechanism instead of CEFR — 25→num_classes
# learned class tokens attend the gated stride-16 fused map, dot-product mask
# embeddings against the stride-4 feature to produce per-class token_logits.
#
# In seg these add to the head logits (logits + beta*token_logits, beta zero-init).
# Detection never sees the head logits, so extract_det_pyramid injects token_logits
# into the pyramid via a zero-init alpha residual (mirror of the P36 router->det
# seam) — collapse-safe: at init identical to the class-token-off (P36-Det) pyramid.
#
# CRITICAL: GRAD_CHECKPOINT false (encoder active_modality bug corrupts all-but-last
# modality across ckpt recompute; det has 3 modalities). Recipe copied verbatim from
# configs/bengio-deliver_rgbdel_P37b_classtoken.yaml, only the head + data differ.
OUTPUT_DIR: outputs/det_D1_vitsp_jarvis

DATASET:
  ROOT: /SSDd/jemo_maeng/dset/poongsan_v2
  ANNOTATION_TRAIN: /SSDd/jemo_maeng/dset/poongsan_v2/_final_ann/instances_train_egofill.json
  ANNOTATION_VAL:   /SSDd/jemo_maeng/dset/poongsan_v2/_final_ann/instances_test_common.json
  MODALITY_KEYS:
    img:     rgb
    lidar:   depth_map_lidar
    thermal: thermal_aligned
  MODALS: ['img', 'lidar', 'thermal']
  REQUIRE_ALL_MODALITIES: true
  IMG_SIZE: [768, 768]
  MIN_AREA: 16.0

MODEL:
  SEG_MODEL: ReliaDINO
  DET_MODEL: ReliaDINORFDETRDetector
  N_CLASSES: null
  BACKBONE_TIMM: vit_small_plus_patch16_dinov3
  BACKBONE_FALLBACK: vit_small_patch14_reg4_dinov2
  PRETRAINED_BACKBONE: true
  SEG_CHECKPOINT: ''
  LORA_R: 8
  LORA_ALPHA: null
  FPN_DIM: 256
  FPN_STRIDES: [4, 8, 16, 32]
  FUSION:
    NUM_LAYERS: 2
    NUM_HEADS: 8
    MLP_RATIO: 4.0
    AUX_HIDDEN: 256
    ATTN_BIAS: { ENABLE: false, LAMBDA1_INIT: 1.0 }   # G0c: bias OFF
  CONSISTENCY: { ENABLE: false, LAMBDA2_INIT: 0.5 }   # G0c: consistency OFF
  GATE:
    ENABLE: true
    TAU: 0.25
    ENTROPY_REG: 0.0
    ENTROPY_FLOOR: 0.5
    VETO_FLOOR: { ENABLE: true, THRESH: 0.10, CAP: 0.05 }
  CALIBRATION: { ENABLE: true, LAMBDA: 0.1 }
  ROUTER:                                             # [P36] per-class router
    ENABLE: true
    ANCHOR_LAMBDA: 1.0
    REG_MODE: decisive
    REG_LAMBDA: 0.01
    ALPHA_INIT: 0.0
    HIDDEN: 64
  CEFR: { ENABLE: false }                             # P37a mechanism OFF for P37b
  CLASS_TOKEN:                                        # [P37b] class-token-lite head
    ENABLE: true
    NUM_LAYERS: 3
    DIM: 256
    NUM_HEADS: 8
    MLP_RATIO: 2.0
    AUX_CE_W: 0.4        # seg-only aux CE weight; unused in det (no seg GT mask)
    BETA_INIT: 0.0       # zero-init seg residual (det uses its own zero-init alpha)
  MODAL_DROPOUT: { ENABLE: false }
  # ---- RF-DETR head (same as P37a-Det) ----
  DET_LEVELS: [2]
  NUM_QUERIES: 300
  GROUP_DETR: 13
  DEC_LAYERS: 4
  DEC_N_POINTS: 2
  NUM_SELECT: 300
  COCO_CKPT: weights/rf-detr-large-2026.pth
  FREEZE_BACKBONE: false
  GRAD_CHECKPOINT: false        # REQUIRED — active_modality bug

TRAIN:
  IMAGE_SIZE: [768, 768]
  EPOCHS: 50
  BATCH_SIZE: 2                 # ckpt off + class-token -> BS1 for VRAM headroom (~23GB/24)
  VAL_BATCH_SIZE: 1
  GRAD_ACCUM_STEPS: 4
  LR: 0.00003
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 1
  NUM_WORKERS: 4
  AMP: true
  GRAD_CLIP: 0.1                # DETR-standard (the P37 collapse ran ~unclipped at 10.0)
  PRETRAINED_HEAD_LR_MULT: 0.1

WANDB:
  ENABLE: false
  PROJECT: p37b-det
  ENTITY: null
  VIZ_COUNT: 8
  VIZ_SCORE_THRESH: 0.3

EVAL:
  SCORE_THRESH: 0.05
