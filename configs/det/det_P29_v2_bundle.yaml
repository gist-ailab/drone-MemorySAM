# P29-Det v2 + BUNDLE (letterbox + augmentation + ATSS) — dense-head ceiling experiment.
#   Goal: measure how far the current P29-Det (mean fusion + FCOS) architecture can go on
#   the clean v2 data with broad low-risk improvements, as a baseline gate before P30-Det.
#   Target metric = mAP50 0.85 (best_checkpoint stays mAP-based).
#
#   Train: torchrun --nproc_per_node=N train_det.py --cfg configs/det/det_P29_v2_bundle.yaml
#
# Dataset = poongsan_v2 (clean, 0% empty frames). /ailab_mat2 is mounted on all servers;
# the jarvis rsync copy lives at /SSDd/jemo_maeng/dset/poongsan_v2 (switch ROOT per server).

OUTPUT_DIR: outputs/det

DATASET:
  ROOT: /SSDd/jemo_maeng/dset/poongsan_v2
  ANNOTATION_TRAIN: /SSDd/jemo_maeng/dset/poongsan_v2/_det_splits/det_train_v2.json
  ANNOTATION_VAL:   /SSDd/jemo_maeng/dset/poongsan_v2/_det_splits/det_test_v2.json
  MODALITY_KEYS:
    img:     rgb
    thermal: thermal_aligned
    lidar:   depth_map_lidar
  MODALS: ['img', 'lidar', 'thermal']
  REQUIRE_ALL_MODALITIES: true
  IMG_SIZE: [1024, 1024]
  MIN_AREA: 16.0

  # ── BUNDLE ① letterbox (aspect-preserving 640x480→1024, center-pad; eval inverts) ──
  RESIZE_MODE: letterbox          # 'stretch'(기존) | 'letterbox'
  DROP_EMPTY: true                # 어노테이션 0개 이미지 학습 제외(붕괴 방지 가드; v2는 이미 0%)

  # ── BUNDLE ② augmentation (train only; 기존엔 미배선=OFF였음) ──
  AUG:
    ENABLE: true
    HFLIP_PROB: 0.5
    BRIGHTNESS_RANGE: [0.6, 1.4]
    CONTRAST_RANGE: [0.7, 1.3]
    CROP_PROB: 0.5
    CROP_SCALE: [0.7, 1.0]

MODEL:
  SEG_MODEL: LoRA_Sam_P29_Det
  DET_MODEL: MemorySAMDetector     # P29-Det baseline (mean fusion + FCOS)
  SEG_CHECKPOINT: ''
  SAM2_CHECKPOINT: semseg/models/sam2/sam2/checkpoints/sam2.1_hiera_base_plus.pt
  SAM2_CONFIG: sam2_hiera_b+.yaml
  LORA_R: 4
  AMF_MODE: uniform
  N_CLASSES: null
  FPN_CHANNELS: [32, 64, 256]
  FPN_STRIDES: [4, 8, 16]
  HIDDEN_DIM: 256
  N_CONVS: 4
  MODALITY_FUSE: mean
  FREEZE_BACKBONE: false
  TRAIN_MEMORY: true
  GRAD_CHECKPOINT: false

  # ── BUNDLE ③ ATSS assignment (FCOS dense head; reg/centerness 동일) ──
  ASSIGNER: atss                   # 'fcos' | 'atss'
  ATSS_TOPK: 9
  ATSS_SCALE: 8.0

TRAIN:
  EPOCHS: 50
  BATCH_SIZE: 1
  VAL_BATCH_SIZE: 1
  GRAD_ACCUM_STEPS: 1
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 5
  NUM_WORKERS: 4
  AMP: true

WANDB:
  ENABLE: true
  PROJECT: p29-det
  ENTITY: null
  VIZ_COUNT: 8
  VIZ_SCORE_THRESH: 0.3

EVAL:
  NMS_THRESH: 0.5
  SCORE_THRESH: 0.05
