# P36-Det = P35 레시피(attn_bias/consistency off) + PerClassRouter.
# 주의: P36 라우터는 seg head logits 에만 붙어 det 경로에선 dead 였음 → model.py
# extract_det_pyramid 에 라우터를 배선(1x1 proj + zero-init alpha residual, P36의
# collapse-safe 철학 미러). init 시 P35-Det 과 출력 동일 → 직접 비교 가능.
OUTPUT_DIR: outputs/det_final_P36

DATASET:
  ROOT: /SSDb/jemo_maeng/dset/poongsan_v2
  ANNOTATION_TRAIN: /SSDb/jemo_maeng/dset/poongsan_v2/_final_ann/instances_train_egofill.json
  ANNOTATION_VAL:   /SSDb/jemo_maeng/dset/poongsan_v2/_final_ann/instances_test_common.json
  MODALITY_KEYS:
    img:     rgb
    lidar:   depth_map_lidar
    thermal: thermal_aligned
  MODALS: ['img', 'lidar', 'thermal']
  REQUIRE_ALL_MODALITIES: true
  IMG_SIZE: [768, 768]
  MIN_AREA: 16.0

MODEL:
  SEG_MODEL: ReliaDINO
  DET_MODEL: ReliaDINODetector
  N_CLASSES: null
  # ReliaDINO backbone
  BACKBONE_TIMM: vit_large_patch16_dinov3
  BACKBONE_FALLBACK: vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE: true
  SEG_CHECKPOINT: ''
  LORA_R: 8
  LORA_ALPHA: null
  FPN_DIM: 256
  FPN_STRIDES: [4, 8, 16, 32]     # patch16 DINOv3, ViTDet SimpleFPN
  FUSION:
    NUM_LAYERS: 2
    NUM_HEADS: 8
    MLP_RATIO: 4.0
    AUX_HIDDEN: 256
    ATTN_BIAS: { ENABLE: false, LAMBDA1_INIT: 1.0 }
  CONSISTENCY: { ENABLE: false, LAMBDA2_INIT: 0.5 }
  GATE:
    ENABLE: true
    TAU: 0.25
    ENTROPY_REG: 0.0
    ENTROPY_FLOOR: 0.5
    VETO_FLOOR: { ENABLE: true, THRESH: 0.10, CAP: 0.05 }
  CALIBRATION: { ENABLE: true, LAMBDA: 0.1 }
  ROUTER:                          # [P36] per-class reliability-anchored router
    ENABLE: true
    ANCHOR_LAMBDA: 1.0
    REG_MODE: decisive
    REG_LAMBDA: 0.01
    ALPHA_INIT: 0.0
    HIDDEN: 64
  MODAL_DROPOUT: { ENABLE: false }
  # det head
  N_CONVS: 4
  HIDDEN_DIM: 256
  FREEZE_BACKBONE: false           # DINOv3 는 내부 frozen; LoRA+fusion+FPN+head 학습
  GRAD_CHECKPOINT: false

TRAIN:
  IMAGE_SIZE: [768, 768]         # build_reliadino 가 읽음 (ViT pos-embed interp)
  EPOCHS: 30
  BATCH_SIZE: 1
  VAL_BATCH_SIZE: 1
  GRAD_ACCUM_STEPS: 1
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 5
  NUM_WORKERS: 4
  AMP: true

WANDB:
  ENABLE: false
  PROJECT: p34-det
  ENTITY: null
  VIZ_COUNT: 8
  VIZ_SCORE_THRESH: 0.3

EVAL:
  NMS_THRESH: 0.5
  SCORE_THRESH: 0.05
