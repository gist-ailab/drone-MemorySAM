# MemorySAM Object Detection — P29-Det (RBMA backbone + FPN/FCOS head)
# JARVIS variant: dataset rsync'd to local /SSDd (/drone_nas not mounted on jarvis).
#   Train : CUDA_VISIBLE_DEVICES=<free> python train_det.py --cfg configs/det/det_P29_indoor_jarvis.yaml
#
# Only the 3-modality subset (rgb + depth_map_lidar + thermal_aligned) + _det_splits
# was copied under ROOT, preserving the COCO relative paths.

OUTPUT_DIR: outputs/det

DATASET:
  ROOT: /SSDd/jemo_maeng/dset/poongsan
  ANNOTATION_TRAIN: /SSDd/jemo_maeng/dset/poongsan/Labeled/260618_poongsan_raw_20_aligned/_det_splits/det_train.json
  ANNOTATION_VAL:   /SSDd/jemo_maeng/dset/poongsan/Labeled/260618_poongsan_raw_20_aligned/_det_splits/det_val.json
  MODALITY_KEYS:
    img:     rgb
    thermal: thermal_aligned
    lidar:   depth_map_lidar
  MODALS: ['img', 'lidar', 'thermal']
  REQUIRE_ALL_MODALITIES: true
  IMG_SIZE: [1024, 1024]
  MIN_AREA: 16.0

MODEL:
  SEG_MODEL: LoRA_Sam_P29_Det
  SEG_CHECKPOINT: ''
  SAM2_CHECKPOINT: semseg/models/sam2/sam2/checkpoints/sam2.1_hiera_base_plus.pt
  SAM2_CONFIG: sam2_hiera_b+.yaml
  LORA_R: 4
  AMF_MODE: uniform
  N_CLASSES: null                                 # → 10 (poongsan categories)
  FPN_CHANNELS: [32, 64, 256]
  FPN_STRIDES: [4, 8, 16]
  HIDDEN_DIM: 256
  N_CONVS: 4
  MODALITY_FUSE: mean
  FREEZE_BACKBONE: false
  TRAIN_MEMORY: true
  GRAD_CHECKPOINT: true                           # 24GB 4090: SAM2 trunk activation 재계산 (Hiera-B+ 유지)

TRAIN:
  EPOCHS: 50
  BATCH_SIZE: 4                                    # grad-ckpt로 batch1이 4.7GB/24GB만 사용 → 4로 상향(가속)
  VAL_BATCH_SIZE: 4
  GRAD_ACCUM_STEPS: 2                              # 유효 배치 8 (4 x 2)
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 5
  NUM_WORKERS: 8
  AMP: true

EVAL:
  NMS_THRESH: 0.5
  SCORE_THRESH: 0.05
