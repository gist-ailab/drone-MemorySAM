# MemorySAM Object Detection — P29-Det, dataset v20260703_egofill (bengio 5-GPU)
#
# det_P29_indoor_jarvis_v2.yaml 에서 데이터만 교체 (변수 격리):
#   - 라벨: v20260702_2303 (신규 라벨, E1.1b/c 와 동일)
#   - lidar: egofill (ego-motion 보정 최근접 스캔 재투영) → REQUIRE_ALL 유지한 채
#     train 5,862 → 11,799장 (egofill 5,033 포함, 2.01배)
#   - eval: test 를 기존 1,772 프레임(원본 lidar 만)으로 제한 — E1.1/P29 0.4455 와 공정 비교
#   - WANDB off (bengio 인증 미확인 — 로그/ckpt 로 충분), 그 외 하이퍼파라미터 동일
# 실행: CUDA_VISIBLE_DEVICES=<free5> torchrun --nproc_per_node=5 train_det.py --cfg <this>

OUTPUT_DIR: outputs/det_egofill

DATASET:
  ROOT: /SSDb/jemo_maeng/dset/poongsan_v2
  ANNOTATION_TRAIN: /SSDb/jemo_maeng/dset/poongsan_v2/_det_splits/det_train_v2_egofill.json
  ANNOTATION_VAL:   /SSDb/jemo_maeng/dset/poongsan_v2/_det_splits/det_test_v2_orig1772.json
  MODALITY_KEYS:
    img:     rgb
    thermal: thermal_aligned
    lidar:   depth_map_lidar
  MODALS: ['img', 'lidar', 'thermal']
  REQUIRE_ALL_MODALITIES: true
  IMG_SIZE: [1024, 1024]
  MIN_AREA: 16.0

MODEL:
  SEG_MODEL: LoRA_Sam_P29_Det
  SEG_CHECKPOINT: ''
  SAM2_CHECKPOINT: semseg/models/sam2/sam2/checkpoints/sam2.1_hiera_base_plus.pt
  SAM2_CONFIG: sam2_hiera_b+.yaml
  LORA_R: 4
  AMF_MODE: uniform
  N_CLASSES: null
  FPN_CHANNELS: [32, 64, 256]
  FPN_STRIDES: [4, 8, 16]
  HIDDEN_DIM: 256
  N_CONVS: 4
  MODALITY_FUSE: mean
  FREEZE_BACKBONE: false
  TRAIN_MEMORY: true
  GRAD_CHECKPOINT: false

TRAIN:
  EPOCHS: 50
  BATCH_SIZE: 1
  VAL_BATCH_SIZE: 1
  GRAD_ACCUM_STEPS: 1
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCHS: 5
  SAVE_INTERVAL: 5
  NUM_WORKERS: 4
  AMP: true

WANDB:
  ENABLE: false
  PROJECT: p29-det
  ENTITY: null
  VIZ_COUNT: 8
  VIZ_SCORE_THRESH: 0.3

EVAL:
  NMS_THRESH: 0.5
  SCORE_THRESH: 0.05
