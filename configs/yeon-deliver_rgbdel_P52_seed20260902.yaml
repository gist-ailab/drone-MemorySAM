# ═══ [P52] RxDINO — 단일-config 자기-적응 처방 · DELIVER 4모달(img/depth/event/lidar) ═══
# 캠페인 최종 본실험(3벤치 × 시드2). 이 파일 = DELIVER / seed 20260902.
#
# 정본 설계 : .claude_logs/decisions/2026-08-31-p52-rxdino-adaptive-amendment.md
# UniBal 캘리브레이션(CAP=0.7 확정) : .claude_logs/experiments/analysis/2026-09-04-p52-unibal-calibration.md
# init 결정(2026-09-07, user 승인) : P50-EXT Phase2 채택 게이트 기각(legal test 53.10 < 55.25)
#   → DELIVER·MUSES 는 기존 Phase1(프로브, 200k, 4모달 img/depth/event/lidar) 어댑터로 init.
#   Phase1 어댑터 산출 경로(yeon 로컬) = /SSDe/jemo_maeng/ckpt/p50map_probe/p50map_probe.pth
#   (이 DELIVER config 는 yeon 에서 돌리므로 경로 그대로 유효. STRICT=true = 기존 게이트 관례.)
#
# 🔴 P52 의 핵심 주장 = "3벤치 method-config 완전 동일". 아래 블록이 세 벤치에서 byte-동일이다:
#     MODEL.P46.C3_PROTO · MODEL.P47_2 · MODEL.C3_ADAPTIVE · MODEL.UNIBAL_ADAPTIVE.
#   벤치별로 다른 것 = DATASET/모달 키 · 학습 로지스틱스(해상도/epoch/aug, 각 벤치 기존 튜닝) ·
#     PRETRAINED_ADAPTERS 유무(DELIVER/MUSES=Phase1 init, MCubeS=무-init). 거동은 λ 궤적으로 창발(G4).
#
# 컨트롤러 배선(semseg/models/reliadino/model.py 실측):
#   - C3_ADAPTIVE(ENABLE) → C3Adaptive. **P46.C3_PROTO.ENABLE=true 필수**(없으면 ValueError, L685).
#   - UNIBAL_ADAPTIVE(ENABLE) → UniBalAdaptive. P47_2 head 를 재사용(있으면)/자동생성(없으면, L698).
#     head 없이도 켜지지만 "config 동일" 주장을 위해 P47_2 를 명시적으로 켠다.
# 🔴 기동검증 : PRETRAINED_ADAPTERS 로드 로그의 missing/unexpected 키 수 확인
#   (unexpected>0 이면 STRICT 로 즉사 = 아키 불일치). Phase1 어댑터(M=4,r=8)는 이 모델과 키·shape 동일.
# 🔴 공정성 : PHYSAUG off · DGFUSION_AUG on · val-best ckpt · TTA 금지.
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py --cfg <this>
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/yeon_deliver_rgbdel_P52_seed20260902'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16          # exp-dir naming only
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null                      # null -> alpha = r (scale 1.0)
  FPN_DIM       : 256

  # ═══ [P50-MAP] Phase1(프로브) 정렬 사전학습 초기화 — DELIVER/MUSES 공통 ═══
  # 이 키를 지우면 무-init(random adapter)과 byte-동일하게 돌아간다.
  PRETRAINED_ADAPTERS : '/SSDe/jemo_maeng/ckpt/p50map_probe/p50map_probe.pth'  # yeon 로컬
  PRETRAINED_ADAPTERS_STRICT : true         # unexpected 키 있으면 즉사(아키 불일치 보호)

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    TRUNK       : gated_mlp
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2]
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  ROUTER:                                   # [P36] 유일 생존 모듈 — 유지
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:
    ENABLE : false
  CLASS_TOKEN:
    ENABLE : false

  M2F:                                      # [P38/P39] 변경 없음 (P39.1과 동일)
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0
    W_CLS           : 2.0
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5
    SRC             : modal
    ANCHORED        : true
    POINT_QUOTA     : 256

  P39:                                      # [P39.1-rank] base — 변경 없음
    TRUNK_EXP       : true
    ARBITER         : true
    PATH_DROPOUT_P  : 0.25
    ROUTER_CE_W     : 0.4
    TRUNK_MODE      : gated_mlp
    TRUNK_HIDDEN    : 256
    VICREG:
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  # ═══ [P46-CTR] class-transfer recovery — C3 prototype (C3-adaptive 가 λ_c 를 지배) ═══
  #   🔴 세 벤치 byte-동일 블록 #1. C3_ADAPTIVE 가 켜지려면 C3_PROTO.ENABLE=true 필수.
  P46:
    C1_RCS:
      ENABLE        : false
      MODE          : daformer
      TEMP          : 0.01
      MIN_PIXELS    : 1
      LOSS_BLEND_W  : 1.0
      EMA_M         : 0.99
      EMA_INTERVAL  : 1
      REFRESH       : 32
      SEED          : 0
      CACHE_DIR     : ''
    C2_MCC:
      ENABLE        : false
      MASK_RATIO    : 0.5
      PATCH         : 64
      MODALS        : all
      LAMBDA        : 1.0
      CONF_THRESH   : 0.75
      LOSS          : ce
      EMA_ALPHA     : 0.999
      WARMUP_EP     : 5
    C3_PROTO:
      ENABLE        : true       # C3-adaptive 의 전제(prototype 손실 제공). λ 는 C3_ADAPTIVE 가 per-class 조절.
      FEATURE       : mfeat
      LAMBDA        : 0.1
      TEMPERATURE   : 0.1
      EMA           : 0.999
      PIXELS        : 4096
      WARMUP_EP     : 5
      CROSS_VIEW    : false
      CROSS_VIEW_W  : 1.0

  # ═══ [P47-2] Uni-modal Balance head — UniBal-adaptive 의 신호원(L_m) ═══
  #   🔴 세 벤치 byte-동일 블록 #2. UNIBAL_ADAPTIVE 가 이 head 의 per-modal CE(last_ce)를 소비.
  #   ENABLE=false 여도 UNIBAL_ADAPTIVE 가 head 를 자동생성하지만(model.py L698) "config 동일"을 위해 명시.
  P47_2:
    ENABLE      : true
    LAMBDA_U    : 0.4        # λ_u 상한은 UNIBAL_ADAPTIVE.LAMBDA_U_MAX 가 지배(이 값은 head 생성 인자)
    MODALS      : all
    HEAD        : linear
    HIDDEN      : 256
    WARMUP_EP   : 0          # UNIBAL_ADAPTIVE 가 warmup 소유 → model.py L709 에서 0 으로 통일
    GT_DIV      : 4
    REDUCE      : mean
    OGM_GE:
      ENABLE   : false
      ALPHA    : 0.5
      EMA      : 0.9
      MIN_K    : 0.1
      GE_NOISE : 0.0

  # ═══ [P52] RxDINO 자기-적응 컨트롤러 (학습 전용, 파라미터 0) ═══
  #   🔴 세 벤치 byte-동일 블록 #3·#4. 값의 근거는 상단 정본/캘리브레이션 링크.
  C3_ADAPTIVE:                 # per-class λ_c = λ_max·clamp(s_c/τ,0,1). G4-DELIVER 예측 = RailTrack λ↑.
    ENABLE     : true
    LAMBDA_MAX : 0.1           # = C3_PROTO.LAMBDA (전 클래스 s_c≥TAU 시 균일 λ 상한)
    TAU        : 0.25
    EMA_M      : 0.99
    WARMUP_EP  : 5
  UNIBAL_ADAPTIVE:             # per-modal λ_u,m = λ_u_max·g_m/CAP. G4-MUSES 예측 = radar λ_u↑.
    ENABLE       : true
    LAMBDA_U_MAX : 0.4
    CAP          : 0.7         # 캘리브레이션 확정(기본 2.0→0.7, MUSES radar λ_u≈0.33)
    EMA_M        : 0.99
    WARMUP_EP    : 0
    WARMUP_SMALL : 0.05

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : DELIVER
  ROOT          : '/SSDb/jemo_maeng/dset/DELIVER'   # yeon DELIVER path
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  # [P50-MAP] 사전학습 스크립트 전용 힌트(train_reliadino 는 trainset.n_classes 사용, 파인튠 무영향).
  NUM_CLASSES   : 25
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  DGFUSION_AUG  : true
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  LORA_NORM_CAP : 20.0
  SEED          : 20260902          # [P52 seed2] 이 캠페인 미사용 신규 시드
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 1
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 1
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [768, 768]
  OVERLAY       : false
