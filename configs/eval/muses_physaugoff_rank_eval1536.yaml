# [MUSES PhysAug-off 공정선 3시드(824/825/826) 해상도 효과 2026-10-16] 생각정리 지시.
#   배경: 우리 MUSES 공식 평가는 native 1080×1920을 1024² 레터박스로 넣어 긴 변 1920→1024(0.53배)인데,
#   DGFusion MUSES는 MIN_SIZE_TEST 1024·MAX 2048(짧은 변 1080→1024, 약 0.95배)로 추론한다 —
#   DELIVER에서 본 "평가 해상도 효과"가 MUSES에서도 나는지 확인하는 용도.
#   원본(824/825/826이 실제로 학습한) config는 이 저장소에 커밋돼 있지 않음(절차 사고로 서버에만
#   있던 파생본, judgment-ledger.md 09-24/09-25 행 참조) — MODEL/DATASET 블록은 같은 레시피인
#   yeon-muses_rgbel_P39_1_rank_seed20260825.yaml(PhysAug-on 형제본)에서 그대로 가져왔다.
#   PHYSAUG 값은 eval_muses_official.py가 전혀 읽지 않아(학습 전용 증강) eval 결과에 영향 없음 —
#   단 기록 정확성을 위해 false로 맞춰 둔다. --ckpt로 세 시드 체크포인트를 바꿔 끼워 공용으로 쓴다.
#   바뀐 키: DATASET.PHYSAUG.ENABLE true→false(eval에 영향 없음) · EVAL.IMAGE_SIZE/TEST.IMAGE_SIZE 1024→1536.
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/muses_physaugoff_rank_eval1536_shared'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false
    LAMBDA : 0.1

  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:        { ENABLE: false }
  CLASS_TOKEN: { ENABLE: false }

  M2F:
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0
    W_CLS           : 2.0
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5
    SRC             : modal
    ANCHORED        : true
    POINT_QUOTA     : 256

  P39:
    TRUNK_EXP       : true
    ARBITER         : true
    PATH_DROPOUT_P  : 0.25
    ROUTER_CE_W     : 0.4
    TRUNK_MODE      : gated_mlp
    TRUNK_HIDDEN    : 256
    VICREG:
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : MUSES
  ROOT          : '/SSDb/jemo_maeng/dset/MUSES'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'event']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  SEED          : 20260824
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EPOCHS        : 300
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 15
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1536, 1536]
  BATCH_SIZE    : 4
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/MUSES'
  IMAGE_SIZE    : [1536, 1536]
  OVERLAY       : false
