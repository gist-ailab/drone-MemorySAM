# [DAILY-CARDS E4 legal 재채점용] 원본 = bengio-deliver_rgbdel_P46_c3only_seed20260821_screen40_E4.yaml (MODEL 블록 동일 → ckpt strict load 보장)
#   변경 = EVAL.IMAGE_SIZE·TEST.IMAGE_SIZE [1024,1024], EVAL.BATCH_SIZE 1(하네스 규약 native-GT BS1), TEST.FILE bengio DELIVER 경로.
#   MODEL_PATH는 --model_path 인자로 준다(val-best ckpt).
# [DAILY-CARDS E4] 혼동 쌍 margin 손실 — B0(c3only) 복사 + MODEL.P46.CONFUSION_MARGIN 켬
#   원본 = bengio-deliver_rgbdel_P46_c3only_seed20260821_screen40_B0.yaml
#   변경 = SAVE_DIR·헤더 + P46.CONFUSION_MARGIN(ENABLE true, PAIRS auto_val_k5, MARGIN 0.5, LAMBDA 0.05)
# 카드 = .claude_logs/decisions/2026-09-07-daily-cycle-experiment-cards.md §1 "E4"
#
# 가설: DELIVER 붕괴는 특정 혼동 쌍(RailTrack→Sky/Static, Wall→Building 등)으로 흡수된다.
#   C-3(C3_PROTO)는 클래스별 "당김"이고, E4는 그 위에 얹는 혼동 쌍별 "밀어냄"(margin)이다.
#   auto: warmup(C3 WARMUP_EP=5) 후 첫 epoch(=ep6) 종료 시 검증셋(앞 200장) 행-정규화
#   혼동행렬에서 대각 제외 top-5 (GT c → 예측 j) 쌍을 고정 → 이후 GT=c 픽셀에서
#   cos(f,p_c) − cos(f,p_j) ≥ MARGIN 이 되도록 hinge(prototype 소스, C3 bank 앵커).
#   λ=0.05로 총손실에 가산. 추론 경로는 B0(P39.1)과 완전히 동일(학습 전용).
#
# 🔴 통과 기준(카드): Δtest(E4 − B0) ≥ +1.0 and 악조건 −0.5 미만 없음, 표적 쌍 IoU 회복.
# 🔴 공정성: PHYSAUG off · DGFUSION_AUG on · val-best ckpt · TTA 금지 (B0와 동일).
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/bengio_deliver_rgbdel_P46_c3only_seed20260821_screen40_E4'  # [DAILY-CARDS E4] decisions/2026-09-07-daily-cycle-experiment-cards.md

# Trainer = train_reliadino.py.
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py --cfg <this>
MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16          # exp-dir naming only
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null                      # null -> alpha = r (scale 1.0)
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:                              # G0c 동결: 효과≈0 판정(P35/T1)
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2] fog_night 유해 실증(07-20)
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  ROUTER:                                   # [P36] 유일 생존 모듈 — 유지
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:
    ENABLE : false
  CLASS_TOKEN:
    ENABLE : false

  M2F:                                      # [P38/P39] 변경 없음 (P39.1과 동일)
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0
    W_CLS           : 2.0
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5
    SRC             : modal
    ANCHORED        : true
    POINT_QUOTA     : 256

  P39:                                      # [P39.1-rank] base — 변경 없음
    TRUNK_EXP       : true
    ARBITER         : true
    PATH_DROPOUT_P  : 0.25
    ROUTER_CE_W     : 0.4
    TRUNK_MODE      : gated_mlp
    TRUNK_HIDDEN    : 256
    VICREG:
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  # ═══ [P46-CTR] class-transfer recovery — C-3 단독 + [E4] 혼동 쌍 margin ═══
  P46:
    C1_RCS:
      ENABLE        : false      # [C3-only ablation] RCS 끔
      MODE          : daformer
      TEMP          : 0.01
      MIN_PIXELS    : 1
      LOSS_BLEND_W  : 1.0
      EMA_M         : 0.99
      EMA_INTERVAL  : 1
      REFRESH       : 32
      SEED          : 0
      CACHE_DIR     : ''

    C2_MCC:
      ENABLE        : false      # [C1+C3 변형] 2-forward 주범 제거 — 24GB 대응
      MASK_RATIO    : 0.5
      PATCH         : 64
      MODALS        : all
      LAMBDA        : 1.0
      CONF_THRESH   : 0.75
      LOSS          : ce
      EMA_ALPHA     : 0.999
      WARMUP_EP     : 5

    C3_PROTO:                    # [E4 앵커] SOURCE=proto의 prototype bank — 켜져 있어야 함
      ENABLE        : true
      FEATURE       : mfeat      # 단일 bank(stride-4 head feature, 256)
      LAMBDA        : 0.1
      TEMPERATURE   : 0.1
      EMA           : 0.999
      PIXELS        : 4096       # [E4] pair_margin이 재사용하는 서브샘플 노브
      WARMUP_EP     : 5          # [E4] auto 쌍은 이 warmup 후 첫 epoch 종료 시 확정
      CROSS_VIEW    : false
      CROSS_VIEW_W  : 1.0

    # ── [E4] 혼동 쌍 margin 손실 ───────────────────────────────────────────
    # 시작 시(auto: warmup 후 검증셋 혼동행렬 top-k) 혼동 쌍을 고정하고, GT=c
    # 픽셀에서 정답(c) prototype과 혼동(j) prototype의 코사인 마진을 hinge로 벌린다.
    # 학습 전용 — 추론 경로 불변(off면 버퍼조차 안 만들어 state_dict byte-동일).
    CONFUSION_MARGIN:
      ENABLE        : true
      PAIRS         : auto_val_k5   # 'auto_val_k<k>' | 명시 [[RailTrack, Sky], ...]
      MARGIN        : 0.5           # hinge 목표 마진 m
      LAMBDA        : 0.05          # 총손실 가산 배율
      VAL_IMAGES    : 200           # auto 혼동행렬 산출에 쓸 검증 이미지 수
      SOURCE        : proto         # proto(C3 bank 앵커) | logit(최종 로짓 (c−j) 마진)
      # WARMUP_EP 미지정 → C3_PROTO.WARMUP_EP(5) 계승: ep6 종료 시 쌍 확정

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : DELIVER
  ROOT          : '/SSDe/jemo_maeng/dset/DELIVER'   # bengio DELIVER path (2026-09-07 실측: /SSDe에만 존재)
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # DGFusion 공정선: PhysAug OFF + SSD photometric (ColorAugSSD, ISSUE-026 픽스본)
  DGFUSION_AUG  : true
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  LORA_NORM_CAP : 20.0
  SEED          : 20260821                # 카드 공통 시드
  IMAGE_SIZE    : [768, 768]      # /16 -> 48x48 tokens
  BATCH_SIZE    : 1               # B0와 동일 (C3-only, cross_view off — base 14GiB 실측)
  EPOCHS        : 40   # [스크린] 40ep 조기 판정. 확정은 200ep 3페어
  EVAL_START    : 0
  EVAL_INTERVAL : 5
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1                 # BS1 일관(TRAIN과 동일 이유)
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDe/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
