# [E13 확정 런 200ep 완주분 legal 재채점] val-best 재채점용, jarvis.
#   학습 config 에서 EVAL/TEST 의 IMAGE_SIZE 를 1024 로, EVAL.BATCH_SIZE 를 1 로 맞춘 파생본이다.
#   🔴 native-GT BS1: test 1897장 / val 2005장이 그 장수 그대로 돌아야 한다.
#      진행 표시줄이 475/501 로 뜨면 BS 가 4 인 것이므로 즉시 중단하라(두 번 실증된 사고).
#   🔴 ckpt 는 val-best(epoch*_top1_checkpoint.pth)만 쓴다. test_ 접두어는 test-best 라 무효다.
# [E13 확정 런 200ep, 시드 20260821] E1(중간층 4탭) + E3(센서별 prototype) 결합.
#   선정 근거: legal test 56.30 — **25클래스 Δ +2.52 · 24클래스 Δ +1.79 로 둘 다 카드 최고**(E1 +0.57 의 세 배).
#   이득이 RailTrack 한 클래스가 아니라 TrafficLight +11.57 · Static +9.25 · Fence +6.67 · SideWalk +4.46 에 퍼져 있어
#   RailTrack 교란(§5-3)을 걷어내도 살아남는다. TrafficLight·Static 은 '다음 병목 = 얇고 작은 객체'에 정확히 해당.
#   🔴 트레이너 val 은 카드 최저(65.50)였다 — val 로 판정했으면 버렸을 카드다(§5-4).
#   변경 = EPOCHS 40→200 · SAVE_DIR 둘뿐. 레시피(TAPS [6,12,18,24] per_modal + C3_PROTO permodal, AGREE_LAMBDA 0.0)는 스크린 그대로.
# [E13] E1(중간층 4탭 읽기, MODEL.TAPS) + E3(센서별 class prototype, C3_PROTO.SRC permodal) 결합 40ep 스크린, 시드 20260821, jarvis 4090.
#   근거: legal test E3 +1.40(1위)·E1 +1.07(2위, 순이득 구조: Wall/Static 보존). 두 축 직교(특징 접점 vs 손실). 가설: 가산 → Δtest ≈ +2.
#   변경 = E1 config + C3_PROTO.SRC permodal/AGREE_LAMBDA 0.0 + ROOT·TEST.FILE·SAVE_DIR·EVAL.BATCH_SIZE 4
# [DAILY-CARDS E1] 4탭 읽기 (S1) — 원본 B0(bengio-deliver_rgbdel_P46_c3only_seed20260821_screen40_B0.yaml)
#   변경 = 정확히 1개: MODEL.TAPS.ENABLE true (블록 6/12/18/24 다중 레벨 탭을 SimpleFPN 레벨별로 투입).
#   그 외 SAVE_DIR 만 E1 로 바꿨다(산출물 분리).
# 카드 정본 = .claude_logs/decisions/2026-09-07-daily-cycle-experiment-cards.md §1 "E1" 행.
#   가설: 기하 센서(depth·lidar)의 클래스 근거는 중간층에 있다. P43 lateral 을 M2F 헤드와
#   분리한 단독 토글로, 투영은 non-zero init. 게이트: Δtest ≥ +1.0, 이득은 depth·lidar 의존
#   클래스(Wall·Water)에 집중 예측.
# 구조 사다리 S1 = .claude_logs/decisions/2026-09-07-p52-validity-audit-and-bottleneck-program.md §3.6.
#
# TAPS.MODE=per_modal(기본): 센서마다 독립 탭 투영을 걸어 FPN 레벨에서 합산(모달별 탭 유지).
#   P43 식 모달 평균은 MODE=mean 으로 폴백 가능. non-zero init(Conv2d 기본 kaiming, 실패-키1 준수).
# ═══ P46-CTR — bengio DELIVER 4모달(img/depth/event/lidar): P39.1-rank + C3 [본학습, 40ep 스크린] ═══
# 🔴 추론 경로는 P39.1 + 탭 주입(학습·추론 공통) — teacher·bank·샘플러는 학습 루프에만.
# 🔴 게이트(사전등록): test ≥56.71(DGFusion) & val ≥68.
# 🔴 공정성: PHYSAUG off · DGFUSION_AUG(ColorAugSSD, ISSUE-026 픽스본) on · val-best ckpt · TTA 금지.
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/jarvis_deliver_rgbdel_P46_c3only_seed20260821_E13_confirm200'  # [DAILY-CARDS E1 40ep 스크린]

# Trainer = train_reliadino.py.
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py --cfg <this>
MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16          # exp-dir naming only
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null                      # null -> alpha = r (scale 1.0)
  FPN_DIM       : 256

  # ═══ [E1] DINOv3 다중 레벨 탭 읽기 — 이번 카드의 유일한 변경 ═══
  TAPS:
    ENABLE  : true                          # off(기본)면 B0 와 forward·state_dict byte-동일
    LAYERS  : [6, 12, 18, 24]               # 1-indexed 블록(24블록에서 24=마지막). resolve_taps 규약
    MODE    : per_modal                     # per_modal(센서별 탭 유지·FPN 레벨 합산) | mean(P43 식 모달 평균)

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:                              # G0c 동결: 효과≈0 판정(P35/T1)
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2] fog_night 유해 실증(07-20)
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  ROUTER:                                   # [P36] 유일 생존 모듈 — 유지
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:
    ENABLE : false
  CLASS_TOKEN:
    ENABLE : false

  M2F:                                      # [P38/P39] 변경 없음 (P39.1과 동일)
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0
    W_CLS           : 2.0
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5
    SRC             : modal
    ANCHORED        : true
    POINT_QUOTA     : 256

  P39:                                      # [P39.1-rank] base — 변경 없음
    TRUNK_EXP       : true
    ARBITER         : true
    PATH_DROPOUT_P  : 0.25
    ROUTER_CE_W     : 0.4
    TRUNK_MODE      : gated_mlp
    TRUNK_HIDDEN    : 256
    VICREG:
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  # ═══ [P46-CTR] class-transfer recovery — C3 단독(C1/C2 off, B0 동일) ═══
  P46:
    C1_RCS:
      ENABLE        : false
      MODE          : daformer
      TEMP          : 0.01
      MIN_PIXELS    : 1
      LOSS_BLEND_W  : 1.0
      EMA_M         : 0.99
      EMA_INTERVAL  : 1
      REFRESH       : 32
      SEED          : 0
      CACHE_DIR     : ''
    C2_MCC:
      ENABLE        : false
      MASK_RATIO    : 0.5
      PATCH         : 64
      MODALS        : all
      LAMBDA        : 1.0
      CONF_THRESH   : 0.75
      LOSS          : ce
      EMA_ALPHA     : 0.999
      WARMUP_EP     : 5
    C3_PROTO:
      ENABLE        : true
      SRC           : permodal   # [E13←E3] 센서별 prototype bank
      AGREE_LAMBDA  : 0.0        # [E13←E3] 일치 항 무효(E3와 동일)
      FEATURE       : mfeat
      LAMBDA        : 0.1
      TEMPERATURE   : 0.1
      EMA           : 0.999
      PIXELS        : 4096
      WARMUP_EP     : 5
      CROSS_VIEW    : false
      CROSS_VIEW_W  : 1.0

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : DELIVER
  ROOT          : '/SSDb/jemo_maeng/dset/DELIVER'   # jarvis DELIVER path
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # DGFusion 공정선: PhysAug OFF + SSD photometric (ColorAugSSD, ISSUE-026 픽스본)
  DGFUSION_AUG  : true
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  LORA_NORM_CAP : 20.0
  SEED          : 20260821
  IMAGE_SIZE    : [768, 768]      # /16 -> 48x48 tokens
  BATCH_SIZE    : 1                 # 3090 24GB: 4탭×4센서 투영은 BS1 유지(B0 규약). 기동 전 P46_MEM_LOG=1 권장
  EPOCHS        : 200  # [확정 런] 24클래스 Δtest +1.79(카드 최고, E1 +0.57 의 세 배)
  EVAL_START    : 0
  EVAL_INTERVAL : 5
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]   # [legal] 하네스 규약 1024
  BATCH_SIZE    : 1   # [legal] native-GT BS1
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [1024, 1024]   # [legal] 하네스 규약 1024
  OVERLAY       : false
