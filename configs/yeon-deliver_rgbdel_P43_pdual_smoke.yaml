# ═══ P43-PanopticDual smoke (yeon RTX3090, EPOCHS 2, wandb off) ═══
# base = configs/hpca100-deliver_rgbdel_P43_pdual.yaml. 차이 = EPOCHS 2 + yeon 경로 + SAVE_DIR.
# 목적: 실데이터·실백본·DDP에서 한 epoch이 끝까지 도는지 + train/p43_mask_loss가 실제로 내려가는지.
#   합성 스모크(tools/smoke_p43.py, CPU)는 결선·gradient·등가성을 이미 검증했다 — 여기서 볼 것은
#   ① iteration 전진 ② rank0 GPU util>0 ③ 메모리가 가중치 수준(3~4GiB)이 아닌 활성화 수준
#   ④ 첫 eval 통과 ⑤ [P43] mask_loss/lambda 로그 라인 출현. (CLAUDE.md §1.6 기동 검증 기준)
# BATCH_SIZE 2 @768²는 3090 24GB 기준 — OOM이면 BATCH_SIZE 1 (accum이 eff-batch 16 자동 유지)
#   또는 P43.NUM_POINTS를 12544 → 6272로 먼저 낮출 것.
# ═══ (이하 base 헤더) P43-PanopticDual × DELIVER 4모달 — MUSES판과 동일 아키텍처 ═══
# 설계: .claude_logs/decisions/2026-07-24-p43-p45-cvpr-sota-proposal.md §2
# 단일 아키텍처 제약: 이 파일과 configs/jarvis-muses_rgbel_P43_pdual.yaml의 MODEL 블록은
#   DATASET 관련(THING_IDS, MODALS)을 빼면 동일하다. 데이터셋 차이는 config로만 표현한다.
#
# DELIVER에서 P43에 기대하는 것은 PQ가 아니라 **Head A 무손상 + thin-class**다:
#   DELIVER 병목은 도메인이 아니라 클래스 축(Other≤5, Bridge≤1, Wall≈7, Water≈11 — 실패-키 4).
#   P38은 m2f 잔차가 router를 희석해 thin-class를 되잃었다(Wall 13.3→≈7). P43은 잔차가 없어
#   Head A의 router 경로를 건드리지 않으므로 그 퇴행이 재현되지 않아야 한다 = 게이트 ②.
# 게이트(사전등록): P36 fair(val 67.74 / test 55.62) + thin-class(Wall≥13 / Water≥9.5 /
#   RailTrack≥62). ep30에 tools/module_ablation.py --toggles p43_lateral_off 즉검.
# ⚠️ DELIVER에는 instance/panoptic GT가 없다 → THING_IDS 비움(전부 stuff). panoptic_inference는
#   동작하지만 PQ_thing은 정의되지 않는다. PQ 판정은 MUSES에서만 한다.
# Base recipe = P36-router 공정선 (GATE·CALIB off [M-2] / ROUTER on / ATTN_BIAS·CONSISTENCY off
#   / PHYSAUG off / DGFUSION_AUG on). M2F(P38 헤드) off = 비교군이지 구성요소 아님. P39 off.
# 🔴 GRADIENT_CHECKPOINT: false (ISSUE-027 active_modality 오염 — 40GB라 필요 없음).
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py --cfg <this>
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/yeon_deliver_rgbdel_P43_pdual_smoke'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2] fog_night 유해 실증(07-20)
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:        { ENABLE: false }
  CLASS_TOKEN: { ENABLE: false }
  M2F:         { ENABLE: false }   # 🔴 P38 잔차 헤드 = 비교군. 켜지 말 것.
  P39:         { TRUNK_EXP: false, ARBITER: false }

  # [P43] PanopticDual — MUSES판과 THING_IDS 외 완전 동일
  P43:
    M2F_HEAD         : true
    NUM_QUERIES      : 100
    DEC_LAYERS       : 6
    DIM              : 256
    NUM_HEADS        : 8
    MLP_RATIO        : 2.0
    W_CLS            : 2.0
    W_BCE            : 5.0
    W_DICE           : 5.0
    NO_OBJ_W         : 0.1
    NUM_POINTS       : 12544
    OVERSAMPLE       : 3.0
    IMPORTANCE       : 0.75
    DEEP_SUPERVISION : true
    LAMBDA           : 1.0
    LAMBDA_WARMUP_EP : 5
    LATERAL          : true
    NUM_TAPS         : 3
    EVAL_HEAD        : false
    SEM_SOURCE       : pixel
    THING_IDS        : []          # DELIVER: instance GT 없음 → 전부 stuff

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : DELIVER
  ROOT          : '/SSDb/jemo_maeng/dset/DELIVER'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # DGFusion 공정선: PhysAug OFF + SSD photometric (ColorAugSSD)
  DGFUSION_AUG  : true
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  LORA_NORM_CAP : 20.0            # b_q/b_v Frobenius cap (P35/T1 seam)
  IMAGE_SIZE    : [768, 768]      # /16 -> 48x48 tokens
  BATCH_SIZE    : 2               # yeon 3090 24GB. accum=ceil(16/(BS×world))로 eff-batch 16 유지.
  EPOCHS        : 2
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 2
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [768, 768]
  OVERLAY       : false
