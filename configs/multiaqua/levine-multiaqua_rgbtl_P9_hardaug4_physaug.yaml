DEVICE          : cuda
SAVE_DIR        : './outputs/MMSamP9/levine_multiaqua_rgbtl_P9_hardaug4_physaug'

MODEL:
  NAME          : CMNeXt
  BACKBONE      : CMNeXt-B2
  PRETRAINED    : '/hpc2hdd/home/cliao127/MMSS-SAM-S1/sam/checkpoints/pretrained/segformer/mit_b2.pth'
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  LORA_MODEL    : LoRA_Sam_P9
  LORA_R        : 4
  LORA_NUM_EXPERTS : null
  LORA_TOP_K    : None
  LORA_LAYER    : null

DATASET:
  NAME          : MULTIAQUA
  ROOT          : '/ailab_mat2/personal/jemo_maeng/dset/Drone/MULTIAQUA_night'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'thermal']

  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  # hardaug4 + PhysAug: 기존 hardaug4에 물리 기반 공간적 교란 추가
  NIGHT_AUG     :
    ENABLE      : true
    NIGHT_SIM_P : 0.45
    BRIGHTNESS_RANGE : [0.03, 0.45]
    BRIGHTNESS_SAMPLING : dark_biased
    DARK_BIASED_RATIO  : 0.6
    DARK_RANGE    : [0.03, 0.12]
    MODERATE_RANGE: [0.12, 0.45]
    CONTRAST_RANGE   : [0.3, 0.7]
    GAMMA_RANGE     : [0.4, 0.8]
    NOISE_STD       : 0.02
    SHOT_NOISE_GAIN_RANGE : [20, 80]   # Poisson shot noise, gain 낮을수록 노이즈 강함
    CRM_P       : 0.35
    CRM_MASK_RATIO  : [0.2, 0.5]
    ZERO_P      : 0.09
    # PhysAug: 물리 기반 공간적 교란 (NightSim 이전에 적용)
    # Ref: PhysAug (AAAI 2025) — random conv + planar wave perturbation
    PHYSAUG:
      ENABLE    : true
      P         : 0.40                 # 40% 확률 적용 (boundary 보존 위해 보수적)
      FILTER:
        ENABLE      : true
        SIGMA_RANGE : [0.0, 1.5]       # 원본 [0,4] 대비 보수적 (segmentation용)
        KERNEL_SIZE : 3
      FOURIER:
        ENABLE      : true
        GROUPS      : [1, 513]         # freq = group/1024, 저~중주파
        PHASES      : [0.0, 1.0]       # [0, -π] 범위
        GRANULARITY : 256              # 위상 이산화 해상도
        MEAN_STR    : 8.0              # 원본 5 대비 약함 (higher=weaker)
        DECAY       : 0.3              # Gaussian spatial decay (국소 효과)

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 1
  AMP           : false
  DDP           : True

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EVAL_DAY      : false

  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

TEST:
  MODEL_PATH    : ''
  FILE          : '/ailab_mat2/personal/jemo_maeng/dset/Drone/MULTIAQUA_night'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
