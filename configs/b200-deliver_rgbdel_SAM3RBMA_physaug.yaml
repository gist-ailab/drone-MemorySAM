DEVICE          : cuda
SAVE_DIR        : './outputs/MMSam3RBMA/b200_deliver_rgbdel_SAM3RBMA_physaug'

# ⚠️ 실행 전: PYTHONPATH 에 semseg/models/sam3 추가 (`import sam3`).
# ⚠️ SAM3 가중치(facebook/sam3, sam3.pt)는 gated — 승인 후 MODEL.CHECKPOINT_PATH 지정.

MODEL:
  NAME          : CMNeXt
  BACKBONE      : CMNeXt-B2
  AUTO_RESUME : true
  PRETRAINED    : ''
  RESUME_ENABLE : false        # true로 바꾸면 RESUME_PATH(last.pth)에서 이어서 학습
  RESUME_PATH   : './outputs/MMSam3RBMA/b200_deliver_rgbdel_SAM3RBMA_physaug/last.pth'
  LORA_MODEL    : LoRA_Sam3_RBMA
  LORA_R        : 4
  LORA_NUM_CLASSES : 25
  CHECKPOINT_PATH : '/NHNHOME/ailab/Workspaces/jemo_maeng/src/drone-MemorySAM/semseg/models/sam3/checkpoints/sam3.pt'   # SAM3 sam3.pt (gated); '' → random init
  LOAD_FROM_HF    : false
  LAMBDA_BIAS_INIT : 1.0
  AUX_WEIGHT      : 0.5

DATASET:
  NAME          : DELIVER
  ROOT          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/DELIVER'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  PHYSAUG:
    ENABLE    : true
    P         : 0.40
    FILTER:   { ENABLE: true, SIGMA_RANGE: [0.0, 1.5], KERNEL_SIZE: 3 }
    FOURIER:  { ENABLE: true, GROUPS: [1, 513], PHASES: [0.0, 1.0], GRANULARITY: 256, MEAN_STR: 8.0, DECAY: 0.3 }

TRAIN:
  IMAGE_SIZE    : [1008, 1008]
  BATCH_SIZE    : 4
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1008, 1008]
  BATCH_SIZE    : 4
  NUM_WORKERS : 4
  EVAL_DAY      : false

TEST:
  MODEL_PATH    : ''
  FILE          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [1008, 1008]
