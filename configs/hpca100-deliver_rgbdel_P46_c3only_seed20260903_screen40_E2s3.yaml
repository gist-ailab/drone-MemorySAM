# [E2-s3] 전 선형층 LoRA r32 40ep 스크린 시드 3(20260903), hpca100 — E2 축은 24클래스 Δ 가 시드1 +0.09 / 시드2 +1.00 로 편차가 커서 세 번째 시드로 판별한다. 기준선은 시드1 B0(24클래스 54.69).
# [hpca100 파생] E2 전 선형층 LoRA 40ep 스크린 — 원본 bengio-deliver_rgbdel_P46_c3only_seed20260821_screen40_E2.yaml, 변경 = ROOT·SAVE_DIR 만(레시피 동일)
# [DAILY-CARDS E2] LoRA 타깃 확장 — Q/V(현행) → Q/K/V + O(proj) + MLP(fc1/fc2)
# 파생: bengio-deliver_rgbdel_P46_c3only_seed20260821_screen40_B0.yaml (40ep 스크린 기준선)
# 변경 = LORA_TARGETS [qkv_full, proj, fc1, fc2] · LORA_R 8→32 · LORA_ALPHA null→64(=2r) · SAVE_DIR
# 카드 = .claude_logs/decisions/2026-09-07-daily-cycle-experiment-cards.md §1 "E2" 행
#        구조 사다리 S2 = …p52-validity-audit-and-bottleneck-program.md §3.6
# 근거 = SoMA(2412.04077) 표 8 attn만 < MLP만 < 둘 다(+1.5) · "LoRA Learns Less and
#        Forgets Less"(2405.09673) MLP 가 학습 주 loci, α=2r.
# ✅ model.py 배선 완료(develop 7d83c11 검수 시 추가): MODEL.LORA_TARGETS → FrozenViTEncoder. 기동 로그의 `[E2] lora_targets=[...]` 라인으로 확인(PYTHONUNBUFFERED=1 필요).
# ⚠️ 메모리: E2 는 LoRA up/down 파라미터가 B0 대비 크게 는다(타깃 6배 슬라이스 + r 4배).
#    24GB BS1 여유가 빠듯하면 fc1/fc2 를 r16 으로 낮춘 …_E2b.yaml 을 쓸 것.
# ═══ P46-CTR — bengio DELIVER 4모달(img/depth/event/lidar): C3-only ablation ═══
# 진단·처방·게이트·공정선은 B0 헤더와 동일. 추론 경로는 P39.1과 완전히 동일.
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/hpca100_deliver_rgbdel_P46_c3only_seed20260903_screen40_E2s3'  # [DAILY-CARDS E2]

# Trainer = train_reliadino.py.
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py --cfg <this>
MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16          # exp-dir naming only
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 32                        # [E2] Q/K/V·proj·fc1·fc2 공통 rank (fc1/fc2도 r32)
  LORA_ALPHA    : 64                        # [E2] α=2r (scale 2.0). null 이면 scale 1.0
  LORA_TARGETS  : [qkv_full, proj, fc1, fc2]  # [E2] 전 선형층 확장(Q/K/V + O + MLP)
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:                              # G0c 동결: 효과≈0 판정(P35/T1)
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2] fog_night 유해 실증(07-20)
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  ROUTER:                                   # [P36] 유일 생존 모듈 — 유지
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:
    ENABLE : false
  CLASS_TOKEN:
    ENABLE : false

  M2F:                                      # [P38/P39] 변경 없음 (P39.1과 동일)
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0
    W_CLS           : 2.0
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5
    SRC             : modal
    ANCHORED        : true
    POINT_QUOTA     : 256

  P39:                                      # [P39.1-rank] base — 변경 없음
    TRUNK_EXP       : true
    ARBITER         : true
    PATH_DROPOUT_P  : 0.25
    ROUTER_CE_W     : 0.4
    TRUNK_MODE      : gated_mlp
    TRUNK_HIDDEN    : 256
    VICREG:
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  # ═══ [P46-CTR] class-transfer recovery — 3토글 (전부 학습 전용) ═══
  P46:
    C1_RCS:
      ENABLE        : false      # [C3-only ablation] RCS 끔 — C3 단독기여 격리
      MODE          : daformer
      TEMP          : 0.01
      MIN_PIXELS    : 1
      LOSS_BLEND_W  : 1.0
      EMA_M         : 0.99
      EMA_INTERVAL  : 1
      REFRESH       : 32
      SEED          : 0
      CACHE_DIR     : ''

    C2_MCC:
      ENABLE        : false      # [C1+C3 변형] 2-forward 주범 제거 — 24GB 대응
      MASK_RATIO    : 0.5
      PATCH         : 64
      MODALS        : all
      LAMBDA        : 1.0
      CONF_THRESH   : 0.75
      LOSS          : ce
      EMA_ALPHA     : 0.999
      WARMUP_EP     : 5

    C3_PROTO:
      ENABLE        : true
      FEATURE       : mfeat
      LAMBDA        : 0.1
      TEMPERATURE   : 0.1
      EMA           : 0.999
      PIXELS        : 4096
      WARMUP_EP     : 5
      CROSS_VIEW    : false      # [C1+C3 변형] 보조 branch 제거 — prototype은 주 forward aux로만
      CROSS_VIEW_W  : 1.0

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : DELIVER
  ROOT          : '/home/jovyan/SSDb/jemo_maeng/dset/DELIVER'   # bengio DELIVER path (2026-09-07 실측: /SSDe에만 존재)
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # DGFusion 공정선: PhysAug OFF + SSD photometric (ColorAugSSD, ISSUE-026 픽스본)
  DGFUSION_AUG  : true
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  LORA_NORM_CAP : 20.0
  SEED          : 20260903   # [시드3] B0 시드3 기준선은 두지 않는다 — 시드1 B0 와 독립 비교로만 쓰고 시드 표준편차 0.76 을 감안해 해석한다
  IMAGE_SIZE    : [768, 768]      # /16 -> 48x48 tokens
  BATCH_SIZE    : 1                 # BS1 (B0와 동일). E2 는 LoRA 파라미터가 늘어 activation
                                    # 이 아니라 optimizer state/grad 쪽이 커진다 — 기동 전
                                    # `P46_MEM_LOG=1` 로 ep5->ep6 계단을 실측할 것.
  EPOCHS        : 40   # [스크린] 40ep 조기 판정. 확정은 200ep 3페어
  EVAL_START    : 0
  EVAL_INTERVAL : 5
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false      # 🔴 ISSUE-027 봉인(멀티모달에서 강제 off) — 새 래퍼도 동일 가드

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 1
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/home/jovyan/SSDb/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [768, 768]
  OVERLAY       : false
