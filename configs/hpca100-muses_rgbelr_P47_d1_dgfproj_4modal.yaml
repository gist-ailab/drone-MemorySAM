# ═══ P47-MUB D-1 × MUSES 4모달(+radar) — hpca100 A100×4 — LiDAR 투영 밀도화 ═══
# base = hpca100-muses_rgbelr_P39_1_rank_4modal_seed2.yaml (4모달 seed2, val 82.35 완주, hpca100) 그대로.
# 🔴 변경은 단 1개: DATASET.PROJ_DIR: 'projected_to_rgb_dgf' (SDK 기본 (2,2)→DGFusion (7,7)+motion-comp,
#   유효 lidar/event/radar 픽셀 6.7%→32.6%=4.99×) + 전용 SAVE_DIR. 나머지는 seed2와 1-변수 비교를 위해 동일.
# 근거: .claude_logs/decisions/2026-08-03-p47-mub-muses-proposal.md §3 D-1.
# 🔴 전장 재정의(user 2026-08-03): 메인 전장=4모달. 3모달 seed2(val 82.62/test 79.788)는 대조군.
#   게이트: 4모달 val ≥82.62(3모달 역전) = Primary. drop-lidar day dMIoU ≥6 = D-1 falsifiable.
#   torchrun --nproc_per_node=4 train_reliadino.py --cfg <this>   (hpca100 A100 0,1,2,3)
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/hpca100_muses_P47_d1_dgfproj_4modal'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2]
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:        { ENABLE: false }
  CLASS_TOKEN: { ENABLE: false }

  M2F:
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0
    W_CLS           : 2.0
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5
    SRC             : modal
    ANCHORED        : true
    POINT_QUOTA     : 256

  P39:
    TRUNK_EXP       : true                  # ✅ ablation 검증: +2~7 기여 (2026-07-27 seed2 분석)
    ARBITER         : true
    PATH_DROPOUT_P  : 0.25
    ROUTER_CE_W     : 0.4
    TRUNK_MODE      : gated_mlp
    TRUNK_HIDDEN    : 256
    VICREG:                                 # ✅ ablation 검증: lidar eff-rank 78~100 (VICReg on)
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25                         # img/event/radar 공통

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20


DATASET:
  NAME          : MUSES
  ROOT          : '/home/jovyan/SSDb/jemo_maeng/dset/MUSES'   # hpca100 경로
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'event', 'radar']   # 🔴 4모달 (radar 포함)
  PROJ_DIR      : 'projected_to_rgb_dgf'   # 🔴 P47-MUB D-1: DGFusion 밀도화 투영((7,7)+motion-comp, 32.6%=4.99×)
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  PHYSAUG:
    ENABLE    : true                        # seed2와 동일 레시피
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1                 # seed2와 동일(1-변수 비교 유지). accum=ceil(16/(BS×world=4))=4 → eff-batch 16.
  EPOCHS        : 300
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 15
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : true
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/home/jovyan/SSDb/jemo_maeng/dset/MUSES'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
