# ═══ DIAGNOSTIC B: RADAR ADDITION (4-modal, ORIGINAL projection) ═══
# Purpose: the 8-GPU run muses_rgbelr_P34_dgf_4modal FAILED (ep2 50.43 -> ep30
# 21.76, stuck ~22 at 2x WARMUP). It changed THREE variables at once vs the B200
# 3-modal + original-projection control (ep2 55.82 / ep4 62.13 / ep6 70.98 /
# ep8 72.05 / ep10 74.24): (1) radar added, (2) lidar re-projected (motion_comp
# ON, dilation (2,2)->(7,7), coverage ~5x), (3) event dilation (2,2)->(3,3).
# This arm holds the P34 recipe fixed and moves ONE of them.
#
#   Isolates: radar. The projection reverts to the original folder that produced
#             the 78.979 benchmark, so lidar/event data are the control's exactly;
#             the only delta vs the B200 control is the 4th modality (+ the radar
#             loader path: _open_radar, RADAR_RANGE_MAX=150). Radar PNGs are
#             bit-identical between the two folders, so PROJ_SUBDIR does not
#             change radar itself.
#   vs failed run: projection reverted DGF -> original. Radar stays IN.
#
# Effective batch is PRESERVED at 16: train_reliadino.py sets
# accum = ceil(16 / (BATCH_SIZE * world_size)) = ceil(16/(2*4)) = 2,
# so 4 GPU x BS2 x accum 2 = 16 -- same as the failed run (8x2x1) and the
# B200 control (4x4x1). Verify via the [BATCH] line in the launch log.
#
# Everything else (P34 recipe / LR 0.0006 / WARMUP 15 / EPOCHS 300 /
# IMAGE_SIZE 1024 / GRADIENT_CHECKPOINT true / BATCH_SIZE 2) is byte-identical
# to the failed run's config. Judgement is made at ep10-16; EPOCHS stays 300.
#
# Launch (bengio, 4,5,6,7):
#   export PYTHONPATH=/SSDb/jemo_maeng/pylibs_p34:$PYTHONPATH
#   CUDA_VISIBLE_DEVICES=4,5,6,7 torchrun --standalone --nproc_per_node=4 \
#     --master_port=29692 train_reliadino.py --cfg <this>
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/bengio_muses_P34_diagB_radar_origproj'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:
      ENABLE       : true
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : true
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : true
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : true
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : true
    LAMBDA : 0.1

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img']          # P34 used ['img','depth']; MUSES has no depth
    WARMUP_EP : 20

DATASET:
  NAME          : MUSES
  ROOT          : '/ailab_mat2/dataset/MUSES'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'event', 'radar']
  # DGFusion-aligned re-projection (motion_comp ON, DGFusion dilations).
  # Omit this key to get the original 'projected_to_rgb' (the 78.979 baseline).
  PROJ_SUBDIR   : 'projected_to_rgb'
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # PhysAug: kept ON exactly as in the P34 recipe.
  PHYSAUG:
    ENABLE    : true
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  # MUSES frames are 1080x1920; semseg/datasets/muses.py letterboxes them to a
  # square (label pad = ignore) so this stays an exact 64x64 token grid.
  BATCH_SIZE    : 2               # RTX 3090 24GB. Measured 4-modal + grad-ckpt:
                                  # 11.99GB alloc / 15.50GB reserved. BS3 hit 96% on
                                  # a 5-GPU DDP run; BS4 OOMs. With 8 GPUs this also
                                  # lands accum=1 and eff batch exactly 16 (see above).
  # EPOCHS=300 is carried over from the 78.979 config unchanged (the point of this
  #   run is that the recipe is held fixed while the data is corrected).
  #   Rationale there: MUSES train is 1500 imgs vs DELIVER ~3983, so 200 ep (the
  #   DELIVER P34 number) = 300k samples vs DELIVER's 796k; 300 ep (450k) buys more
  #   exposure. Overfitting is not a risk to the deliverable: the trainer keeps
  #   top-5 checkpoints by val mIoU.
  # Timing here is NOT the B200's 87 s/epoch — bengio is 8x RTX 3090 with grad
  #   checkpointing and a 4th modality. Budget ~10 min/epoch => 300 ep ~ 2 days.
  #   bengio has no hand-back deadline. Actual s/epoch is recorded at launch.
  EPOCHS        : 300
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : true      # MANDATORY on 24GB: without it even BS2 OOMs.

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 15              # keeps the P34 warmup ratio (10/200 = 5%) at 300 ep
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1               # 4 on B200; dropped for the 3090's 24GB. Eval is
                                  # no-grad and val is only 250 imgs over 8 GPUs
                                  # (~32 each), so this costs little wall time.
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : true
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/ailab_mat2/dataset/MUSES'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
