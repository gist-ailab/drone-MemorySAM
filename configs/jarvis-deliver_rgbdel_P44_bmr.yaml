# ═══ P44-BMR (Balanced Modality Rebalance) × DELIVER 4모달 (hpca100) ═══
# 설계: decisions/2026-07-24-p43-p45-cvpr-sota-proposal.md §3 (+§7-b coverage-aware).
# MUSES판(jarvis-muses_rgbel_P44_bmr.yaml)과 **동일 아키텍처**(제약: 단일 모델) —
#   데이터셋/경로/해상도/BS만 다르다. DELIVER에서는 event가 dead(키5, 4세대 일관)이고
#   병목이 도메인축이 아니라 **thin-class 축**(Wall/Water/Other/Bridge)이라, P44의 목표는
#   "MUSES fog 회복"이 아니라 **thin-class 무퇴행 + 비RGB 사용률 상승**이다.
# 베이스 레시피 = hpca100-deliver_rgbdel_P39_1_rank.yaml (P39.1, DGFusion 공정선:
#   PHYSAUG off + DGFUSION_AUG on, GATE/CALIB off, ROUTER on, M2F on).
# 게이트(사전등록): ep30 ① dMIoU(lidar) 상승 ② p44/cos_lora_lidar 음수→양수
#   ③ CKA(img,lidar) 유지 / 완주 P36 fair(val 67.74/test 55.62) + thin-class
#   (Wall≥13 / Water≥9.5 / RailTrack≥62). 미달 시 kill.
# 🔴 GRADIENT_CHECKPOINT: false (encoder active_modality 버그).
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py --cfg <this>
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/jarvis_deliver_rgbdel_P44_bmr'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5            # per-modal deep-sup = B-1의 "unimodal" 목표
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false
    LAMBDA : 0.1

  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:        { ENABLE: false }
  CLASS_TOKEN: { ENABLE: false }

  M2F:
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0
    W_CLS           : 2.0
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5
    SRC             : modal
    ANCHORED        : true
    POINT_QUOTA     : 256

  P39:
    TRUNK_EXP       : true
    ARBITER         : true
    PATH_DROPOUT_P  : 0.25
    ROUTER_CE_W     : 0.4
    TRUNK_MODE      : gated_mlp
    TRUNK_HIDDEN    : 256
    VICREG:
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  # ── [P44-BMR] 신규 변수 (MUSES판과 동일 값 — 단일 아키텍처 제약) ────────
  P44:
    MMPARETO:                      # B-1 (주 변수)
      ENABLE    : true
      INTERVAL  : 1
      MAGNITUDE : sum_norm
    MUTUAL_KL:                     # B-2
      ENABLE      : true
      WEIGHT      : 0.5
      TEMPERATURE : 1.0
      WARMUP_EP   : 10
    REL_CORR:
      ENABLE    : true
      WEIGHT    : 0.1
      PAIRS     : 2048
      MODE      : mse
      WARMUP_EP : 10
    LOCAL_MASK:                    # B-3 — DELIVER lidar도 sparse 투영이라 coverage 유효.
      ENABLE      : true           #   리턴이 없는 샘플은 rect로 자동 폴백된다.
      MODE        : coverage
      FRAC        : 0.5
      WARMUP_EP   : 20
      AREA_RATIO  : [0.1, 0.5]
      NUM_REGIONS : [1, 3]
      COVERAGE_DILATE : 31
      BLOB_GRID   : 16
      BLOB_P      : 0.5
    HARD_PIXEL_AUX:
      ENABLE : false
      WEIGHT : 0.5
    VALIDITY_RENORM:               # V-1 기본 on (07-25 검증: 커버리지 밖 uniform 퇴화 실증)
      ENABLE : true
      DILATE : 1

  P45:
    FOGSTYLE:
      ENABLE       : false
      PROB         : 0.5
      SIGMA        : 0.5
      WEIGHT       : 0.1
      DETACH_CLEAN : true

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : DELIVER
  ROOT          : '/SSDb/jemo_maeng/dset/DELIVER'   # hpca100 staged copy
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  DGFUSION_AUG  : true              # DGFusion 공정선 (PhysAug off + SSD photometric)
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  LORA_NORM_CAP : 20.0            # b_q/b_v Frobenius cap (P35/T1 seam) — P39.1 레시피 보존
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 2               # ⚠️ B-1 on = backward 2회. A100 40GB에서 BS2 유지 가능
                                  #   하지만 첫 기동 시 메모리 실측 후 필요하면 1로 내릴 것.
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 2
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [768, 768]
  OVERLAY       : false
