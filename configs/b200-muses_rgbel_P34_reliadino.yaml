# ═══ MUSES × P34-ReliaDINO — first MUSES baseline on the ReliaDINO lineage ═══
# Base = configs/b200-deliver_rgbdel_P34_reliadino.yaml (current best seg model:
# DELIVER Test 57.60@ep140 / Val 68.19@ep120) with ONLY the dataset swapped.
# Model block is byte-for-byte the P34 recipe so the DELIVER→MUSES transfer is
# the single variable.
#
# Deltas vs P34/DELIVER:
#   - DATASET.NAME  DELIVER -> MUSES   (semseg/datasets/muses.py)
#   - MODALS  [img,depth,event,lidar] -> [img,lidar,event]:  MUSES HAS NO DEPTH.
#     (a 'radar' modality also exists in projected_to_rgb/ if ever wanted)
#   - classes 25 -> 19 (Cityscapes trainIds; taken from trainset.n_classes, not set here)
#   - test split has NO public GT -> MUSES('test') raises, train_reliadino.py
#     catches it and sets testset=None. val (250 imgs) is the only eval stage.
#   - EPOCHS 200 -> 300, WARMUP 10 -> 15: sized from a measured 87 s/epoch against
#     the 20:00 KST 07-15 hand-back deadline. See the EPOCHS note in TRAIN below.
#
# Launch (GPU 0,1,6,7 — 2..5 are P36-router, do not touch):
#   export PYTHONPATH=/NHNHOME/ailab/Workspaces/jemo_maeng/pylibs_p34:$PYTHONPATH
#   torchrun --standalone --nproc_per_node=4 train_reliadino.py --cfg <this>
# PYTHONPATH is MANDATORY: dinov3 lives in timm 1.0.24 there; the MMSS_SAM env's
# timm 0.4.12 has no dinov3 and the run dies with
# "could not build backbone 'vit_large_patch16_dinov3'".
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/b200_muses_rgbel_P34_reliadino'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:
      ENABLE       : true
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : true
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : true
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : true
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : true
    LAMBDA : 0.1

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img']          # P34 used ['img','depth']; MUSES has no depth
    WARMUP_EP : 20

DATASET:
  NAME          : MUSES
  ROOT          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/MUSES'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'event']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # PhysAug: kept ON exactly as in the P34 recipe.
  PHYSAUG:
    ENABLE    : true
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  # MUSES frames are 1080x1920; semseg/datasets/muses.py letterboxes them to a
  # square (label pad = ignore) so this stays an exact 64x64 token grid.
  BATCH_SIZE    : 4               # ~55GB/GPU measured on B200 (183GB) — headroom kept
                                  # because GPU 0/1 also host another tenant's 14GB job.
  # EPOCHS=300, set by measurement, not by habit:
  #   measured on GPU 0,1,6,7 = 87 s/epoch (93 it/ep @1.2 it/s + amortised val every
  #   2nd ep; from the timing probe's [Val] stamps ep2 15:44:02 -> ep4 15:46:56).
  #   300 ep x 87 s = 7.3 h. Launch ~01:00 KST 07-15 -> ends ~08:20 KST, i.e. ~11.6 h
  #   before the 20:00 KST hand-back and ~15.6 h before the 23:59 KST B200 cutoff,
  #   leaving room for the NAS rsync and for slowdown on this shared box.
  # Why not 200 (the DELIVER P34 number): MUSES train is 1500 imgs vs DELIVER ~3983,
  #   so 200 ep here = 300k samples vs DELIVER's 796k. 300 ep (450k) buys more
  #   exposure and still fits with a wide margin. Overfitting is not a risk to the
  #   deliverable: the trainer keeps top-5 checkpoints by val mIoU, so late
  #   overfitting cannot cost us the best model. (Probe already hit val 62.22 @ ep4.)
  EPOCHS        : 300
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 15              # keeps the P34 warmup ratio (10/200 = 5%) at 300 ep
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 4
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : true
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/MUSES'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
