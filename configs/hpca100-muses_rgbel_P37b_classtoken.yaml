# ═══ P37b-ClassToken × MUSES 3모달 — ClassToken-lite-Learned를 MUSES(img/lidar/event)에 적용 ═══
# MODEL 블록 = hpca100-muses_rgbel_P37a_cefr.yaml에서 CEFR-Head → CLASS_TOKEN 교체만.
#   (P37a CEFR와의 유일한 차이 = 헤드; GATE/VETO/CALIB/ROUTER/공정레시피/증강 전부 동일 →
#    P37a-CEFR vs P37b-ClassToken의 깨끗한 head-only ablation.)
# CLASS_TOKEN(P37b, semseg/models/reliadino/classtoken.py):
#   25 LEARNED class tokens (고정 할당 token k ↔ class k, Hungarian 없음, CLIP/text init 없음)
#   → gated fused stride-16 map 위 3-layer masked cross-attn (Mask2Former-lite)
#   → mask-embedding · FPN stride-4 feat dot = token_logits.
#   final = conv_head_logits + β·token_logits + router_alpha·up(routed), β zero-init
#   → 시작 시 P36과 byte-identical (collapse-safe). Aux = CE on token_logits @1/4 (weight AUX_CE_W).
#   Monitor: p37/ctl_beta, train/ctd_ce.
# DATASET/TRAIN/EVAL = P37a-MUSES와 동일. MODALS 3모달 [img,lidar,event] (radar val −0.09 무익, 2026-07-17).
#   MUSES 최선 = 3모달 공식 val 80.86. ClassToken head가 이 위에서 개선하는지 검증.
# 🔴 GRADIENT_CHECKPOINT: false 유지(encoder active_modality 버그 회피).
#   torchrun --nproc_per_node=<N> train_reliadino.py --cfg <this>
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/hpca100_muses_rgbel_P37b_classtoken'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    # 공정 레시피 (P36/G0c 동결): attention bias OFF
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  # 공정 레시피: consistency 항 OFF
  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : true
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : true
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : true
    LAMBDA : 0.1

  # [P36] per-class router 유지 — ClassToken은 그 위에 얹힘 (두 residual 공존:
  # β·token_logits + alpha·routed).
  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  # [P37b] ClassToken-lite-Learned (semseg/models/reliadino/classtoken.py)
  CLASS_TOKEN:
    ENABLE     : true
    NUM_LAYERS : 3
    DIM        : 256                        # token dim_t (Linear(dim→256) on the map)
    NUM_HEADS  : 8
    MLP_RATIO  : 2.0                        # lite FFN (params ≈2.9M @ ViT-L)
    AUX_CE_W   : 0.4                        # trainer weight on aux 'ctd_ce'
    BETA_INIT  : 0.0                        # zero-init residual scale (do not change)

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20


DATASET:
  NAME          : MUSES
  ROOT          : '/home/jovyan/SSDb/jemo_maeng/dset/MUSES'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'event']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # PhysAug: P37a-MUSES와 동일하게 ON 유지 (head-only ablation 위해 증강 고정).
  PHYSAUG:
    ENABLE    : true
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  # MUSES frames 1080x1920 → muses.py letterbox to square (label pad=ignore) = 64x64 token grid.
  BATCH_SIZE    : 2
  # EPOCHS=300 = P37a-MUSES와 동일 (head-only 비교). top-5 ckpt by val mIoU 유지.
  EPOCHS        : 300
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 15
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 4
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : true
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/home/jovyan/SSDb/jemo_maeng/dset/MUSES'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
