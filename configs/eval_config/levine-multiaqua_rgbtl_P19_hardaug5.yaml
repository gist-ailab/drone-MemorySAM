DEVICE          : cuda
SAVE_DIR        : './outputs/MMSamP19/levine_multiaqua_rgbtl_P19_hardaug5'

MODEL:
  NAME          : CMNeXt
  BACKBONE      : CMNeXt-B2
  PRETRAINED    : '/hpc2hdd/home/cliao127/MMSS-SAM-S1/sam/checkpoints/pretrained/segformer/mit_b2.pth'
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  LORA_MODEL    : LoRA_Sam_P19
  LORA_R        : 4
  LORA_NUM_EXPERTS : null
  LORA_TOP_K    : None
  LORA_LAYER    : null

DATASET:
  NAME          : MULTIAQUA
  ROOT          : '/ailab_mat2/personal/jemo_maeng/dset/Drone/MULTIAQUA_night'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'thermal']

  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_AUG     :
    ENABLE      : true
    NIGHT_SIM_P : 0.60
    BRIGHTNESS_RANGE : [0.02, 0.20]
    BRIGHTNESS_SAMPLING : dark_biased
    DARK_BIASED_RATIO  : 0.70
    DARK_RANGE    : [0.02, 0.06]
    MODERATE_RANGE: [0.06, 0.20]
    CONTRAST_RANGE   : [0.20, 0.65]
    GAMMA_RANGE     : [0.30, 0.75]
    NOISE_STD       : 0.025

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 1
  AMP           : false
  DDP           : True

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EVAL_DAY      : false                                   # true면 test 시 RGB 서브루트를 zed_day로 사용

  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

TEST:
  MODEL_PATH    : ''
  FILE          : '/ailab_mat2/personal/jemo_maeng/dset/Drone/MULTIAQUA_night'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
