DEVICE          : cuda
SAVE_DIR        : './outputs/MMSamP23/levine_multiaqua_rgbtl_P23_hardaug8_physaug'

MODEL:
  NAME          : CMNeXt
  BACKBONE      : CMNeXt-B2
  PRETRAINED    : '/hpc2hdd/home/cliao127/MMSS-SAM-S1/sam/checkpoints/pretrained/segformer/mit_b2.pth'
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  LORA_MODEL    : LoRA_Sam_P23
  LORA_R        : 4
  LORA_NUM_EXPERTS : 2
  LORA_TOP_K    : None
  LORA_LAYER    : null
  # [P23] MoE DeBA-BB: deformable bottleneck adapter as MoE expert in backbone
  # Ref: DeBA (CVPR 2026) + ConvLoRA (ICLR 2024)
  # GAP gating (per-image), multi-scale experts (×1, ×2), cross-layer weight sharing
  DEBA:
    BOTTLENECK_DIM : 64
    KERNEL_SIZE    : 3
    SCALES         : [0.5, 1, 2, 4]
    GATE_NOISE_STD : 0.1

DATASET:
  NAME          : MULTIAQUA
  ROOT          : '/home/jovyan/SSDc/jemo_maeng/dset/MULTIAQUA_night2'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'thermal']

  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : 'lidar_processed2'
  NIGHT_AUG     :
    ENABLE      : true
    NIGHT_SIM_P : 0.45
    BRIGHTNESS_RANGE : [0.03, 0.45]
    BRIGHTNESS_SAMPLING : dark_biased
    DARK_BIASED_RATIO  : 0.6
    DARK_RANGE    : [0.03, 0.12]
    MODERATE_RANGE: [0.12, 0.45]
    CONTRAST_RANGE   : [0.3, 0.7]
    GAMMA_RANGE     : [0.4, 0.8]
    NOISE_STD       : 0.02
    SHOT_NOISE_GAIN_RANGE : [20, 80]
    CRM_P       : 0.20
    CRM_MASK_RATIO  : [0.2, 0.5]
    ZERO_P      : 0.09
    PHYSAUG:
      ENABLE    : true
      P         : 0.40
      FILTER:
        ENABLE      : true
        SIGMA_RANGE : [0.0, 1.5]
        KERNEL_SIZE : 3
      FOURIER:
        ENABLE      : true
        GROUPS      : [1, 513]
        PHASES      : [0.0, 1.0]
        GRANULARITY : 256
        MEAN_STR    : 8.0
        DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 2
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 1
  AMP           : false
  DDP           : True

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EVAL_DAY      : false

  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

TEST:
  MODEL_PATH    : ''
  FILE          : '/home/jovyan/SSDc/jemo_maeng/dset/MULTIAQUA_night2'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
