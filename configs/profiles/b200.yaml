# configs/profiles/b200.yaml — 서버별 경로 참조 문서 (B200)
# ⚠️ 참조 문서일 뿐, 학습 config에 자동 머지되지 않는다 (자동 머지 = 후속 과제).
# 출처: scripts/servers.conf + 기존 b200-* config 관행

server:
  alias: B200              # ssh port 39701 + key ~/.ssh/b200_new_key
  gpus_default: null       # SHARED 8-GPU B200 180GB box — 반드시 status 확인 후 auto:N 또는 명시 지정
  notes: |
    공유 서버 (타 유저 gm_huis 상시 사용). remote_exp.sh의 auto:N 사용 권장.
    system python에 timm 없음 → conda env MMSS_SAM의 torchrun으로 실행.
    wandb+tensorboard 동시 사용 시 PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python.

repo_path: /NHNHOME/ailab/Workspaces/jemo_maeng/src/drone-MemorySAM
conda_env: MMSS_SAM

data_roots:
  DELIVER: /NHNHOME/ailab/Workspaces/jemo_maeng/dset/DELIVER
  MULTIAQUA_night2: /NHNHOME/ailab/Workspaces/jemo_maeng/dset/MULTIAQUA_night2

pretrained:
  segformer_mit_b2: /hpc2hdd/home/cliao127/MMSS-SAM-S1/sam/checkpoints/pretrained/segformer/mit_b2.pth  # 레거시 절대경로 관행
  sam2_hiera_base_plus: semseg/models/sam2/sam2/checkpoints/sam2.1_hiera_base_plus.pt
