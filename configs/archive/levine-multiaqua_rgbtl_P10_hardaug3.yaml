DEVICE          : cuda              # device used for training and evaluation (cpu, cuda, cuda0, cuda1, ...)
SAVE_DIR        : './outputs/MMSamP10/levine_multiaqua_rgbtl_P10_hardaug4'

MODEL:
  NAME          : CMNeXt
  BACKBONE      : CMNeXt-B2
  PRETRAINED    : '/hpc2hdd/home/cliao127/MMSS-SAM-S1/sam/checkpoints/pretrained/segformer/mit_b2.pth'
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  LORA_MODEL    : LoRA_Sam_P10                                      # P10: Quality-Aware Adaptive Gating
  LORA_R        : 4
  LORA_NUM_EXPERTS : null                                           # null = auto (num_modalities)
  LORA_TOP_K    : None
  LORA_LAYER    : null
  LORA_NUM_CLASSES : 4                                              # P10: aux head 출력 클래스 수 (MULTIAQUA=4)

DATASET:
  NAME          : MULTIAQUA
  ROOT          : '/ailab_mat2/personal/jemo_maeng/dset/Drone/MULTIAQUA_night'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'thermal']
  # hardaug4: P9와 동일한 augmentation 유지 (변수 통제)

  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_AUG     :
    ENABLE      : true
    NIGHT_SIM_P : 0.4        # 과도한 야간 비율 완화
    BRIGHTNESS_RANGE : [0.020, 0.203]  # lj4 p5~p95+ (분석 결과)
    BRIGHTNESS_SAMPLING : dark_biased  # uniform | log_uniform | dark_biased
    DARK_BIASED_RATIO  : 0.35          # 35% 극저조도, 65% moderate (실제 분포 정렬)
    DARK_RANGE    : [0.020, 0.035]     # 극심한 저조도 (lj4 p5~p25)
    MODERATE_RANGE: [0.034, 0.173]     # moderate (lj4 p25~p95, 달빛·가로등·수면 반사)
    CONTRAST_RANGE   : [0.35, 0.72]
    GAMMA_RANGE     : [0.42, 0.82]
    NOISE_STD       : 0.02
    CRM_P       : 0.25       # CRM 완화 (0.3→0.25)
    CRM_MASK_RATIO  : [0.15, 0.45]
    ZERO_P      : 0.06   

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 1
  AMP           : false
  DDP           : True
  LAMBDA_GATE   : 0.5             # [P10] Gating aux loss 가중치 (total = seg + proto + 0.5 * gate)

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1


EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EVAL_DAY      : false                                   # true면 test 시 RGB 서브루트를 zed_day로 사용

  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]


TEST:
  MODEL_PATH    : ''
  FILE          : '/ailab_mat2/personal/jemo_maeng/dset/Drone/MULTIAQUA_night'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
