# [MCubeS 논문 모델 C2D2 2026-10-31, method] 원본 = lecun-mcubes_rgbadn_P39_1_rank_E1Mc_seed20260828_A2hires_768.yaml (E1Mc + 고해상 경로). 추가 = TRAIN.QAF(두 패스 + 동결 E1Mc 교사 증류 = DELIVER A2 와 같은 레시피)·SAVE_DIR.
#   user 결정 2026-10-31: MCubeS 는 논문 모델(C2D2 포함) 런을 새로 돌리고, 기존 E1Mc+고해상(C2D2 없음) 런은 'w/o C2D2' 비교 행으로 이어 학습한다.
#   열화 연산자: MCubeS 모달 이름(image/aolp/dolp/nir) 매핑을 semseg/datasets/degrade.py TRAIN_OPS 에 추가(image·nir = 광학 열화, aolp·dolp = 패치 드롭·블러만).
#   🔴 기동 전 TEACHER_CKPT 파일 존재 + 로그 '[QAF-T] teacher cfg 바탕 = TEACHER_CFG …' + 'missing=0 unexpected=0' 확인. trainable 파라미터는 A2hires 와 동일해야 정상(교사는 학습 파라미터 아님).
# [lecun 파생 2026-10-28, monitoring 세션] s827 짝과 동일 사유(SEED만 다름) — ROOT/FILE/SAVE_DIR /SSDe→/SSDb만 변경.
# [24GB 변형 2026-10-27, 요청 = method 세션 "MMSAM | 생각정리"] 24GB 카드(3090/4090) OOM 회피를 위해 학습 크롭만 1024→768로 낮춘다. 평가는 1024 원안 그대로 불변이며 DATASET.TRAIN_CROP/TRAIN_BASE 키로만 제어된다(develop 1a6e17b 로더 패치 기반). 그 외 SAVE_DIR 접미사(_768) 말고는 원본과 동일.
# [A2 이식 2026-10-21, yeon 파생] 원본 = configs/hpca100-mcubes_rgbadn_P39_1_rank_E1Mc_seed20260828_A2hires.yaml 와 동일(DRN-261017-02).
#   바꾼 것은 경로뿐(DEVICE/SAVE_DIR/DATASET.ROOT/TEST.FILE을 yeon 기준으로) — MODEL.HIRES_ADAPTER 블록 포함 모든 키는 원본과 동일.
#   목적: DELIVER A2(4탭 + 고해상 경로) 의 이득이 MCubeS 에서도 나는가(단일 아키텍처 원칙). 짝 = yeon-mcubes_rgbadn_P39_1_rank_E1Mc_seed20260828.yaml(같은 시드 기존 런).
# [E1Mc_seed20260828] E1(중간층 4탭 읽기 단독)의 MCubeS 이식, 200ep, 시드 20260828, yeon.
#   원본 = hpca100-mcubes_rgbadn_P39_1_rank_c3on.yaml에서 C3_PROTO off(= 통일 레시피 C3-off) + MODEL.TAPS on + SEED·SAVE_DIR·경로.
#   매칭 기준선 = 통일 레시피 C3-off 3시드 {3407: 57.93, 20260827: 57.67, 20260828: 58.62} = 58.07±0.49 → 단일 변수(TAPS) 페어.
#   게이트(사전 등록): 2시드 평균 Δ vs E1Mc 같은 시드 ≥ +0.5(DRN-261017-02).
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/lecun_mcubes_rgbadn_P39_1_rank_E1Mc_seed20260828_A2c2d2_768'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  TAPS:
    ENABLE  : true                          # [E1] 블록 6/12/18/24 다중 레벨 탭(센서별 투영)
    LAYERS  : [6, 12, 18, 24]
    MODE    : per_modal
  # ═══ [A2 이식] 고해상 경로(HiRes Adapter) — hires_adapter.py, DELIVER A2 와 같은 설정 ═══
  HIRES_ADAPTER:
    ENABLE           : true
    DIM              : 512
    STEM_DIM         : 64
    MODE             : shared_stem
    N_HEADS          : 8
    N_POINTS         : 4
    DEFORM_RATIO     : 0.5
    CFFN_RATIO       : 0.25
    EXTRA_EXTRACTORS : 2
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2] fog_night 유해 실증(07-20) — off, ablation 분리
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  # [P36] per-class router 유지 (P38-DELIVER와 동일 — M2F 대비 1-변수 비교)
  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:        { ENABLE: false }   # P37a 헤드 off
  CLASS_TOKEN: { ENABLE: false }   # P37b 헤드 off

  # [P38] MaskQueryLite (Mask2Former-lite) — 헤드
  M2F:
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256                   # query dim_t (params ≈5.5M)
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0                   # zero-init residual (do not change)
    W_CLS           : 2.0                   # M2F 표준 가중 2/5/5
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544                 # point-sampled mask losses (M2F 관행)
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5                   # aux['m2f_loss'] 전역 스케일
    SRC             : modal                 # [P39-V2] query가 per-modal 토큰 합집합을 attend (fused rank-병목 우회)
    ANCHORED        : true                  # [P39-V3] K개 클래스 앵커 query (고정 할당) + 나머지 Hungarian
    POINT_QUOTA     : 256                   # [P39-V4] GT 영역별 최소 포인트 쿼터 (thin-mask 기아 수정)


  # [P39] Dual-Path Compete (decisions/2026-07-20-p39-dual-path-compete-proposal.md)
  P39:
    TRUNK_EXP       : true                  # V1: fused += Σ P_m(f_m) (rank 확장, 주 경로)
    ARBITER         : true                  # V5: per-class Λ 중재 + path dropout 경쟁 (β 잔차 대체)
    PATH_DROPOUT_P  : 0.25                  # dense-only / query-only 각 25%
    ROUTER_CE_W     : 0.4                   # router 직접 CE 감독 가중
    TRUNK_MODE      : gated_mlp             # [P39.1-R1] 선형→LN·MLP·tanh(γ) 게이트 (저rank 지름길 제거, γ=0.1 init — 0이면 gradient가 안 흘러 사장됨)
    TRUNK_HIDDEN    : 256
    VICREG:                                 # [P39.1-R2] var+cov rank 복원 (per-modal 토큰, lidar 강조)
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  # ═══ [N4b] class-transfer recovery — C3만 on (DELIVER C3-only λ0.1과 동일 세팅) ═══
  P46:
    C1_RCS:
      ENABLE        : false
      MODE          : daformer
      TEMP          : 0.01
      MIN_PIXELS    : 1
      LOSS_BLEND_W  : 1.0
      EMA_M         : 0.99
      EMA_INTERVAL  : 1
      REFRESH       : 32
      SEED          : 0
      CACHE_DIR     : ''
    C2_MCC:
      ENABLE        : false
      MASK_RATIO    : 0.5
      PATCH         : 64
      MODALS        : all
      LAMBDA        : 1.0
      CONF_THRESH   : 0.75
      LOSS          : ce
      EMA_ALPHA     : 0.999
      WARMUP_EP     : 5
    C3_PROTO:
      ENABLE        : false      # [E1-MCubeS] C3 off = 기준선(통일 레시피 C3-off)과 같음, 차이는 TAPS 하나
      FEATURE       : mfeat
      LAMBDA        : 0.1
      TEMPERATURE   : 0.1
      EMA           : 0.999
      PIXELS        : 4096
      WARMUP_EP     : 5
      CROSS_VIEW    : false
      CROSS_VIEW_W  : 1.0

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20


DATASET:
  NAME          : MCubeS
  ROOT          : '/SSDb/jemo_maeng/dset/MCubeS/multimodal_dataset'
  IGNORE_LABEL  : 255
  MODALS        : ['image', 'aolp', 'dolp', 'nir']   # MCubeS 내부 dict 키와 정확히 일치해야 함
  TRAIN_CROP    : 768                # [24GB 변형] 학습 전용 크롭(평가 경로 불변) — develop 1a6e17b
  TRAIN_BASE    : 768                # [24GB 변형] 학습 전용 기준 해상도
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  PHYSAUG:
    ENABLE    : false   # MCubeS 로더는 transform 인자를 쓰지 않으므로 이 블록 전체가 inert

TRAIN:
  SEED          : 20260828
  IMAGE_SIZE    : [1024, 1024]      # 실제로는 MCubeS 로더가 자체 1024 crop을 강제(위 주석 참조) — 문서화 목적
  BATCH_SIZE    : 1                 # yeon 3090 24GB, MUSES@1024 실측(BS1~12GB) 기준 보수적 시작
                                    # accum=ceil(16/(BS×world))가 eff-batch 자동보정 → BS1×2×accum8=16
  EPOCHS        : 200                # [N4] DELIVER 대비 데이터 규모 작음(train 302장) 감안
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  SAVE_TOPK     : 1                 # [2026-09-15] val 상위 1개만 저장(디스크 만복 사고 2회). 학습 동작과 무관
  SAVE_TEST_CKPT: false             # test-best 체크포인트는 규약상 사용 금지라 저장하지 않음(test 평가·로그는 유지)
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

  # ═══ [C2D2] 두 패스 학습(clean CE + 열화 CE) + 동결 E1Mc 교사 증류 — DELIVER A2 와 같은 값, 커리큘럼은 200ep 에 맞춰 늘림 ═══
  QAF:
    ENABLE            : true
    DEGRADE_P         : 0.5
    MISSING_FRAC      : 0.2
    SEVERITY_SCHEDULE : [[0, 0.3], [50, 0.6], [100, 1.0]]   # DELIVER 40ep 의 [0/10/20] 을 200ep 비율로
    TEACHER_CFG       : 'configs/lecun-mcubes_rgbadn_P39_1_rank_E1Mc_seed20260828.yaml'   # 교사 = 같은 시드 E1Mc(clean 학습) 의 config — 교사 아키텍처를 학생이 아니라 교사 config 로 만든다(develop d101b11)
    TEACHER_CKPT      : '/SSDb/jemo_maeng/teacher/mcubes_E1Mc_s828_epoch174_58.61_top1_checkpoint.pth'   # 🔴 NAS ckpts/hpca100_mcubes_rgbadn_P39_1_rank_E1Mc_seed20260828_20260920/epoch174_58.61_top1_checkpoint.pth 를 이 경로에 복사(md5 확인) 후 기동. 파일 없으면 KD 0 으로 조용히 진행되므로 로그 [QAF-T] missing=0 확인 필수
    KD_W              : 0.5
    KD_T              : 2.0
    QUALITY_W         : 0.1
    IDENTITY_W        : 0.1
    CLEAN_PASS        : true
    SEED              : 0

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 15
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 4
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : true
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/MCubeS/multimodal_dataset'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
