# [A2 ablation L8 — router 제거, 2026-11-02] lab-plan DRN-261029-07(status idea, owner manager).
#   원본 = configs/yeon-deliver_rgbdel_P46_c3only_seed20260821_screen40_A2hires.yaml.
#   바꾼 키(한 변수만): MODEL.ROUTER.ENABLE true → false (router CE 0.4도 코드상 함께 꺼짐, TRAIN.P39.ROUTER_CE_W 값 자체는 안 건드림). 그 외 전부 동일.
#   목적: 최종 모델(A2)에서 router를 빼고 처음부터 재학습했을 때 조건별 적응(야간 −RGB 완화, depth 의존 이동)이
#   A2와 다른가 — router가 적응 장치인지 아니면 두 패스 학습·교차 attention이 주로 그 역할을 하는지 분리.
#   amphibious-demo(ailab@172.27.190.240, RTX5090 32GB) 파생 — 경로만 변경(DATASET.ROOT·TRAIN.QAF.TEACHER_CKPT·TEST.FILE).
#   venv: ~/workspace/jemo_maeng/venvs/dms (eurs 상속, torch 2.11 cu128). DELIVER 데이터셋 이미 있음(55,206 파일, lecun 원본과 일치 확인됨, 2026-10-29 셋업).
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/amphibious_deliver_rgbdel_P46_c3only_seed20260821_screen40_A2L8norouter'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  TAPS:
    ENABLE  : true
    LAYERS  : [6, 12, 18, 24]
    MODE    : per_modal

  DETAIL_BRANCH:
    ENABLE     : false

  BOUNDARY_REFINE:
    ENABLE     : false
    LEVELS     : [4]
    K_INIT     : 10.0
    GAMMA_INIT : 0.1

  QAF:
    ENABLE        : false
    MASK_MODALS   : ['depth', 'lidar']
    SELF_ATTN     : true
    KEY_MASK      : true
    WEIGHTED_MEAN : true
    HEAD_HIDDEN   : 256
    IDENTITY_W    : 0.1
    EPS           : 1.0e-4
    DETACH_MASK   : false
  HIRES_ADAPTER:
    ENABLE           : true
    DIM              : 512
    STEM_DIM         : 64
    MODE             : shared_stem
    N_HEADS          : 8
    N_POINTS         : 4
    DEFORM_RATIO     : 0.5
    CFFN_RATIO       : 0.25
    EXTRA_EXTRACTORS : 2
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false
    LAMBDA : 0.1

  ROUTER:                                   # [L8] 바뀐 변수 — true → false
    ENABLE        : false
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:
    ENABLE : false
  CLASS_TOKEN:
    ENABLE : false

  M2F:
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0
    W_CLS           : 2.0
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5
    SRC             : modal
    ANCHORED        : true
    POINT_QUOTA     : 256

  P39:
    TRUNK_EXP       : true
    ARBITER         : true
    PATH_DROPOUT_P  : 0.25
    ROUTER_CE_W     : 0.4
    TRUNK_MODE      : gated_mlp
    TRUNK_HIDDEN    : 256
    VICREG:
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  P46:
    C1_RCS:
      ENABLE        : false
      MODE          : daformer
      TEMP          : 0.01
      MIN_PIXELS    : 1
      LOSS_BLEND_W  : 1.0
      EMA_M         : 0.99
      EMA_INTERVAL  : 1
      REFRESH       : 32
      SEED          : 0
      CACHE_DIR     : ''
    C2_MCC:
      ENABLE        : false
      MASK_RATIO    : 0.5
      PATCH         : 64
      MODALS        : all
      LAMBDA        : 1.0
      CONF_THRESH   : 0.75
      LOSS          : ce
      EMA_ALPHA     : 0.999
      WARMUP_EP     : 5
    C3_PROTO:
      ENABLE        : true
      FEATURE       : mfeat
      LAMBDA        : 0.1
      TEMPERATURE   : 0.1
      EMA           : 0.999
      PIXELS        : 4096
      WARMUP_EP     : 5
      CROSS_VIEW    : false
      CROSS_VIEW_W  : 1.0

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : DELIVER
  ROOT          : '/home/ailab/workspace/jemo_maeng/dset/DELIVER'   # [amphibious-demo 파생]
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  DGFUSION_AUG  : true
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  LORA_NORM_CAP : 20.0
  SEED          : 20260821
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 1
  EPOCHS        : 40
  EVAL_START    : 0
  EVAL_INTERVAL : 5
  SAVE_TOPK     : 1
  SAVE_TEST_CKPT : false
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

  QAF:
    ENABLE            : true
    DEGRADE_P         : 0.5
    MISSING_FRAC      : 0.2
    SEVERITY_SCHEDULE : [[0, 0.3], [10, 0.6], [20, 1.0]]
    TEACHER_CKPT      : '/home/ailab/workspace/jemo_maeng/ckpts/drone-MemorySAM/teacher/E1_s1_epoch140.pth'   # [amphibious-demo 파생] md5 c648f925
    TEACHER_CFG       : configs/bengio-deliver_rgbdel_P46_c3only_seed20260821_screen40_E1.yaml  # [L8 패치, L1/L2/L4와 동일 사유] 학생 cfg는 ROUTER.ENABLE false라 교사를 학생 cfg로 구성하면 router 미생성 → 실제 체크포인트(router 포함)와 unexpected key 불일치. E1 config로 교사 구성(교사 아키텍처 오염 방지).
    KD_W              : 0.5
    KD_T              : 2.0
    QUALITY_W         : 0.1
    IDENTITY_W        : 0.1
    CLEAN_PASS        : true
    SEED              : 0

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 1
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/home/ailab/workspace/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [768, 768]
  OVERLAY       : false
