DEVICE          : cuda              # device used for training and evaluation (cpu, cuda, cuda0, cuda1, ...)
SAVE_DIR        : './outputs/MMSamP16/bengio_multiaqua_rgbtl_P16_hardaug5'

MODEL:
  NAME          : CMNeXt                                            # name of the model you are using
  BACKBONE      : CMNeXt-B2                                         # model variant
  PRETRAINED    : '/hpc2hdd/home/cliao127/MMSS-SAM-S1/sam/checkpoints/pretrained/segformer/mit_b2.pth'     # backbone model's weight
  RESUME_ENABLE : false                                             # enable resume training (true/false)
  RESUME_PATH   : ''                                                # checkpoint file path for resume (e.g., './outputs/.../last_checkpoint.pth')
  LORA_MODEL    : LoRA_Sam_P16                                      # [P16] Calibrated Spatial Entropy Fusion
  LORA_R        : 4                                                 # LoRA rank
  LORA_NUM_EXPERTS : null                                           # number of experts for MoE (null = auto from num_modalities)
  LORA_TOP_K    : None                                              # top_k for MoE routing
  LORA_LAYER    : null                                              # checkpoint file
  LORA_NUM_CLASSES : 4                                              # aux decoder용 클래스 수

DATASET:
  NAME          : MULTIAQUA                                        # dataset name
  ROOT          : '/ailab_mat2/personal/jemo_maeng/dset/Drone/MULTIAQUA_night'    # dataset root path
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'thermal']                      # rgb + thermal + lidar (rgbtl)
  # ──────────────────────────────────────────────────────────────────────────
  # hardaug5: CRM/ZeroOut 완전 제거 + test셋 실측 밝기 분포 정밀 정렬
  # ──────────────────────────────────────────────────────────────────────────
  NIGHT_AUG     :
    ENABLE      : true
    NIGHT_SIM_P : 0.60
    BRIGHTNESS_RANGE : [0.02, 0.20]
    BRIGHTNESS_SAMPLING : dark_biased
    DARK_BIASED_RATIO  : 0.70
    DARK_RANGE    : [0.02, 0.06]
    MODERATE_RANGE: [0.06, 0.20]
    CONTRAST_RANGE   : [0.20, 0.65]
    GAMMA_RANGE     : [0.30, 0.75]
    NOISE_STD       : 0.025

TRAIN:
  IMAGE_SIZE    : [1024, 1024]    # training image size in (h, w)
  BATCH_SIZE    : 1         # batch size used to train
  EPOCHS        : 200             # number of epochs to train
  EVAL_START    : 0             # evaluation interval start
  EVAL_INTERVAL : 1               # evaluation interval during training
  AMP           : false           # use AMP in training
  DDP           : True            # use DDP training
  LAMBDA_AUX    : 0.3             # aux loss weight
  AUX_WARMUP_EPOCHS : 10          # [P16] 초기 10 epoch uniform → 이후 entropy 반영

LOSS:
  NAME          : OhemCrossEntropy          # loss function name
  CLS_WEIGHTS   : false            # use class weights in loss calculation

OPTIMIZER:
  NAME          : adamw           # optimizer name
  LR            : 0.0006         # initial learning rate used in optimizer
  WEIGHT_DECAY  : 0.01            # decay rate used in optimizer

SCHEDULER:
  NAME          : warmuppolylr    # scheduler name
  POWER         : 0.9             # scheduler power
  WARMUP        : 10              # warmup epochs used in scheduler
  WARMUP_RATIO  : 0.1             # warmup ratio


EVAL:
  MODEL_PATH    : ''    # trained model file path
  IMAGE_SIZE    : [1024, 1024]                            # evaluation image size in (h, w)
  BATCH_SIZE    : 1
  MSF:
    ENABLE      : false                                   # multi-scale and flip evaluation
    FLIP        : true                                    # use flip in evaluation
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]       # scales used in MSF evaluation


TEST:
  MODEL_PATH    : ''    # trained model file path
  FILE          : '/ailab_mat2/personal/jemo_maeng/dset/Drone/MULTIAQUA_night'    # filename or foldername
  IMAGE_SIZE    : [1024, 1024]                            # inference image size in (h, w)
  OVERLAY       : false                                   # save the overlay result (image_alpha+label_alpha)
