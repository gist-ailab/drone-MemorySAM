# ═══ P37a-CEFR — P36 공정 레시피 + CEFR-Head + CA2-NoText anchor ═══
# Base 레시피 = b200-deliver_rgbdel_P36_router.yaml (G0c 동결: GATE·VETO·CALIB
# on / ATTN_BIAS·CONSISTENCY off / PHYSAUG off / ROUTER on) + 학습 envelope =
# hinton-deliver_rgbdel_P34_reliadino.yaml (768², BS1, grad checkpointing —
# bengio 24GB GPU 급). 사진측광 증강은 DGFusion 정합 ColorAugSSD(DGFUSION_AUG).
#
# 추가 = MODEL.CEFR (P37a): pass-1(P36 경로) logits → q=softmax(detach, s16
# pool) → POST-attention fused_tokens 위 per-modality zero-init routing head +
# CA2 anchor A_{i,k}=λ1·rel_cal_i + λ2(t)·log p̂_i(k) (p̂=calibrated aux
# posterior, detach; λ2는 0→target linear warmup) → w̄_i=Σ_k q_k·w_{i,k}
# (class-expected collapse) → fused' = Σ w̄_i·fused_i → feature blend
# fused_final=(1−σ(a))·gate_fused+σ(a)·fused' (a init −4, σ≈0.018 → 시작 시
# P36과 사실상 동일) → 공유 FPN+head 2회째 pass = 최종 logits (+P36 router
# residual 유지). Anti-collapse: zero-init heads·detached q·decisive reg·AECF
# hinge floor(batch-marginal entropy < floor일 때만 벌점). 모니터링:
# p37/cefr_w_* , p37/cefr_sigma_a.
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py --cfg <this>
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/bengio_deliver_rgbdel_P37a_cefr'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    # 공정 레시피 (P36/G0c 동결): attention bias OFF
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  # 공정 레시피: consistency 항 OFF
  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : true
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : true
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : true
    LAMBDA : 0.1

  # [P36] per-class router 유지 — CEFR은 그 위에 얹힘 (routed residual은
  # pass-1/최종 logits 양쪽에 동일하게 적용).
  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  # [P37a] CEFR-Head + CA2-NoText anchor (구현: semseg/models/reliadino/fusion.py
  # CEFRHead + model.py 2-pass flow). ENABLE false → P36과 byte-identical.
  CEFR:
    ENABLE           : true
    MORPH_INIT       : -4.0     # blend scalar a init → σ(a)≈0.018 (P36-near start)
    ANCHOR_POSTERIOR : true     # λ2·log p̂_i(k|s) 항 사용 (calibrated aux posterior)
    LAMBDA1          : 1.0      # rel_cal anchor 계수 (learnable scalar init)
    LAMBDA2_TARGET   : 0.5      # posterior anchor 목표 계수
    LAMBDA2_WARMUP_EP: 10       # λ2 linear warmup 0→target (epochs)
    ENTROPY_FLOOR    : 0.5      # AECF hinge: batch-marginal 혼합 entropy floor
    HIDDEN           : 64       # routing head hidden dim (zero-init last conv)

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : DELIVER
  ROOT          : '/SSDe/jemo_maeng/dset/DELIVER'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # DGFusion 정합 photometric 증강 (augmentations_mm.py: ColorAugSSD가
  # RandomColorJitter 대체) — 공정선 내.
  DGFUSION_AUG  : true
  # 공정 레시피: PhysAug OFF (P36/G0c 동결)
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  # LoRA up-proj(b_q/b_v) Frobenius norm cap — ep140 진단 blocks.1 depth-q
  # ‖dW‖ 606 폭주(36×) 이력 대응 seam. 20.0 = 넉넉한 헤드룸(정상 학습 궤적은
  # 건드리지 않고 폭주만 차단하는 loose cap).
  LORA_NORM_CAP : 20.0
  IMAGE_SIZE    : [768, 768]      # /16 -> 48x48 tokens; 24GB fits w/ ckpt+BS1
  BATCH_SIZE    : 2               # yeon 실측 VRAM 6GB@bs1 → bs2 안전(eff16 동일, wall-clock ½)
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false   # 🔴 ISSUE-027: 멀티모달 LoRA에서 true 금지 (stale active_modality grad 오염)

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 2               # yeon 실측 VRAM 6GB@bs1 → bs2 안전(eff16 동일, wall-clock ½)
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : true
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDe/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [768, 768]
  OVERLAY       : false
