# [R1] E1 스크린 레시피(TAPS on per_modal + C3 mfeat λ0.1) + BOUNDARY_REFINE on, 40ep 스크린, 시드 20260821, jarvis 4090.
#   원본 = jarvis-deliver_rgbdel_P46_c3only_seed20260821_screen40_E17.yaml.
#   변경(1축) = DETAIL_BRANCH.ENABLE false(E1 base 로 복귀) + MODEL.BOUNDARY_REFINE.ENABLE true. 그 외 SAVE_DIR.
#   → E1 base 대비 정확히 1축(depth 에지-prior FPN 정제)만 추가. DETAIL(세부 가지)과 직교하는 별개 실험이다.
#
# ── 진단(왜 만드나 — 제안서 2026-09-20 §6 "Q3+R", 판정 대장 "원거리 손해 원인 규명") ─────────
#   우리 모델은 얇은 객체를 **찾긴 하는데 윤곽을 못 그린다**(찾고도 못 그린 비율 0.204/0.429 대 기준선
#   0.085/0.253, 경계 F 원거리 TrafficLight −0.167). 결함은 같은 크기여도 거리가 멀수록 커지고 손실은
#   **경계**에서 난다. 검출·클래스 지식은 기준선과 같다.
# ── 가설 ─────────────────────────────────────────────────────────────────────
#   입력 depth 모달의 **불연속(에지)** 을 경계 prior 로 삼아 SimpleFPN stride-4 특징을 에지 인지 방식으로
#   정제하면(depth 를 특징으로 융합하는 것이 아니라 — 그 축은 반증됨 — 경계 위치 정보만), 얇은 객체의
#   윤곽 손실(찾고도 못 그림)이 회복된다. s' = s + tanh(γ)·Conv3x3([s ; s⊙e ; e]), e=sigmoid(k·(g−τ)).
# ── 게이트(사전 등록, 제안서 §4) ────────────────────────────────────────────
#   G-clean: legal test 24클래스(RailTrack 제외) Δ vs E1 확정 시드1 ≥ +0.5.
#   얇은 4클래스(Pole·Pedestrian·Static·TrafficLight) 평균 Δ vs E1 ≥ +2.0, 악조건 조건별 −0.5 미만 없음.
#   부수: "찾고도 못 그린 비율"(원거리) 이 기준선 방향으로 하락. [BREFINE] gate=tanh(γ) 가 정체(≈0) 아닌 성장.
# ── 공정성 ──────────────────────────────────────────────────────────────────
#   PHYSAUG off · DGFUSION_AUG(ColorAugSSD, ISSUE-026 픽스본) on · val-best ckpt · TTA 금지 (E1 계승).
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/jarvis_deliver_rgbdel_P46_c3only_seed20260821_screen40_R1'  # [BOUNDARY_REFINE 40ep 스크린]

# Trainer = train_reliadino.py.
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py --cfg <this>
MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16          # exp-dir naming only
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null                      # null -> alpha = r (scale 1.0)
  TAPS:
    ENABLE  : true                          # off(기본)면 B0 와 forward·state_dict byte-동일
    LAYERS  : [6, 12, 18, 24]               # 1-indexed 블록(24블록에서 24=마지막). resolve_taps 규약
    MODE    : per_modal                     # per_modal(센서별 탭 유지·FPN 레벨 합산) | mean(P43 식 모달 평균)

  # ═══ [R1] DETAIL_BRANCH off (E1 base 복귀) ═══
  DETAIL_BRANCH:
    ENABLE     : false                      # E17 대비 off — 세부 가지와 직교 실험(1축 격리)

  # ═══ [R1] depth 에지-prior FPN 정제 — 이번 카드의 유일한 변경 ═══
  BOUNDARY_REFINE:
    ENABLE     : true                       # off(기본)면 forward·state_dict byte-동일 (boundary_refine.py)
    LEVELS     : [4]                         # SimpleFPN stride-4 정제(기본). [4, 8] 옵션
    K_INIT     : 10.0                        # 에지 게이트 날카로움 k init(학습 가능)
    GAMMA_INIT : 0.1                         # 레벨별 게이트 γ init(zero-init 금지 — 첫 스텝부터 grad)
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:                              # G0c 동결: 효과≈0 판정(P35/T1)
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2] fog_night 유해 실증(07-20)
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  ROUTER:                                   # [P36] 유일 생존 모듈 — 유지
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:
    ENABLE : false
  CLASS_TOKEN:
    ENABLE : false

  M2F:                                      # [P38/P39] 변경 없음 (P39.1과 동일)
    ENABLE          : true
    NUM_QUERIES     : 100
    NUM_LAYERS      : 6
    DIM             : 256
    NUM_HEADS       : 8
    MLP_RATIO       : 2.0
    BETA_INIT       : 0.0
    W_CLS           : 2.0
    W_BCE           : 5.0
    W_DICE          : 5.0
    NO_OBJ_W        : 0.1
    POINTS          : 12544
    DEEP_SUPERVISION : true
    LOSS_W          : 0.5
    SRC             : modal
    ANCHORED        : true
    POINT_QUOTA     : 256

  P39:                                      # [P39.1-rank] base — 변경 없음
    TRUNK_EXP       : true
    ARBITER         : true
    PATH_DROPOUT_P  : 0.25
    ROUTER_CE_W     : 0.4
    TRUNK_MODE      : gated_mlp
    TRUNK_HIDDEN    : 256
    VICREG:
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LIDAR_W : 1.0
      OTHER_W : 0.25

  # ═══ [P46-CTR] class-transfer recovery — C3 단독(C1/C2 off, E1 동일) ═══
  P46:
    C1_RCS:
      ENABLE        : false
      MODE          : daformer
      TEMP          : 0.01
      MIN_PIXELS    : 1
      LOSS_BLEND_W  : 1.0
      EMA_M         : 0.99
      EMA_INTERVAL  : 1
      REFRESH       : 32
      SEED          : 0
      CACHE_DIR     : ''
    C2_MCC:
      ENABLE        : false
      MASK_RATIO    : 0.5
      PATCH         : 64
      MODALS        : all
      LAMBDA        : 1.0
      CONF_THRESH   : 0.75
      LOSS          : ce
      EMA_ALPHA     : 0.999
      WARMUP_EP     : 5
    C3_PROTO:
      ENABLE        : true
      FEATURE       : mfeat      # mfeat(stride-4 head feature, 256) | fused(1/16, 1024)
      LAMBDA        : 0.1        # λ3
      TEMPERATURE   : 0.1        # cosine logit 온도 τ
      EMA           : 0.999      # prototype EMA 계수
      PIXELS        : 4096       # 손실당 서브샘플 픽셀 수
      WARMUP_EP     : 5
      CROSS_VIEW    : false
      CROSS_VIEW_W  : 1.0

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20

DATASET:
  NAME          : DELIVER
  ROOT          : '/SSDb/jemo_maeng/dset/DELIVER'   # jarvis DELIVER path
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # DGFusion 공정선: PhysAug OFF + SSD photometric (ColorAugSSD, ISSUE-026 픽스본)
  DGFUSION_AUG  : true
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  LORA_NORM_CAP : 20.0
  SEED          : 20260821
  IMAGE_SIZE    : [768, 768]      # /16 -> 48x48 tokens
  BATCH_SIZE    : 1                 # jarvis 4090 24GB. 에지 정제 stride-4 활성화 소폭 — 기동 전 P46_MEM_LOG=1 권장
  EPOCHS        : 40   # [스크린] 40ep 조기 판정. 확정은 200ep 3페어
  EVAL_START    : 0
  EVAL_INTERVAL : 5
  SAVE_TOPK     : 1                 # [스크린] val 상위 1개만 보관
  SAVE_TEST_CKPT : false            # [스크린] test 상위 체크포인트 미보관(평가·로그는 유지)
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [768, 768]
  BATCH_SIZE    : 1
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [768, 768]
  OVERLAY       : false
