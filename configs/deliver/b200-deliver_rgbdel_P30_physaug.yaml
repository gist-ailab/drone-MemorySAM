DEVICE          : cuda
SAVE_DIR        : './outputs/MMSamP30/b200_deliver_rgbdel_P30_physaug'

MODEL:
  NAME          : CMNeXt
  BACKBONE      : CMNeXt-B2
  PRETRAINED    : '/hpc2hdd/home/cliao127/MMSS-SAM-S1/sam/checkpoints/pretrained/segformer/mit_b2.pth'
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  LORA_MODEL    : LoRA_Sam_P30
  LORA_R        : 4
  LORA_NUM_EXPERTS : null
  LORA_TOP_K    : None
  LORA_LAYER    : null
  LORA_COND_DIM : 8
  MODAL_COND_MOE : true
  COND_MODE     : film            # [P29] SDC FiLM gate (inherited)
  # [P29] Self-Derived Condition routing (inherited, ON)
  SDC:
    ENABLE      : true
    K           : 6
    LATENT_DIM  : 32
    LAMBDA      : 0.1
  # [P30] ① Class-token decoder — rare-class fix (ports SAM3-RBMA class-collapse break).
  #   C class queries cross-attend fused memory feature m_feat → per-class masks.
  CLASS_TOKEN_DECODER:
    ENABLE      : true
    DIM         : 128
  # [P30] ② Reliability-anchored learned modality router — dead-modality fix (revive event/LiDAR).
  #   w = softmax_modality(learned_logits + ANCHOR_LAMBDA·reliability); learned, anchor prevents collapse.
  LEARNED_ROUTER:
    ENABLE        : true
    PER_CLASS     : true          # per-class modality weights (route a class to the modality that sees it)
    ANCHOR_LAMBDA : 1.0
    REG_LAMBDA    : 0.01          # modality-mixing entropy reward (diversity)
  # [P28] RBMA (inherited)
  QUALITY_GATE:
    HIDDEN_DIM   : 64
    MIN_QUALITY  : 0.3
    PER_MODALITY : true
    TAU_UAMM     : 1.0
    TAU_TEACHER  : 0.5
    MEMORY_MOD   : false
    AMF_MODE     : uniform
    PER_MODALITY_DECODER : true
    AUX_CE_WEIGHT : 0.5
    MULTI_SCALE_SQG : true
    DEBA_FP      : false
    LAMBDA_BIAS_INIT : 1.0

DATASET:
  NAME          : DELIVER
  ROOT          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/DELIVER'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  PHYSAUG:
    ENABLE    : true
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 6
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : True
  GRADIENT_CHECKPOINT : false
  LAMBDA_GATE   : 0.5

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 16
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

TEST:
  MODEL_PATH    : ''
  FILE          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
