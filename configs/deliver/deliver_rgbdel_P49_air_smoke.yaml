# ═══ P49-AIR — DELIVER 4모달 **기동 스모크** (EPOCHS 2, 나머지는 본학습과 동일) ══
# 본학습 config = configs/deliver/deliver_rgbdel_P49_air.yaml 의 복사본이고
# TRAIN.EPOCHS / SAVE_DIR 만 다르다. 실 데이터로 1 에폭이 끝까지 도는지 + 첫 eval
# 이 통과하는지만 본다. 합성 텐서 단위검사는 `python tools/smoke_p49.py`.
#
# 🔴 기동 "검증"의 판정 기준(CLAUDE.md §1.6): iteration 이 실제 전진하는가 ·
#    rank0 GPU util > 0 인가 · 메모리가 가중치 수준(3~4GiB)이 아닌가 · 첫 eval 통과.
#    "프로세스가 떴다"는 검증이 아니다.
# ═══ (아래는 본학습 config 주석 원문) ═══════════════════════════════════════
# ═══ P49-AIR — DELIVER 4모달(img/depth/event/lidar) 본학습 ═══════════════════
# 설계 정본 = .claude_logs/decisions/2026-08-10-p49-air-asymmetric-injection-proposal.md
# 구현      = semseg/models/reliadino/p49.py  (trainer = train_reliadino.py)
#
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py \
#       --cfg configs/deliver/deliver_rgbdel_P49_air.yaml
#
# 한 줄: 대칭 융합 트렁크를 버리고 **온전한 RGB 주경로(DINOv3-L 부분 FT) +
#        인코더-내부 비대칭 보조 주입(zero-init γ)** 으로 간다.
#
# 사전등록 게이트 (제안 §4)
#   ep30      ① γ 노름 성장(≈0 정체 아님 — 로그 `p49/gamma_*`) ② RGB-easy 무손실
#             (base 대비 ≥−0.3) ③ RGB-hard 개선 방향(+).  미달 시 즉시 중단.
#   완주      legal test ≥ 57.35(SOTA, primary) · val ≥ 69.60 · RailTrack ≥ 62
#   falsifiable  A3 on/off A/B: hard ≥+2.0 & easy ≥−0.3
#
# 공정성: PHYSAUG off · DGFUSION_AUG(ColorAugSSD, ISSUE-026 픽스본) on · val-best
#         ckpt · TTA 금지.  ⚠️ 서버별 경로(DATASET.ROOT)만 고쳐서 쓸 것.
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/deliver_rgbdel_P49_air_smoke'

MODEL:
  NAME          : ReliaDINO                   # 트레이너 진입점(빌더가 P49로 분기)
  BACKBONE      : P49AIR-ViTL16               # exp-dir naming only
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : false                       # 스모크는 재개하지 않는다
  LORA_R        : 8                          # RGB_FT=true 면 미사용(ablation 팔 전용)
  LORA_ALPHA    : null
  FPN_DIM       : 256

  # ═══ [P49-AIR] A1~A5. 전 항목 토글 = ablation 분해 보장 ═══════════════════
  P49:
    ENABLE      : true

    # ── A1 RGB 주경로 = DINOv3-L **부분 fine-tune** (LoRA 폐지) ──────────────
    # 근거: MM-SA 2509.10408 Tab.4 — frozen+LoRA 49.77 은 RGB-only 53.32 보다
    # 낮은 최약 구성이고 full FT 는 57.14. 층별 LR은 OPTIMIZER.LLRD 가 건다.
    RGB_FT      : true

    # ── A2 보조 모달 인코더 = 모달별 독립 ConvNeXt-S ────────────────────────
    # 근거: lidar rank 붕괴(H8) — sparse 모달에 conv prior 가 유리.
    # false 로 내리면 AUX_ENCODER 가 'vit_lora'(기존 계보 팔)로 자동 전환된다.
    AUX_CNN     : true
    AUX_BACKBONE : convnext_small
    AUX_PRETRAINED : true
    # AUX_ENCODER : convnext        # convnext | stem | vit_lora (미지정=AUX_CNN 따름)

    # ── A3 인코더-내부 비대칭 주입 ──────────────────────────────────────────
    # ViT 24층을 4블록(6층)으로 나눠 경계마다 Injector(+zero-init γ) / Extractor.
    # 🔴 INJECT:false 면 보조 모달이 **완전히 무시**되어 RGB 단독과 등가다
    #    (tools/smoke_p49.py B 가 allclose 로 확인).
    INJECT      : true
    DEFORM      : false     # 🔴 true 는 미구현 — 명시적으로 죽는다(조용한 폴백 없음)
    NUM_BLOCKS  : 4
    DIM         : 256       # 보조 토큰 채널
    ATTN_DIM    : 256       # cross-attn 내부 차원
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    # vanilla cross-attn의 K/V 예산: 레벨 i 그리드 상한 = KV_GRID >> i (하한 FLOOR).
    # 1024² 기준 보조 4레벨이 64²/32²/16²/8² = 5440 토큰. 메모리가 빠듯하면 32로.
    KV_GRID     : 64
    KV_GRID_FLOOR : 8

    # ── A4 헤드 = 멀티스케일 피라미드 → M2F-lite (query 경쟁 경로 제거) ─────
    # 🔴 P39 dual-path(arbiter + path dropout + β 잔차)는 쓰지 않는다 (H9: query
    #    경로 순기여 −0.09 = dense 복제). M2F 손실은 **독립 주손실**이고 logits
    #    에 더해지지 않는다 → 추론 경로는 결정론적 픽셀 헤드 하나뿐이다.
    MS_HEAD     : true
    HEAD_MODE   : pixel     # pixel(기본) | query(=semantic_scores 를 출력으로)
    M2F:
      ENABLE          : true
      NUM_QUERIES     : 100
      NUM_LAYERS      : 6
      DIM             : 256
      NUM_HEADS       : 8
      MLP_RATIO       : 2.0
      W_CLS           : 2.0
      W_BCE           : 5.0
      W_DICE          : 5.0
      NO_OBJ_W        : 0.1
      POINTS          : 12544
      DEEP_SUPERVISION : true
      LOSS_W          : 0.5
      ANCHORED        : true
      POINT_QUOTA     : 256

    # ── A5(일부) VICReg on 보조 인코더 ──────────────────────────────────────
    # H8 실증(lidar eff.rank 4.7 → 복원). γ=0 인 step 0 구간에서 보조 인코더의
    # **유일한 gradient 출구**이기도 하다 → 끄지 말 것 (p49.py 상단 주석).
    VICREG:
      ENABLE  : true
      LVAR    : 0.1
      LCOV    : 0.01
      TOKENS  : 2048
      LEVEL   : 2           # 보조 멀티스케일 중 stride-16 레벨
      LIDAR_W : 1.0
      OTHER_W : 0.25

  # ═══ A5 C-3 prototype (클래스축) — 기존 P46 키를 그대로 재사용 ═══════════
  P46:
    C3_PROTO:
      ENABLE      : true
      FEATURE     : mfeat   # P49는 mfeat(stride-4 head feature, 256)만 지원
      LAMBDA      : 0.2
      TEMPERATURE : 0.1
      EMA         : 0.999
      PIXELS      : 4096
      WARMUP_EP   : 5
      CROSS_VIEW  : false   # 2-forward 보조 branch 미사용(P49는 replay 미지원)

DATASET:
  NAME          : DELIVER
  ROOT          : '/SSDb/jemo_maeng/dset/DELIVER'   # ⚠️ 서버별로 교체
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # DGFusion 공정선: PhysAug OFF + SSD photometric (ColorAugSSD, ISSUE-026 픽스본)
  DGFUSION_AUG  : true
  PHYSAUG:
    ENABLE    : false

TRAIN:
  IMAGE_SIZE    : [1024, 1024]      # /16 -> 64x64 tokens
  BATCH_SIZE    : 1                 # eff-batch 16 은 trainer 의 grad-accum 이 맞춘다
                                    # (accumulation_steps = ceil(16 / (BS*world)))
  EPOCHS        : 2                 # ← 본학습(150) 대비 유일한 학습량 차이
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  # 🔴 P49 + INJECT 에서는 모델이 이 값을 거부하고 off 로 되돌린다 — 블록 경계
  #    주입 훅의 보조 상태가 backward 재계산과 충돌한다(ISSUE-027 계열).
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : CrossEntropy
  CLS_WEIGHTS   : false
  OHEM          : true              # [A5] OHEM CE 채택 (MM-SA 와 동일 처방)
  OHEM_THRESH   : 0.7
  OHEM_MIN_KEPT : 100000

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0002            # 백본이 풀렸으므로 기존 6e-4 보다 낮춘다
  WEIGHT_DECAY  : 0.01
  LLRD          : 0.9               # [A1] layer-wise LR decay (백본만 감쇠)

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : false
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
