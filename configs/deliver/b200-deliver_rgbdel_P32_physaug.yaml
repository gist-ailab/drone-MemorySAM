DEVICE          : cuda
SAVE_DIR        : './outputs/MMSamP32/b200_deliver_rgbdel_P32_physaug'

MODEL:
  NAME          : CMNeXt
  BACKBONE      : CMNeXt-B2
  PRETRAINED    : '/hpc2hdd/home/cliao127/MMSS-SAM-S1/sam/checkpoints/pretrained/segformer/mit_b2.pth'
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  LORA_MODEL    : LoRA_Sam_P32
  LORA_R        : 4
  LORA_NUM_EXPERTS : null
  LORA_NUM_CLASSES : 25            # eval 빌드용 (trainer는 trainset.n_classes 사용; val.py 일치 필수)
  LORA_TOP_K    : None
  LORA_LAYER    : null
  LORA_COND_DIM : 8
  MODAL_COND_MOE : true
  # [P32] CoRB — Corroboration-Biased Memory Attention (roadmap 23 P32-B; Phase 0 = doc 24).
  #   기구는 P28 RBMA와 동일: cross-attn additive bias  softmax(QK^T/√d + λ·B) V.
  #   차이 = bias 신호 B의 의미만 교체: self-entropy(1−H(softmax(D_i(f_i)))/logC) →
  #          cross-modal corroboration(corr_veto). 무학습 신호, λ만 학습.
  #   근거: self-entropy는 decoder 용량과 confound → event/LiDAR anti-calibrated
  #        (AUROC .30/.22). corr_veto가 무학습으로 .54/.81 반전(doc 24 결과 A).
  #   이 config = 순수 ablation: P28과 모든 것 동일(AMF uniform·SDC off·CTD off·router off),
  #   오직 memory-attn bias 신호만 corroboration. → Test mIoU를 P28(55.27)과 직접 비교.
  QUALITY_GATE:
    HIDDEN_DIM   : 64
    MIN_QUALITY  : 0.3
    PER_MODALITY : true
    TAU_UAMM     : 1.0
    TAU_TEACHER  : 0.5
    MEMORY_MOD   : false
    AMF_MODE     : uniform          # 순수 RBMA (출력 융합 등가중, 적응은 오직 corroboration bias)
    PER_MODALITY_DECODER : true
    AUX_CE_WEIGHT : 0.5
    MULTI_SCALE_SQG : true
    DEBA_FP      : false
    LAMBDA_BIAS_INIT : 1.0          # memory attention bias 학습 스칼라 초기값
  # [P32] corroboration 신호 ON
  CORROBORATION:
    ENABLE   : true
    VETO     : true                 # unique-info veto blend (corr_veto; doc 24 확정 신호형)
  # [P32] P29 SDC 라우팅 OFF (순수 RBMA ablation 유지; P32는 P31 상속이라 명시적 off 필요)
  SDC:
    ENABLE   : false

DATASET:
  NAME          : DELIVER
  ROOT          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/DELIVER'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'depth', 'event', 'lidar']

  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # PhysAug: dataset-level (NIGHT_AUG와 독립)
  PHYSAUG:
    ENABLE    : true
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 8
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true            # B200 bf16 Tensor Core 활용
  AMP_DTYPE     : bfloat16
  DDP           : True
  GRADIENT_CHECKPOINT : false
  LAMBDA_GATE   : 0.5

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 10
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1
  EVAL_DAY      : false

  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

TEST:
  MODEL_PATH    : ''
  FILE          : '/NHNHOME/ailab/Workspaces/jemo_maeng/dset/DELIVER'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
