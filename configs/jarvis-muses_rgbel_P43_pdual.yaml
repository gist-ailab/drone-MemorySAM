# ═══ P43-PanopticDual × MUSES 3모달 (jarvis) — PQ 축 헤드라인 ═══
# 설계: .claude_logs/decisions/2026-07-24-p43-p45-cvpr-sota-proposal.md §2
# 왜: MUSES mIoU 보드는 융합에게 죽은 축(1위 GtA 82.39 카메라단독, 2위 MM-SAM-Adapter 81.07
#   RGB+L). PQ 보드(Codabench 13987)는 DGFusion 61.03 / CAFuser 59.70 / M2F baseline 53.60이고
#   frozen-VFM 참가자가 0이다. 우리는 per-pixel head라 PQ 산출 자체가 구조적으로 불가 → P43이
#   그 구멍을 메운다. 목표 = test PQ ≥59.7(CAFuser), 업사이드 61.03(DGFusion).
#
# 구조 (semseg/models/reliadino/panoptic_head.py = MaskClsHead):
#   Head A = 기존 per-pixel FPN head (주 손실, 불변 — mIoU 소유, thin-class 앵커)
#   Head B = M2F 쿼리 디코더 (100 query, {1/32,1/16,1/8} round-robin masked cross-attn,
#            mask embed · 1/4 SimpleFPN feature) + **독립 Hungarian 주 손실**
#            (CE(no-obj 0.1) + point-sampled BCE/Dice 2/5/5, PointRend importance sampling)
#   L = L_pixel + λ(t)·L_mask,  λ: 0.1→1.0 over LAMBDA_WARMUP_EP epochs
#   🔴 두 헤드는 SimpleFPN 트렁크만 공유한다. Head B는 pixel logits에 더해지지도, 게이트되지도,
#      대체하지도 않는다 — P38 β zero-init 잔차(추론 no-op, 실패-키 1)와 P30 헤드 대체(소물체
#      붕괴)를 둘 다 피하는 것이 이 설계의 전부. tools/smoke_p43.py의 B'4~B'6이 이를 assert한다.
#   + LATERAL: frozen DINOv3 중간 블록 3곳(24블록 → 5/11/17)을 SimpleFPN에 1×1 proj로 주입
#     (PMT 2603.25398 실증 +2.2 PQ). zero-init·게이트 아님 — 주 경로라 첫 스텝부터 gradient.
#
# Base recipe = P36-router 공정선 (ATTN_BIAS·CONSISTENCY off / GATE·CALIB off [M-2, fog_night
#   유해 실증 07-20] / ROUTER on / CEFR·CLASS_TOKEN off). 🔴 M2F(P38 헤드) **off** — P38 잔차
#   헤드는 P43의 *비교군*(3-way ablation: P30 대체 / P38 잔차 / P43 공동학습)이지 구성요소가
#   아니다. 두 개의 쿼리 디코더를 동시에 돌리면 그 비교가 무너진다. P39 모듈도 off(미판정 +
#   ARBITER는 P43이 제거하는 그 병합 기제).  → P43.M2F_HEAD/LATERAL을 끄면 이 base와 완전 동일.
# 공정성(게이트 사전등록): PHYSAUG off + DGFUSION_AUG on · TTA 금지 · val-best · radar 미포함.
#   ⚠️ 기존 MUSES 최고(P38-m2f 79.025)는 physaug ON에서 나온 수치라 mIoU 직접 비교는 1-변수가
#   아니다. P43의 판정 축은 PQ이고, mIoU는 "Head A 무손상(val ≥82.22)" 확인용으로만 읽는다.
# ep30 게이트: ① val PQ 상승 & PQ_thing>0(P30 붕괴 시그니처 = thing≈0) ② Head A thin-class IoU가
#   dense-only 대비 −1pt 이내 ③ 쿼리 비어있지 않음(train/p43_mask_loss 하락 + λ 도달).
# 🔴 GRADIENT_CHECKPOINT: false (ISSUE-027 active_modality 오염 — 절대 켜지 말 것).
#   torchrun --standalone --nproc_per_node=<N> train_reliadino.py --cfg <this>
DEVICE          : cuda
SAVE_DIR        : './outputs/ReliaDINO/jarvis_muses_rgbel_P43_pdual'

MODEL:
  NAME          : ReliaDINO
  BACKBONE      : ReliaDINO-ViTL16
  BACKBONE_TIMM     : vit_large_patch16_dinov3
  BACKBONE_FALLBACK : vit_large_patch14_reg4_dinov2
  PRETRAINED_BACKBONE : true
  RESUME_ENABLE : false
  RESUME_PATH   : ''
  AUTO_RESUME   : true
  LORA_R        : 8
  LORA_ALPHA    : null
  FPN_DIM       : 256

  FUSION:
    NUM_LAYERS  : 2
    NUM_HEADS   : 8
    MLP_RATIO   : 4.0
    AUX_HIDDEN  : 256
    AUX_CE_WEIGHT : 0.5
    ATTN_BIAS:
      ENABLE       : false
      LAMBDA1_INIT : 1.0

  CONSISTENCY:
    ENABLE       : false
    LAMBDA2_INIT : 0.5

  GATE:
    ENABLE        : false   # [M-2] fog_night 유해 실증(07-20)
    TAU           : 0.25
    ENTROPY_REG   : 0.0
    ENTROPY_FLOOR : 0.5
    VETO_FLOOR:
      ENABLE : false
      THRESH : 0.10
      CAP    : 0.05

  CALIBRATION:
    ENABLE : false  # [M-2]
    LAMBDA : 0.1

  # [P36] per-class router 유지 — 계보에서 thin-class 회복 실적이 있는 유일 모듈
  ROUTER:
    ENABLE        : true
    ANCHOR_LAMBDA : 1.0
    REG_MODE      : decisive
    REG_LAMBDA    : 0.01
    ALPHA_INIT    : 0.0
    HIDDEN        : 64

  CEFR:        { ENABLE: false }   # P37a off
  CLASS_TOKEN: { ENABLE: false }   # P37b off
  M2F:         { ENABLE: false }   # 🔴 P38 잔차 헤드 = 비교군. 켜지 말 것.
  P39:         { TRUNK_EXP: false, ARBITER: false }   # 미판정 모듈 미혼입

  # [P43] PanopticDual (주 신규 변수)
  P43:
    M2F_HEAD         : true
    NUM_QUERIES      : 100
    DEC_LAYERS       : 6           # {1/32,1/16,1/8} round-robin 2바퀴 (≥NUM_LEVELS=3 강제)
    DIM              : 256         # query dim_t
    NUM_HEADS        : 8
    MLP_RATIO        : 2.0
    W_CLS            : 2.0         # M2F 표준 가중 2/5/5
    W_BCE            : 5.0
    W_DICE           : 5.0
    NO_OBJ_W         : 0.1
    NUM_POINTS       : 12544       # PointRend 샘플 수 (OOM 시 여기부터 줄일 것)
    OVERSAMPLE       : 3.0         # importance sampling 후보 배수
    IMPORTANCE       : 0.75        # 불확실 포인트 비율(나머지는 uniform)
    DEEP_SUPERVISION : true
    LAMBDA           : 1.0         # L = L_pixel + λ(t)·L_mask
    LAMBDA_WARMUP_EP : 5           # λ 0.1 → 1.0
    LATERAL          : true        # [T-2] PMT식 multi-depth lateral tap
    NUM_TAPS         : 3           # ViT-L 24블록 → [5, 11, 17]
    EVAL_HEAD        : false       # 평가 forward에서 헤드 생략(속도) — PQ는 아래 경로로
    SEM_SOURCE       : pixel       # 🔴 semantic 출력 = Head A. 학습에는 영향 없음(eval 전용 옵션)
    THING_IDS        : [11, 12, 13, 14, 15, 16, 17, 18]   # Cityscapes trainId thing (person..bicycle)

  MODAL_DROPOUT:
    ENABLE    : false
    P         : 0.3
    TARGETS   : ['img', 'depth']
    WARMUP_EP : 20


DATASET:
  NAME          : MUSES
  ROOT          : '/SSDb/jemo_maeng/dset/MUSES'
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'lidar', 'event']    # radar 제외 (ISSUE-025 + val −0.09 무익)
  RGB_SUBROOT   : null
  THERMAL_SUBROOT : null
  LIDAR_SUBROOT : null
  NIGHT_TRANSLATION : false
  # DGFusion 공정선: PhysAug OFF + SSD photometric (ColorAugSSD)
  DGFUSION_AUG  : true
  PHYSAUG:
    ENABLE    : false
    P         : 0.40
    FILTER:
      ENABLE      : true
      SIGMA_RANGE : [0.0, 1.5]
      KERNEL_SIZE : 3
    FOURIER:
      ENABLE      : true
      GROUPS      : [1, 513]
      PHASES      : [0.0, 1.0]
      GRANULARITY : 256
      MEAN_STR    : 8.0
      DECAY       : 0.3

TRAIN:
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 1                 # jarvis 4090 24GB. accum=ceil(16/(BS×world))로 eff-batch 16 유지.
                                    # P43 헤드는 매칭된 쿼리에 대해서만 full-res mask logit을 만들고
                                    # (present class 수 ~19), 나머지는 point-sampled라 P38 대비 증분이 작다.
  EPOCHS        : 200
  EVAL_START    : 0
  EVAL_INTERVAL : 2
  AMP           : true
  AMP_DTYPE     : bfloat16
  DDP           : true
  GRADIENT_CHECKPOINT : false

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0006
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 15
  WARMUP_RATIO  : 0.1

EVAL:
  MODEL_PATH    : ''
  IMAGE_SIZE    : [1024, 1024]
  BATCH_SIZE    : 4
  EVAL_DAY      : false
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

WANDB:
  ENABLE        : true
  PROJECT       : MemorySAM

TEST:
  MODEL_PATH    : ''
  FILE          : '/SSDb/jemo_maeng/dset/MUSES'
  IMAGE_SIZE    : [1024, 1024]
  OVERLAY       : false
