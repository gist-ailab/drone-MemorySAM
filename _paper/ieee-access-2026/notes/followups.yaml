#     (repo 루트 crontab, 30분마다). 수정을 반영하면 paper 세션이 아래 status 를 done 으로 바꾸고 커밋한다.
#
# 항목 필드
#   depends_on : lab-plan 항목 id(DRN-…) → verdict 가 기록되면 끝난 것으로 본다.
#                lab-inbox 메시지 id(숫자로 시작) → 그 메시지 status 가 done 이면 끝난 것으로 본다.
#                빈 목록 = 지금 바로 고칠 것(첫 실행에 한 번 통지).
#   where      : 원고 위치(파일 + 절·표·문장 단서)
#   now        : 지금 원고에 둘 확정 서술(또는 지금 문제)
#   branches   : 결과(adopt/reject/inconclusive 또는 done)별로 바꿀 내용
#   status     : open | done(paper 가 반영하고 커밋). 통지 여부는 git 밖 상태 파일
#                <repo>/.watchdog/paper_followups_state.json 에 남는다(같은 결과로는 한 번만 보냄).

