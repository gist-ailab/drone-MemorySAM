# Inference bank of the IEEE Access manuscript: every model's prediction on the WHOLE evaluation split,
# stored once so that example scenes can be re-chosen at any time without re-running inference.
# Read by figures/qualbank/qualbank.py (ingest / score / candidates / status) and figures/src/make_qual_figs.py.
#
# bank layout (NAS, not git):  <bank_root>/<dataset>_<split>/<model>/<image_id>.png   raw train-ID, GT resolution
#                              <bank_root>/<dataset>_<split>/gt/<image_id>.png         train-ID, 255 = ignore
#                              <bank_root>/<dataset>_<split>/<model>/MANIFEST.json     source, md5 of ckpt, count
#                              <bank_root>/<dataset>_<split>/scores/<model>.npz        per-image confusion matrices
# image_id = path relative to the dataset root without extension (nested, never flattened: ISSUE-034).
#
# status: ready   = predictions for the whole split are in the bank
#         pending = waiting for a dump (who/what is in `note`)
bank_root: /drone_nas/drone/personal/jemo_maeng/src/Project/drone/drone-MemorySAM/analysis_logs/paper_qualbank

datasets:
  deliver:
    split: test
    n_images: 1897
    classes_from: semseg/datasets/deliver.py        # CLASSES and PALETTE are parsed from this file
    thin_classes: [Pole, TrafficLight, Pedestrian, Static]
    gt_source: /drone_nas/drone/personal/jemo_maeng/src/Project/drone/drone-MemorySAM/analysis_logs/a2_test1024_dump_20261016/s902/test/gt
    input_root: /mnt/HDD1/Workspace/dset/DELIVER
    inputs:                                          # path = input_root / (image_id with each [old, new] replaced) + .png
      rgb: []                                        #   first entry = the RGB tile of the figures
      depth: [[img/, depth/], [_rgb_, _depth_]]
      event: [[img/, event/], [_rgb_, _event_]]
      lidar: [[img/, lidar/], [_rgb_, _lidar_]]
    # group = condition shown as a figure row; first matching rule wins
    # DELIVER test mixes weather (case none) with built-in sensor-failure cases (sequence suffix); each case is
    # its own group so weather rows stay case-free (same as analysis' selection, inbox 20261030-175233)
    group_rules:
      - {contains: underexposure, group: low_exposure}
      - {contains: overexposure, group: overexposure}
      - {contains: motionblur, group: motionblur}
      - {contains: lidarjitter, group: lidarjitter}
      - {contains: eventlowres, group: eventlowres}
      - {regex: '^img/([a-z]+)/', group: '\1'}
    sequence_regex: '^img/[a-z]+/[a-z]+/([^/]+)/'   # no two selected scenes from the same sequence
    ours: A2s821
    # user 2026-11-04: figures compare released weights of published baselines, in release order CMNeXt (CVPR 2023),
    # CAFuser (RA-L 2025), DGFusion (2026); our ablation (Q2s821) and the retrained CAFb are kept in the bank but not compared.
    compare: [CMNeXt, CAFofficial, DGFofficial]      # delta = ours - max(compare)
    models:
      A2s821:
        label: Ours
        role: ours
        status: ready
        source: /drone_nas/drone/personal/jemo_maeng/src/Project/drone/drone-MemorySAM/analysis_logs/a2_test1024_dump_20261016/s821/test/pred
        ckpt: "yeon:outputs/ReliaDINO/yeon_deliver_rgbdel_P46_c3only_seed20260821_screen40_A2hires (see paper_qual_deliver_20261030/manifest.csv)"
        expected_miou: 58.61                           # legal v2 test, judgment record; ingest checks it
      A2s902:
        label: Ours (seed 902)
        role: ours_seed
        status: ready
        source: /drone_nas/drone/personal/jemo_maeng/src/Project/drone/drone-MemorySAM/analysis_logs/a2_test1024_dump_20261016/s902/test/pred
        expected_miou: null
      Q2s821:
        label: Ours w/o high-res
        role: ablation
        status: ready
        source: /home/jemo/.claude/jobs/4ad76b83/tmp/qual_q2/pred      # analysis job scratch -> copied into the bank
        ckpt: "NAS ckpts/hpca100_rescue_q2e1_20261030/Q2_s821_epoch40_67.0.pth (md5 c93de37b389a20a77e3bfd369123734c)"
        expected_miou: 57.73
      DGFofficial:
        label: DGFusion
        role: baseline
        status: ready
        source: /home/jemo/.claude/jobs/4ad76b83/tmp/qual_rle/dgf_official/test/pred
        resize_from: 1024                              # nearest to GT size, same as the scoring (common.resize_nearest)
        ckpt: "NAS ckpts/dgfusion_official_20261001/dgfusion_swin_tiny_bs8_200k_deliver_clde.pth (md5 0f40a64119f02461d2c7b49628d6208d)"
        expected_miou: 56.71
      CAFb:
        label: CAFuser (retrained)
        role: baseline
        status: ready
        source: /home/jemo/.claude/jobs/4ad76b83/tmp/qual_rle/cafuser_b/test/pred
        resize_from: 1024
        ckpt: "NAS ckpts/cafuser_b_resume_20261003/model_final.pth (md5 fbae170df640840bfd9c54e05faa4880)"
        expected_miou: 55.77
      CMNeXt:
        label: CMNeXt
        role: baseline
        status: ready
        source: /drone_nas/drone/personal/jemo_maeng/src/Project/drone/drone-MemorySAM/analysis_logs/baseline_official_dump_20261104/cmnext_official/test/pred      # native 1042, legal v2 (analysis report 20261104-185440)
        ckpt: "NAS ckpts/cmnext_official_deliver/cmnext_b2_deliver_rgbdel.pth (md5 e3ba84b58cf38b22117a82adf17c61c6)"
        expected_miou: 52.34
      CAFofficial:
        label: CAFuser
        role: baseline
        status: ready
        source: /drone_nas/drone/personal/jemo_maeng/src/Project/drone/drone-MemorySAM/analysis_logs/baseline_official_dump_20261104/cafuser_official/test/pred     # 1024 grid (analysis report 20261104-185440)
        resize_from: 1024                              # nearest to GT size, same as the scoring (common.resize_nearest)
        ckpt: "NAS ckpts/cafuser_official_deliver/cafuser_swin_tiny_bs8_200k_deliver_clde.pth (md5 e5b6f9ec1211384a8255f8fdcb557684)"
        expected_miou: 55.78
      DGFb:
        label: DGFusion (retrained)
        role: baseline
        status: pending
        note: "weights and dumps on lab servers (unreachable since 2026-10-30); analysis inbox 20261102-131217"

