# Which scenes go into which qualitative figure. THIS is the file to edit when a scene should change.
# After editing:  bash figures/qualbank/make.sh figs     (re-renders figures and rebuilds the PDF)
#
# A row is either
#   {label: Night, pick: {group: night, kind: top, rank: 1}}     -> looked up in figures/source_data/qualbank/<dataset>_candidates.csv
#   {label: Night, image: img/night/test/MAP_7_point19/064850_rgb_front}   -> any image of the split (see <dataset>_per_image.csv)
# kind = top (ours ahead the most) | reverse (a compared model ahead the most) | typical (near the median gap)
#        | class (largest gain on one thin class; group = the class name, e.g. Pole)
# columns: rgb, input (= the row's `input:` sensor, e.g. lidar), gt, or any model key of figures/qualbank/registry.yaml (bank must hold it)
# errors: true -> pixels that agree with the ground truth are faded, so colour = error

defaults:
  dataset: deliver
  # user 2026-11-04: published baselines with released weights, release order; no ablation column
  columns: [rgb, gt, CMNeXt, CAFofficial, DGFofficial, A2s821]
  errors: true

figures:
  fig_adverse_deliver:            # main text Fig. adverse
    rows:
      - {label: Sun,      pick: {group: sun, kind: top, rank: 1}}
      - {label: Cloud,    pick: {group: cloud, kind: top, rank: 1}}
      - {label: Rain,     pick: {group: rain, kind: top, rank: 1}}
      - {label: Fog,      pick: {group: fog, kind: top, rank: 1}}
      - {label: Night,    pick: {group: night, kind: top, rank: 1}}
      - {label: Low exp., pick: {group: low_exposure, kind: top, rank: 1}}
  fig_reverse_deliver:            # limitations: where a baseline is best
    rows:
      - {label: Sun,      pick: {group: sun, kind: reverse, rank: 1}}
      - {label: Cloud,    pick: {group: cloud, kind: reverse, rank: 1}}
      - {label: Rain,     pick: {group: rain, kind: reverse, rank: 1}}
      - {label: Fog,      pick: {group: fog, kind: reverse, rank: 1}}
      - {label: Night,    pick: {group: night, kind: reverse, rank: 1}}
      - {label: Low exp., pick: {group: low_exposure, kind: reverse, rank: 1}}
  fig_supp_deliver_1:             # appendix
    rows:
      - {label: "Sun #2",   pick: {group: sun, kind: top, rank: 2}}
      - {label: "Sun #3",   pick: {group: sun, kind: top, rank: 3}}
      - {label: "Cloud #2", pick: {group: cloud, kind: top, rank: 2}}
      - {label: "Cloud #3", pick: {group: cloud, kind: top, rank: 3}}
  fig_supp_deliver_2:
    rows:
      - {label: "Rain #2", pick: {group: rain, kind: top, rank: 2}}
      - {label: "Rain #3", pick: {group: rain, kind: top, rank: 3}}
      - {label: "Fog #2",  pick: {group: fog, kind: top, rank: 2}}
      - {label: "Fog #3",  pick: {group: fog, kind: top, rank: 3}}
  fig_supp_deliver_3:
    rows:
      - {label: "Night #2",     pick: {group: night, kind: top, rank: 2}}
      - {label: "Night #3",     pick: {group: night, kind: top, rank: 3}}
      - {label: "Low exp. #2",  pick: {group: low_exposure, kind: top, rank: 2}}
      - {label: "Low exp. #3",  pick: {group: low_exposure, kind: top, rank: 3}}
  fig_typical_deliver:            # appendix: scenes near the median gap of each condition (not cherry-picked)
    rows:
      - {label: Sun,      pick: {group: sun, kind: typical, rank: 1}}
      - {label: Cloud,    pick: {group: cloud, kind: typical, rank: 1}}
      - {label: Rain,     pick: {group: rain, kind: typical, rank: 1}}
      - {label: Fog,      pick: {group: fog, kind: typical, rank: 1}}
      - {label: Night,    pick: {group: night, kind: typical, rank: 1}}
      - {label: Low exp., pick: {group: low_exposure, kind: typical, rank: 1}}
  fig_thin_deliver:               # analysis: largest thin-class gain of ours over the compared models
    rows:
      - {label: Pole,         pick: {group: Pole, kind: class, rank: 1}}
      - {label: TrafficLight, pick: {group: TrafficLight, kind: class, rank: 1}}
      - {label: Pedestrian,   pick: {group: Pedestrian, kind: class, rank: 1}}
      - {label: Static,       pick: {group: Static, kind: class, rank: 1}}
  fig_cases_deliver:              # DELIVER's built-in sensor-failure cases (sequence suffix in the test split)
    columns: [input, gt, CMNeXt, CAFofficial, DGFofficial, A2s821]
    rows:
      - {label: Overexposure,  input: rgb,   pick: {group: overexposure, kind: top, rank: 1}}
      - {label: Motion blur,   input: rgb,   pick: {group: motionblur, kind: top, rank: 1}}
      - {label: LiDAR jitter,  input: lidar, pick: {group: lidarjitter, kind: top, rank: 1}}
      - {label: Event low-res, input: event, pick: {group: eventlowres, kind: top, rank: 1}}
  fig_cases_reverse_deliver:
    columns: [input, gt, CMNeXt, CAFofficial, DGFofficial, A2s821]
    rows:
      - {label: Overexposure,  input: rgb,   pick: {group: overexposure, kind: reverse, rank: 1}}
      - {label: Motion blur,   input: rgb,   pick: {group: motionblur, kind: reverse, rank: 1}}
      - {label: LiDAR jitter,  input: lidar, pick: {group: lidarjitter, kind: reverse, rank: 1}}
      - {label: Event low-res, input: event, pick: {group: eventlowres, kind: reverse, rank: 1}}
  fig_tl_deliver:                 # analysis: TrafficLight false positives added by the high-resolution path
    # scenes = NAS analysis_logs/a2_tl_fp_scenes_20261022/README.md (top-20 by A2 FP - Q2 FP, one per condition)
    columns: [rgb, gt, Q2s821, A2s821]
    rows:
      - {label: Sun,   image: img/sun/test/MAP_10_point21/002500_rgb_front}
      - {label: Cloud, image: img/cloud/test/MAP_10_point92/044650_rgb_front}
      - {label: Night, image: img/night/test/MAP_10_point15/001350_rgb_front}
      - {label: Rain,  image: img/rain/test/MAP_10_point23_motionblur/097650_rgb_front}
  fig_adverse_muses:              # main text: MUSES counterpart of fig_adverse_deliver (official val, real adverse conditions)
    dataset: muses
    columns: [rgb, gt, CAFofficial, DGFofficial, A2m4]   # no released CMNeXt MUSES weights
    rows:
      - {label: Fog day,     pick: {group: fog_day,     kind: top, rank: 1}}
      - {label: Fog night,   pick: {group: fog_night,   kind: top, rank: 1}}
      - {label: Rain day,    image: rain/day/REC0088_frame_275845_frame_camera}   # user 2026-11-11 'large visible difference': largest error-area gain (muses_area_gain.csv: ours 4.0% vs 18.0/18.4% wrong pixels)
      - {label: Snow night,  pick: {group: snow_night,  kind: top, rank: 1}}
  fig_failure_deliver:            # main text Fig. 3: one row per corrupted-input setting (row dataset = deliver_s1..s4)
    # row scene = the largest per-image gap (ours - best of CMNeXt/CAFuser/DGFusion) over the six weather/lighting groups of that setting
    dataset: deliver_s1
    columns: [rgb, gt, CMNeXt, CAFofficial, DGFofficial, A2s821]
    rows:
      - {label: "Depth removed", dataset: deliver_s1, image: img/night/test/MAP_7_point15/017700_rgb_front}   # night
      - {label: "RGB removed", dataset: deliver_s2, image: img/night/test/MAP_7_point85/036400_rgb_front}   # night
      - {label: "LiDAR+event removed", dataset: deliver_s3, image: img/sun/test/MAP_7_point11/1168350_rgb_front}   # sun
      - {label: "RGB with heavy noise", dataset: deliver_s4, image: img/rain/test/MAP_7_point33/007950_rgb_front}   # rain (best scene was already the S3 row)
  fig_failure_reverse_deliver:    # appendix: counterpart of fig_failure_deliver, scene where a baseline leads ours the most per setting
    # row scene = most negative delta over the six weather/lighting groups (reverse, rank 1); S3 takes its next scene because the S2 scene repeats
    dataset: deliver_s1
    columns: [rgb, gt, CMNeXt, CAFofficial, DGFofficial, A2s821]
    rows:
      - {label: "Depth removed", dataset: deliver_s1, image: img/rain/test/MAP_7_point53/067650_rgb_front}   # rain, delta -0.7
      - {label: "RGB removed", dataset: deliver_s2, image: img/rain/test/MAP_7_point3/015450_rgb_front}   # rain, -11.7
      - {label: "LiDAR+event removed", dataset: deliver_s3, image: img/cloud/test/MAP_7_point82/051750_rgb_front}   # cloud, -9.9
      - {label: "RGB with heavy noise", dataset: deliver_s4, image: img/rain/test/MAP_10_point93/065200_rgb_front}   # rain, -8.6
  fig_normal_muses:               # main text (user 2026-11-11): MUSES clear weather, where ours leads the most
    dataset: muses
    columns: [rgb, gt, CAFofficial, DGFofficial, A2m4]
    rows:
      - {label: "Clear day #1",   pick: {group: clear_day,   kind: top, rank: 1}}
      - {label: "Clear day #2",   pick: {group: clear_day,   kind: top, rank: 2}}
      - {label: "Clear night #1", pick: {group: clear_night, kind: top, rank: 1}}
  fig_supp_muses:                 # appendix: MUSES scenes not in the two main figures
    dataset: muses
    columns: [rgb, gt, CAFofficial, DGFofficial, A2m4]
    rows:
      - {label: "Clear night #2", pick: {group: clear_night, kind: top, rank: 2}}
      - {label: Rain night,       pick: {group: rain_night,  kind: top, rank: 1}}
      - {label: Snow day,         pick: {group: snow_day,    kind: top, rank: 1}}
  fig_reverse_muses:              # appendix: MUSES scenes where a baseline leads ours the most
    dataset: muses
    columns: [rgb, gt, CAFofficial, DGFofficial, A2m4]
    rows:
      - {label: Fog day,     pick: {group: fog_day,     kind: reverse, rank: 1}}
      - {label: Fog night,   pick: {group: fog_night,   kind: reverse, rank: 1}}
      - {label: Rain night,  pick: {group: rain_night,  kind: reverse, rank: 1}}
      - {label: Snow night,  pick: {group: snow_night,  kind: reverse, rank: 1}}
  fig_mcubes:                     # appendix: MCubeS test, released-weight baselines (analysis report inbox 20261111-001754)
    dataset: mcubes
    columns: [rgb, gt, CMNeXt, MMSFormer, A2c2d2s827]
    rows:
      - {label: "Top #1",   pick: {group: outscene, kind: top, rank: 1}}
      - {label: "Top #2",   pick: {group: outscene, kind: top, rank: 2}}
      - {label: "Typical",  pick: {group: outscene, kind: typical, rank: 1}}
      - {label: "Reverse",  pick: {group: outscene, kind: reverse, rank: 1}}
